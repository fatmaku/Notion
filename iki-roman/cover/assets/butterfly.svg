      <stop offset="0%" stop-color="#bfefff"/>
      <stop offset="45%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0b4f8a"/>
    </radialGradient>
    <radialGradient id="wing2" cx="40%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#e3f7ff"/>
      <stop offset="50%" stop-color="#3fb0ea"/>
      <stop offset="100%" stop-color="#0a3d6e"/>
