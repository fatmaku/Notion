  <!-- left lower wing -->
  <path d="M100 98 C 84 110, 60 118, 44 140 C 36 152, 48 166, 66 160 C 84 154, 96 130, 100 112 Z" fill="url(#wing2)" stroke="#062a4a" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- right lower wing -->
