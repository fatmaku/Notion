  <!-- wing markings -->
  <g fill="#062a4a" opacity="0.85">
    <circle cx="44" cy="58" r="6"/><circle cx="156" cy="58" r="6"/>
    <circle cx="62" cy="140" r="3.5"/><circle cx="138" cy="140" r="3.5"/>
  </g>
  <g fill="#ffffff" opacity="0.9">
    <circle cx="36" cy="72" r="2.6"/><circle cx="164" cy="72" r="2.6"/>
    <circle cx="26" cy="52" r="1.8"/><circle cx="174" cy="52" r="1.8"/>
  </g>
  <!-- body -->
  <ellipse cx="100" cy="104" rx="5" ry="26" fill="#0b2340" stroke="#062a4a" stroke-width="1.5"/>
  <circle cx="100" cy="76" r="5.5" fill="#0b2340"/>
  <!-- antennae -->
  <path d="M97 72 C 90 58, 80 52, 72 50" fill="none" stroke="#0b2340" stroke-width="2" stroke-linecap="round"/>
  <path d="M103 72 C 110 58, 120 52, 128 50" fill="none" stroke="#0b2340" stroke-width="2" stroke-linecap="round"/>
  <circle cx="72" cy="50" r="2.4" fill="#0b2340"/><circle cx="128" cy="50" r="2.4" fill="#0b2340"/>
