  </defs>
  <!-- left upper wing -->
  <path d="M100 92 C 78 40, 30 18, 14 42 C 2 60, 20 92, 60 100 C 78 104, 92 100, 100 92 Z" fill="url(#wing)" stroke="#062a4a" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- right upper wing -->
