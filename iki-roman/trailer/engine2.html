<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İki Roman – Fragman Motoru</title>
<style>
@font-face{font-family:'Cinzel';src:url('fonts/Cinzel-400.ttf') format('truetype');font-weight:400}
@font-face{font-family:'Cinzel';src:url('fonts/Cinzel-700.ttf') format('truetype');font-weight:700}
@font-face{font-family:'Cinzel';src:url('fonts/Cinzel-900.ttf') format('truetype');font-weight:900}
@font-face{font-family:'Literata';src:url('fonts/Literata-400.ttf') format('truetype');font-weight:400;font-style:normal}
@font-face{font-family:'Literata';src:url('fonts/Literata-400-italic.ttf') format('truetype');font-weight:400;font-style:italic}
@font-face{font-family:'Literata';src:url('fonts/Literata-600.ttf') format('truetype');font-weight:600;font-style:normal}
@font-face{font-family:'Literata';src:url('fonts/Literata-700.ttf') format('truetype');font-weight:700;font-style:normal}
:root{--gold:#E6C878;--gold2:#C9A24E;--cream:#EFE6D3;--night:#0A1020;--warm:#1A0F08;--red:#C8102E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#000;transform-origin:0 0}
#world{position:absolute;inset:0;will-change:transform}
.scene{position:absolute;inset:0;overflow:hidden;opacity:0;visibility:hidden}
.art{position:absolute;left:50%;top:50%;will-change:transform}
#s-shared .half{position:absolute;top:0;bottom:0;width:50%;overflow:hidden}
#s-shared .half.l{left:0}#s-shared .half.r{right:0}
#s-shared .half .art{will-change:transform}
#s-shared .seam{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:linear-gradient(180deg,rgba(230,200,120,0),var(--gold) 20%,var(--gold) 80%,rgba(230,200,120,0));box-shadow:0 0 18px rgba(230,200,120,.6)}
#s-fist{background:radial-gradient(ellipse 70% 60% at 50% 55%,#231409 0%,#120c14 45%,#070811 100%)}
#s-fist .bg{position:absolute;inset:0}
#s-fist .cards{position:absolute;left:0;top:0;perspective:1600px;transform-origin:50% 0}
.card{position:absolute;overflow:hidden;border-radius:5px;box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 0 1px rgba(230,200,120,.18);will-change:transform;background:#000}
.card img{position:absolute;display:block}
.sky{position:absolute;left:50%;bottom:0;transform:translateX(-50%);opacity:.2;-webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
#s-end{background:radial-gradient(ellipse 80% 70% at 50% 60%,#1c1208 0%,#0f0c10 50%,#070811 100%)}
#s-end .eglow{position:absolute;left:50%;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(230,200,120,.34),rgba(230,200,120,.10) 45%,rgba(230,200,120,0) 70%)}
.ecov{position:absolute;overflow:hidden;border-radius:4px;box-shadow:0 26px 70px rgba(0,0,0,.6),0 0 0 1px rgba(230,200,120,.22)}
.ecov img{display:block;width:100%;height:100%;object-fit:cover}
.ename{position:absolute;text-align:center;font-family:'Cinzel';font-weight:400;color:var(--gold);letter-spacing:.16em;white-space:nowrap}
.cta{position:absolute;left:0;right:0;text-align:center;font-family:'Cinzel';font-weight:700;color:var(--gold);letter-spacing:.14em}
.handle{position:absolute;left:0;right:0;text-align:center;font-family:'Literata';font-weight:400;color:rgba(239,230,211,.75);letter-spacing:.08em}
#dim{position:absolute;inset:0;background:rgba(6,6,10,.66);opacity:0}
#gfx{position:absolute;inset:0;pointer-events:none}
.g{position:absolute;will-change:transform,opacity;filter:drop-shadow(0 0 10px rgba(230,200,120,.35))}
.g svg{display:block;width:100%;height:100%;overflow:visible}
.g.green{filter:drop-shadow(0 0 14px rgba(120,220,150,.55))}
#texts{position:absolute;inset:0;pointer-events:none}
.q{position:absolute;left:0;right:0;text-align:center;font-family:'Cinzel';font-weight:400;color:var(--cream);text-shadow:0 2px 24px rgba(0,0,0,.7)}
.tblock{position:absolute;text-align:center}
.plate{position:absolute;left:-12%;right:-12%;top:-28%;bottom:-28%;background:radial-gradient(ellipse at center,rgba(6,5,4,.62),rgba(6,5,4,.30) 50%,rgba(6,5,4,0) 74%)}
.rule{position:relative;height:14px;margin:0 auto 14px}
.rule svg{display:block;width:100%;height:100%}
.line{position:relative;font-family:'Literata';font-weight:400;color:var(--cream);line-height:1.42;text-shadow:0 2px 6px rgba(0,0,0,.7),0 2px 26px rgba(0,0,0,.6)}
.line.abs{position:absolute;left:0;right:0}
.line .w{display:inline-block;will-change:opacity,transform}
.tcard{position:absolute;left:0;right:0;text-align:center}
.tcard .tt{font-family:'Cinzel';font-weight:900;color:var(--gold);line-height:1.04;letter-spacing:.05em;text-shadow:0 2px 6px rgba(0,0,0,.6),0 0 40px rgba(230,200,120,.25)}
.tcard .ts{font-family:'Cinzel';font-weight:400;color:var(--gold);letter-spacing:.14em;margin-top:.5em}
.tcard .ta{font-family:'Cinzel';font-weight:400;color:var(--cream);letter-spacing:.28em;text-transform:uppercase;margin-top:1.1em}
.tcard .orn{margin:0 auto .5em}
.tag{position:absolute;text-align:center}
.tag .t1{font-family:'Cinzel';font-weight:700;color:var(--gold);letter-spacing:.08em;line-height:1.28;text-shadow:0 2px 10px rgba(0,0,0,.7),0 0 36px rgba(230,200,120,.25)}
.tag .t2{font-family:'Literata';font-style:italic;font-weight:400;color:var(--cream);line-height:1.4;text-shadow:0 2px 10px rgba(0,0,0,.7)}
#fx{position:absolute;left:0;top:0;pointer-events:none}
#bfly{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;filter:drop-shadow(0 0 12px rgba(120,200,255,.7))}
#bfly .wl,#bfly .wr{transform-box:fill-box}
#bfly .wl{transform-origin:100% 50%}
#bfly .wr{transform-origin:0% 50%}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div class="scene" id="s-by"></div>
    <div class="scene" id="s-sa"></div>
    <div class="scene" id="s-shared">
      <div class="half l" id="half-l"></div><div class="half r" id="half-r"></div>
      <div class="seam"></div>
    </div>
    <div class="scene" id="s-fist">
      <div class="sky" id="sky1"></div>
      <div class="cards" id="cards">
        <div class="card" id="card-sa"><img id="cimg-sa"></div>
        <div class="card" id="card-by"><img id="cimg-by"></div>
      </div>
    </div>
    <div class="scene" id="s-end">
      <div class="eglow" id="eglow"></div>
      <div class="sky" id="sky2"></div>
      <div class="ecov" id="ecov-sa"><img id="eimg-sa"></div>
      <div class="ecov" id="ecov-by"><img id="eimg-by"></div>
      <div class="ename" id="ename-sa" lang="tr"></div>
      <div class="ename" id="ename-by" lang="tr"></div>
      <div class="cta" id="cta"></div>
      <div class="handle" id="handle"></div>
    </div>
    <div id="dim"></div>
    <div id="gfx"></div>
    <div id="texts"></div>
    <svg id="bfly" viewBox="0 0 200 180">
      <defs>
        <radialGradient id="bw1" cx="35%" cy="40%" r="75%"><stop offset="0%" stop-color="#bfefff"/><stop offset="45%" stop-color="#4fc3f7"/><stop offset="100%" stop-color="#0b4f8a"/></radialGradient>
        <radialGradient id="bw2" cx="40%" cy="45%" r="70%"><stop offset="0%" stop-color="#e3f7ff"/><stop offset="50%" stop-color="#3fb0ea"/><stop offset="100%" stop-color="#0a3d6e"/></radialGradient>
      </defs>
      <g class="wl">
        <path d="M100 92 C 78 40, 30 18, 14 42 C 2 60, 20 92, 60 100 C 78 104, 92 100, 100 92 Z" fill="url(#bw1)" stroke="#062a4a" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M100 98 C 84 110, 60 118, 44 140 C 36 152, 48 166, 66 160 C 84 154, 96 130, 100 112 Z" fill="url(#bw2)" stroke="#062a4a" stroke-width="2.2" stroke-linejoin="round"/>
        <circle cx="44" cy="58" r="6" fill="#062a4a" opacity=".85"/><circle cx="62" cy="140" r="3.5" fill="#062a4a" opacity=".85"/>
        <circle cx="36" cy="72" r="2.6" fill="#fff" opacity=".9"/><circle cx="26" cy="52" r="1.8" fill="#fff" opacity=".9"/>
      </g>
      <g class="wr">
        <path d="M100 92 C 122 40, 170 18, 186 42 C 198 60, 180 92, 140 100 C 122 104, 108 100, 100 92 Z" fill="url(#bw1)" stroke="#062a4a" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M100 98 C 116 110, 140 118, 156 140 C 164 152, 152 166, 134 160 C 116 154, 104 130, 100 112 Z" fill="url(#bw2)" stroke="#062a4a" stroke-width="2.2" stroke-linejoin="round"/>
        <circle cx="156" cy="58" r="6" fill="#062a4a" opacity=".85"/><circle cx="138" cy="140" r="3.5" fill="#062a4a" opacity=".85"/>
        <circle cx="164" cy="72" r="2.6" fill="#fff" opacity=".9"/><circle cx="174" cy="52" r="1.8" fill="#fff" opacity=".9"/>
      </g>
      <ellipse cx="100" cy="104" rx="5" ry="26" fill="#0b2340" stroke="#062a4a" stroke-width="1.5"/>
      <circle cx="100" cy="76" r="5.5" fill="#0b2340"/>
      <path d="M97 72 C 90 58, 80 52, 72 50 M103 72 C 110 58, 120 52, 128 50" fill="none" stroke="#0b2340" stroke-width="2" stroke-linecap="round"/>
      <circle cx="72" cy="50" r="2.4" fill="#0b2340"/><circle cx="128" cy="50" r="2.4" fill="#0b2340"/>
    </svg>
  </div>
  <canvas id="fx"></canvas>
  <img id="src-sa" style="display:none"><img id="src-by" style="display:none">
</div>
<script>
/* İki Roman book-trailer engine. URL: engine2.html?capture&format=16x9|9x16|1x1&lang=tr|en|de[&cut=60|30][&t=12.5]
   Exposes window.render(t) and window.DUR; without ?capture it previews in real time (space = pause, ←/→ = ±1 s). */
const Q = new URLSearchParams(location.search);
const FORMAT = Q.get('format') || '16x9', LANG = (Q.get('lang') || 'tr').toLowerCase();
document.write(`<script src="config/${LANG}.js"><\/script>`);
</script>
<script>
const FORMATS = { '16x9': { W: 1920, H: 1080, cut: '60' }, '9x16': { W: 1080, H: 1920, cut: '30' }, '1x1': { W: 1080, H: 1080, cut: '30' } };
const FM = FORMATS[FORMAT] || FORMATS['16x9'];
const W = FM.W, H = FM.H, U = Math.min(W, H);
const CFG = window.CFG, T = CFG.text;
const CUTKEY = Q.get('cut') || FM.cut, CUT = CFG.cuts[CUTKEY], DUR = CUT.dur;
const S = CUT.scenes;
document.documentElement.lang = LANG;   // Cinzel has Turkish locale forms (dotted small-cap i): only wanted for TR text

/* ---------- responsive layout (fractions of W / H; font sizes as fractions of U = min(W,H)) ----------
   kbBy / kbSa: Ken-Burns [fx0, fy0, zoom0, fx1, fy1, zoom1] – framed so that the covers' baked-in typography
   (top ~44 % of the panel) stays out of frame; the push-in ends on the fist. */
const LAYOUTS = {
  '16x9': { safe: [.05, .95, .05, .95], qY: .50, qSize: .052, qW: .80,
    gfxY: .40, gfxS: 1.0, textTop: .60, textW: .64, lineSize: .046, titleY: .50, titleSize: .115,
    kbBy: [.5, .66, 1.08, .5, .67, 1.22], kbSa: [.45, .66, 1.08, .55, .67, 1.22],
    shGfxY: .40, shGfxS: 1.3, shTextY: .70,
    cardH: .80, cardTop: .04, settle: .84, tagTop: .775, tagSize: .046, claimSize: .030, tagW: .86,
    covH: .58, covTop: .07, covGap: .05, namesY: .685, ctaY: .775, handleY: .87, skyH: .09, skyW: .45 },
  '9x16': { safe: [.06, .94, .15, .80], qY: .45, qSize: .05, qW: .86,
    gfxY: .33, gfxS: 1.0, textTop: .50, textW: .86, lineSize: .046, titleY: .45, titleSize: .11,
    kbBy: [.42, .72, 1.9, .40, .70, 2.1], kbSa: [.55, .72, 1.9, .58, .70, 2.1],
    shGfxY: .36, shGfxS: 1.2, shTextY: .58,
    cardH: .40, cardTop: .24, settle: .90, tagTop: .63, tagSize: .05, claimSize: .029, tagW: .88,
    covH: .36, covTop: .18, covGap: .06, namesY: .56, ctaY: .64, handleY: .70, skyH: .07, skyW: .9 },
  '1x1': { safe: [.06, .94, .06, .94], qY: .50, qSize: .05, qW: .86,
    gfxY: .36, gfxS: .9, textTop: .58, textW: .86, lineSize: .046, titleY: .50, titleSize: .11,
    kbBy: [.5, .71, 1.35, .5, .70, 1.5], kbSa: [.5, .71, 1.35, .5, .70, 1.5],
    shGfxY: .38, shGfxS: 1.1, shTextY: .68,
    cardH: .60, cardTop: .06, settle: .86, tagTop: .64, tagSize: .046, claimSize: .028, tagW: .90,
    covH: .50, covTop: .08, covGap: .06, namesY: .61, ctaY: .72, handleY: .82, skyH: .08, skyW: .7 }
};
const L = LAYOUTS[FORMAT] || LAYOUTS['16x9'];
const SAFE = { l: L.safe[0] * W, r: L.safe[1] * W, t: L.safe[2] * H, b: L.safe[3] * H };

/* ---------- helpers ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const vis = (t, a, b, fi = .8, fo = .6) => Math.min(prog(t, a, a + fi), 1 - prog(t, b - fo, b));
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x) };
const $ = id => document.getElementById(id);
const px = v => v.toFixed(2) + 'px';
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };

/* ---------- assets ---------- */
const A = '../assets/upscaled/';
const LU = LANG.toUpperCase();
const IMG = { saFront: A + `SA_front_${LANG}.png`, byFront: A + `BY_front_${LANG}.png`, saEbook: `../cover/out/SA/${LU}/eBook-Cover.jpg`, byEbook: `../cover/out/BY/${LU}/eBook-Cover.jpg` };   // Titel sind je Sprache gesetzt (YOLCU / THE TRAVELLER / DER REISENDE …)
const FRONT = { w: 1461, h: 2048, bleed: 30 };              // front panel incl. 3 mm bleed
const TRIM = { w: FRONT.w - 2 * FRONT.bleed, h: FRONT.h - 2 * FRONT.bleed };
const CONTACT_Y = 0.656;                                    // fists meet at this fraction of the trimmed panel height
const EBOOK = { w: 1600, h: 2560 };

/* ---------- stage geometry ---------- */
const stage = $('stage'), world = $('world');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const fx = $('fx'); fx.width = W; fx.height = H; const cx = fx.getContext('2d');
$('src-sa').src = IMG.saFront; $('src-by').src = IMG.byFront;

/* cover-fit an image into a box */
function coverFit(iw, ih, bw, bh) { const s = Math.max(bw / iw, bh / ih); return { w: iw * s, h: ih * s }; }
/* a canvas element placed like an object-fit:cover image inside a box (centre anchored) */
function placeArt(parent, canvas, bw, bh) {
  const f = coverFit(canvas.width, canvas.height, bw, bh);
  canvas.className = 'art'; canvas.style.width = px(f.w); canvas.style.height = px(f.h); canvas.style.marginLeft = px(-f.w / 2); canvas.style.marginTop = px(-f.h / 2);
  canvas._f = f; canvas._box = [bw, bh]; parent.insertBefore(canvas, parent.firstChild); return canvas;
}
/* Ken-Burns transform: focus point (fx,fy in image fractions) at the box centre, scale s, clamped to keep coverage */
function kb(el, fx, fy, s) {
  const { w, h } = el._f, [bw, bh] = el._box;
  let tx = (0.5 - fx) * w * s, ty = (0.5 - fy) * h * s;
  const mx = Math.max(0, (w * s - bw) / 2), my = Math.max(0, (h * s - bh) / 2);
  tx = clamp(tx, -mx, mx); ty = clamp(ty, -my, my);
  el.style.transform = `translate(${tx.toFixed(2)}px,${ty.toFixed(2)}px) scale(${s.toFixed(4)})`;
}
/* Baked once at start-up (no per-frame CSS filters): the front art with a darkening gradient over its lower half
   (keeps the cream lines readable over the fist / skyline) and blurred, darkened colour fields for the split screen. */
const ART = {};
function bakeArt(img, key) {
  const c = mkCanvas(img.naturalWidth, img.naturalHeight), g = c.getContext('2d');
  g.drawImage(img, 0, 0, c.width, c.height);
  g.fillStyle = 'rgba(6,5,8,.10)'; g.fillRect(0, 0, c.width, c.height);
  const lg = g.createLinearGradient(0, c.height * .48, 0, c.height); lg.addColorStop(0, 'rgba(8,6,4,0)'); lg.addColorStop(.5, 'rgba(8,6,4,.42)'); lg.addColorStop(1, 'rgba(8,6,4,.80)');
  g.fillStyle = lg; g.fillRect(0, 0, c.width, c.height);
  ART[key] = c; return c;
}
function bakeHalf(img, bw, bh) {
  const f = coverFit(img.naturalWidth, img.naturalHeight, bw, bh), c = mkCanvas(f.w * .6, f.h * .6), g = c.getContext('2d');
  g.filter = 'blur(12px) brightness(.38) saturate(.85)'; g.drawImage(img, 0, 0, c.width, c.height); g.filter = 'none';
  if (!('filter' in g)) { g.fillStyle = 'rgba(4,4,8,.62)'; g.fillRect(0, 0, c.width, c.height); }
  return c;
}

/* ---------- fist-bump cards ---------- */
const cardH = L.cardH * H, cardW = cardH * TRIM.w / TRIM.h, cardTop = L.cardTop * H;
const cards = $('cards'); cards.style.width = W + 'px'; cards.style.height = H + 'px';
const CARD = { sa: $('card-sa'), by: $('card-by') };
function setCard(el, img, src, left, side) {
  el.style.width = px(cardW); el.style.height = px(cardH); el.style.left = px(left); el.style.top = px(cardTop);
  el.style.transformOrigin = side === 'sa' ? '100% 50%' : '0% 50%';
  const iw = cardW * FRONT.w / TRIM.w, ih = cardH * FRONT.h / TRIM.h;
  img.src = src; img.style.width = px(iw); img.style.height = px(ih);
  img.style.left = px(-cardW * FRONT.bleed / TRIM.w); img.style.top = px(-cardH * FRONT.bleed / TRIM.h);
}
setCard(CARD.sa, $('cimg-sa'), IMG.saFront, W / 2 - cardW, 'sa');
setCard(CARD.by, $('cimg-by'), IMG.byFront, W / 2, 'by');
const CONTACT = { x: W / 2, y: cardTop + CONTACT_Y * cardH };

/* skyline silhouette (from cover/assets/skyline.svg) */
const SKY = `<svg viewBox="0 0 240 100" preserveAspectRatio="xMidYMax meet"><defs><linearGradient id="skg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3dc9a"/><stop offset="1" stop-color="#b8892e"/></linearGradient></defs><g fill="url(#skg)"><rect x="0" y="88" width="240" height="4" rx="2"/><rect x="30" y="34" width="5" height="54"/><polygon points="27,34 38,34 32.5,22"/><rect x="28" y="52" width="9" height="2.5"/><path d="M60 88 L60 66 A40 40 0 0 1 140 66 L140 88 Z"/><rect x="98" y="16" width="4" height="12"/><circle cx="100" cy="14" r="3"/><path d="M44 88 L44 76 A12 12 0 0 1 68 76 L68 88 Z"/><path d="M132 88 L132 76 A12 12 0 0 1 156 76 L156 88 Z"/><rect x="165" y="34" width="5" height="54"/><polygon points="162,34 173,34 167.5,22"/><rect x="163" y="52" width="9" height="2.5"/><rect x="200" y="44" width="16" height="44"/><polygon points="196,46 220,46 208,26"/><rect x="198" y="46" width="20" height="4"/></g></svg>`;
for (const id of ['sky1', 'sky2']) { const e = $(id); e.innerHTML = SKY; e.style.width = px(L.skyW * W); e.style.height = px(L.skyH * H); e.firstChild.style.width = '100%'; e.firstChild.style.height = '100%'; }

/* ---------- end card ---------- */
const covH = L.covH * H, covW = covH * EBOOK.w / EBOOK.h, covGap = L.covGap * W, covTop = L.covTop * H;
const covL = W / 2 - covGap / 2 - covW, covR = W / 2 + covGap / 2;
function setCov(el, img, src, left) { el.style.width = px(covW); el.style.height = px(covH); el.style.left = px(left); el.style.top = px(covTop); img.src = src; }
setCov($('ecov-sa'), $('eimg-sa'), IMG.saEbook, covL);
setCov($('ecov-by'), $('eimg-by'), IMG.byEbook, covR);
const eglow = $('eglow'); eglow.style.top = px(covTop + covH * .55); eglow.style.width = px(covW * 2 + covGap + U * .5); eglow.style.height = px(covH * 1.5);
for (const [id, name, left] of [['ename-sa', T.sa.author, covL], ['ename-by', T.by.author, covR]]) {
  const e = $(id); e.textContent = name; e.style.left = px(left - covW * .3); e.style.width = px(covW * 1.6); e.style.top = px(L.namesY * H); e.style.fontSize = px(U * .025);
}
$('cta').textContent = T.cta; $('cta').style.top = px(L.ctaY * H); $('cta').style.fontSize = px(U * .042);

  const P = [[-.08, .62], [.30, .50], [.50, .30], [.72, .38], [1.10, .16]];
  const seg = Math.min(P.length - 2, Math.floor(p * (P.length - 1))), lp = ease(p * (P.length - 1) - seg);
  const x = lerp(P[seg][0], P[seg + 1][0], lp) * W, y = lerp(P[seg][1], P[seg + 1][1], lp) * H + Math.sin(t * 2.6) * U * .012;
  return { x, y, dx: P[seg + 1][0] - P[seg][0], s: .8 + .2 * Math.sin(p * Math.PI) };
}

/* ---------- main render ---------- */
function render(t) {
  const frame = Math.floor(t * 60);
  /* --- scene opacities --- */
  const oBy = t < S.by[0] ? 0 : Math.min(prog(t, S.by[0], S.by[0] + 1.0), t < S.sa[1] ? 1 : 0);
  const oSa = t < S.sa[0] ? 0 : (t < S.shared[1] ? prog(t, S.sa[0], S.sa[0] + 1.0) : 0);
  const oSh = t < S.shared[0] ? 0 : (t < S.fist[1] ? prog(t, S.shared[0], S.shared[0] + 1.0) : 0);
  const oFi = t < S.fist[0] ? 0 : (t < S.end[1] ? prog(t, S.fist[0], S.fist[0] + .8) : 0);
  const oEn = t < S.end[0] - .4 ? 0 : prog(t, S.end[0] - .4, S.end[0] + .6);
  cx.clearRect(0, 0, W, H);
  /* --- BY scene (slow push-in ending on the fist) --- */
  if (show(SCN.by, oBy)) {
    const p = ease(prog(t, S.by[0], S.by[1] + .5)), k = L.kbBy;
    kb(ART.by, lerp(k[0], k[3], p), lerp(k[1], k[4], p), lerp(k[2], k[5], p));
    blit(SPR.warm, W * (.78 + Math.sin(t * .31) * .14), H * (.22 + Math.cos(t * .21) * .12), U * 1.4, (.32 + .14 * Math.sin(t * .8)) * oBy * (1 - oSa));
  }
  /* --- SA scene --- */
  if (show(SCN.sa, oSa)) {
    const p = ease(prog(t, S.sa[0], S.sa[1] + .5)), k = L.kbSa;
    kb(ART.sa, lerp(k[0], k[3], p), lerp(k[1], k[4], p), lerp(k[2], k[5], p));
    blit(SPR.cool, W * (.24 + Math.sin(t * .27) * .12), H * (.30 + Math.cos(t * .19) * .12), U * 1.5, (.4 + .16 * Math.sin(t * .7)) * oSa * (1 - oSh));
  }
  /* --- shared split scene --- */
  if (show(SCN.shared, oSh)) {
    const p = prog(t, S.shared[0], S.fist[1]);
    kb(ART.halfSa, .30, lerp(.40, .46, p), lerp(1.06, 1.14, p));   // moon side, blurred colour field
    kb(ART.halfBy, .62, lerp(.40, .46, p), lerp(1.06, 1.14, p));   // sunset side
    blit(SPR.green, W / 2, L.shGfxY * H, U * 1.3, .9 * oSh * (1 - oFi));
  }
  /* --- fist bump --- */
  let contact = null, imp = t - IMPACT;
  if (show(SCN.fist, oFi)) {
    const x = prog(t, S.fist[0], IMPACT), p = x * (.35 + .65 * x);           // accelerating into the impact
    const travel = cardW * .9, ang = 42 * (1 - p);
    let rec = 0; if (imp > 0 && imp < .5) { const q = imp / .5; rec = Math.sin(q * Math.PI) * (1 - q) * .035 * cardW; }
    const dx = (1 - p) * travel + rec;
    const fadeIn = prog(t, S.fist[0], S.fist[0] + .6);
    CARD.sa.style.transform = `translateX(${(-dx).toFixed(2)}px) rotateY(${(-ang).toFixed(2)}deg)`;
    CARD.by.style.transform = `translateX(${dx.toFixed(2)}px) rotateY(${ang.toFixed(2)}deg)`;
    CARD.sa.style.opacity = CARD.by.style.opacity = fadeIn.toFixed(3);
    const st = lerp(1, L.settle, ease(prog(t, IMPACT + .7, IMPACT + 1.7)));
    cards.style.transform = `scale(${st.toFixed(4)})`;
    contact = { x: CONTACT.x, y: cardTop + (CONTACT.y - cardTop) * st };
  }
  /* --- end card --- */
  const E = CUT.end;
  if (show(SCN.end, oEn)) {
    for (const [id, a] of [['ecov-sa', E.covers], ['ecov-by', E.covers + .15]]) { const q = easeOut(prog(t, a, a + 1.2)); const e = $(id); e.style.opacity = q.toFixed(3); e.style.transform = `translateY(${((1 - q) * U * .04).toFixed(2)}px)`; }
    for (const [id, a] of [['ename-sa', E.names], ['ename-by', E.names + .15], ['cta', E.cta], ['handle', E.handle]]) { const q = easeOut(prog(t, a, a + .9)); const e = $(id); e.style.opacity = q.toFixed(3); e.style.transform = `translateY(${((1 - q) * U * .02).toFixed(2)}px)`; }
    eglow.style.opacity = (.6 + .4 * prog(t, E.covers, E.covers + 2) + .08 * Math.sin(t * 1.3)).toFixed(3);
  }
  const B = oEn > 0 ? butterflyAt(t, E.butterfly) : null;
  if (B) { const flap = .3 + .7 * Math.abs(Math.sin(t * 11)); wl.style.transform = `scaleX(${flap.toFixed(3)})`; wr.style.transform = `scaleX(${flap.toFixed(3)})`; bf.style.display = 'block'; bf.style.transform = `translate(${B.x.toFixed(1)}px,${B.y.toFixed(1)}px) scale(${B.s.toFixed(3)}) rotate(${(-B.dx * 30).toFixed(1)}deg)`; bf.style.opacity = vis(t, E.butterfly[0], E.butterfly[1], .6, .8).toFixed(3); }
  else bf.style.display = 'none';
  /* --- dim for title cards --- */
  const dBy = drawTitle(TITLE.by, CUT.by.title, t), dSa = drawTitle(TITLE.sa, CUT.sa.title, t);
  dim.style.opacity = Math.max(dBy, dSa).toFixed(3);
  /* --- graphics --- */
  for (const k in GFX) drawGfx(GFX[k], t);
  { let d = 0; for (const k of CUT.shared.knocks) { const q = t - k; if (q >= 0 && q < .45) d = Math.max(d, Math.pow(1 - q / .45, 1.6)); } DOORFLASH.setAttribute('opacity', (d * .85).toFixed(3)); }
  /* --- texts --- */
  for (const k in BLOCKS) drawLines(BLOCKS[k], t);
  { const qs = CUT.question, o = vis(t, qs[0], qs[1], 1.1, .6); if (showD(qEl, o)) { const p = easeOut(prog(t, qs[0], qs[0] + 2.2)); qEl.style.letterSpacing = lerp(.22, .12, p).toFixed(3) + 'em'; qEl.style.transform = `translateY(-50%) scale(${lerp(1.03, 1, p).toFixed(4)})`; } }
  { const F = CUT.fist, on = t > F.tagline[0] - .05 && t < F.tagline[1] + .05; tag.style.display = on ? 'block' : 'none';
    if (on) { const out = 1 - prog(t, F.tagline[1] - .5, F.tagline[1]); const q1 = easeOut(prog(t, F.tagline[0], F.tagline[0] + 1.0)), q2 = easeOut(prog(t, F.claim[0], F.claim[0] + 1.0));
      tagT1.style.opacity = (q1 * out).toFixed(3); tagT1.style.transform = `translateY(${((1 - q1) * U * .02).toFixed(2)}px)`; tagT1.style.letterSpacing = lerp(.16, .08, q1).toFixed(3) + 'em';
      tagT2.style.opacity = (q2 * out).toFixed(3); tagT2.style.transform = `translateY(${((1 - q2) * U * .015).toFixed(2)}px)`; } }
  /* --- shake --- */
  const ke = knockEnv(t);
  let fl = 0, shake = ke * U * .004;
  if (imp >= 0 && imp < .9) { fl = imp < .06 ? imp / .06 * .9 : .9 * Math.pow(1 - (imp - .06) / .84, 2.2); shake = Math.max(shake, (1 - imp / .5) * U * .014 * (imp < .5)); }
  if (shake > 0.05) { const sx = (hash(frame * 2) - .5) * 2 * shake, sy = (hash(frame * 2 + 1) - .5) * 2 * shake; world.style.transform = `translate(${sx.toFixed(2)}px,${sy.toFixed(2)}px) scale(${(1 + shake * 2.2 / U).toFixed(4)})`; }
  else world.style.transform = 'none';
  /* --- fx canvas (on top): sunburst, dust, vignette, knock flash, impact flash, grain, fade --- */
  if (contact && imp > -.35) {
    const e = imp < 0 ? prog(imp, -.35, 0) * .25 : Math.min(1, imp / .9) * lerp(1, .32, prog(imp, 1.0, 3.0));
    const a = e * oFi * (1 - oEn); if (a > 0) { cx.save(); cx.translate(contact.x, contact.y); cx.rotate(t * .08); cx.scale(.4 + .6 * e, .4 + .6 * e); cx.globalCompositeOperation = 'lighter'; cx.globalAlpha = a; cx.drawImage(SPR.rays, -SPR.rays.width / 2, -SPR.rays.height / 2); cx.restore(); }
  }
  const dustA = (oBy > 0 || oSa > 0 || oEn > 0) ? .9 : (oFi > 0 ? .5 : 0);
  if (dustA > 0) {
    cx.save(); cx.globalCompositeOperation = 'lighter';
    for (const d of DUST) {
      const y = ((d.y - t * d.sp) % H + H) % H, x = d.x + Math.sin(t * .5 + d.ph) * 22 * d.dr, r = d.r * 4;
      cx.globalAlpha = dustA * (.10 + .45 * Math.pow(Math.sin(t * 1.4 + d.ph) * .5 + .5, 3));
      cx.drawImage(SPR.dust, x - r, y - r, 2 * r, 2 * r);
    }
    cx.restore();
  }
  cx.drawImage(SPR.vignette, 0, 0);
  blit(SPR.knock, W / 2, H / 2, Math.max(W, H) * 1.3, ke * .6);
  if (fl > 0) { cx.fillStyle = `rgba(255,244,220,${fl.toFixed(3)})`; cx.fillRect(0, 0, W, H); }
  cx.save(); cx.translate(-Math.floor(hash(frame) * 256), -Math.floor(hash(frame + 7) * 256)); cx.fillStyle = SPR.grain[frame % 3]; cx.fillRect(0, 0, W + 256, H + 256); cx.restore();
  const bl = t < S.cold[1] ? 0 : prog(t, E.fadeOut, DUR); if (bl > 0) { cx.fillStyle = `rgba(0,0,0,${bl.toFixed(3)})`; cx.fillRect(0, 0, W, H); }
}
window.render = render; window.DUR = DUR; window.STAGE = { W, H, format: FORMAT, lang: LANG, cut: CUTKEY };

/* preload every face (title card / italic claim are display:none at t=0, so document.fonts.ready alone would not fetch them),
   decode all images, then bake the art canvases. */
const FONT_FACES = ['400 20px Cinzel', '700 20px Cinzel', '900 20px Cinzel', '400 20px Literata', 'italic 400 20px Literata', '600 20px Literata', '700 20px Literata'];
const loaded = i => i.complete && i.naturalWidth ? i.decode().catch(() => { }) : new Promise(r => { i.onload = () => i.decode().then(r, r); i.onerror = r; });
window.READY = Promise.all([...FONT_FACES.map(f => document.fonts.load(f, 'Şğıİ')), ...[...document.images].map(loaded)]).then(() => {
  const sa = $('src-sa'), by = $('src-by');
  placeArt(SCN.by, bakeArt(by, 'by'), W, H);
  placeArt(SCN.sa, bakeArt(sa, 'sa'), W, H);
  ART.halfSa = placeArt($('half-l'), bakeHalf(sa, W / 2, H), W / 2, H);
  ART.halfBy = placeArt($('half-r'), bakeHalf(by, W / 2, H), W / 2, H);
  sa.remove(); by.remove();
});

if (!Q.has('capture')) {
  const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `scale(${s})`; stage.style.marginLeft = ((innerWidth - W * s) / 2) + 'px'; stage.style.marginTop = ((innerHeight - H * s) / 2) + 'px'; };
  addEventListener('resize', fit); fit();
  let t0 = performance.now(), paused = false, tp = 0;
  if (Q.has('t')) { paused = true; tp = +Q.get('t'); }
  addEventListener('keydown', e => { if (e.code === 'Space') { if (paused) t0 = performance.now() - tp * 1000; else tp = (performance.now() - t0) / 1000; paused = !paused; } if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { const d = e.code === 'ArrowRight' ? 1 : -1; if (paused) tp = clamp(tp + d, 0, DUR); else t0 -= d * 1000; } });
  const loop = () => { const t = paused ? tp : ((performance.now() - t0) / 1000) % DUR; render(t); requestAnimationFrame(loop); };
  READY.then(() => requestAnimationFrame(loop));
}
</script>
</body>
