<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>LiveFX Overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/overlay.css">
  <!-- deferred: downloaded in parallel, executed in this order before DOMContentLoaded -->
  <script defer src="js/sounds.js"></script>
  <script defer src="js/schema.js"></script>
  <script defer src="js/fx.js"></script>
  <!-- 2.3 Zeichenfilm (docs/SKETCH.md): attaches through the renderer's sketch hook, so it loads after fx.js -->
  <link rel="stylesheet" href="css/sketch.css">
  <script defer src="js/sketch.js"></script>
  <script defer src="js/story-director.js"></script>
  <script defer src="js/bus.js"></script>
</head>
<body>
  <div id="stage"></div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const params = new URLSearchParams(location.search);
      const Schema = window.LiveFXSchema || null;

      // ?layout=portrait -> 9:16 layout (TikTok / IG live): effects stay out of the bottom chat area.
      if (params.get('layout') === 'portrait') document.body.classList.add('layout-portrait');

      const renderer = new LiveFXRenderer.Renderer(document.getElementById('stage'));
      const bus = new LiveFXBus.Bus({ role: 'overlay' });

      // ?theme=neon|pastel|minimal|kinderbuch pins the look (body[data-theme]); a `theme` bus message
      // switches it live unless the URL pinned one.
      const hasThemeParam = params.has('theme');
      renderer.setTheme(hasThemeParam ? params.get('theme') : 'neon');

      // ?volume=0.5 pins the master level; without it the server's remembered levels (state message) apply.
      // 2.2: `{type:'volume', volume, bus?}` – bus omitted = master (1.x senders), `sfx` / `ambient` otherwise.
      const hasVolumeParam = params.has('volume');
      const paramVolume = Number(params.get('volume'));
      if (hasVolumeParam && Number.isFinite(paramVolume)) renderer.setVolume('master', Math.min(1, Math.max(0, paramVolume)));
      const VOLUME_BUSES = (Schema && Schema.VOLUME_BUSES) || ['master', 'sfx', 'ambient'];
      function applyVolume(bus, v) {
        const b = VOLUME_BUSES.includes(bus) ? bus : 'master';
        if (b === 'master' && hasVolumeParam) return; // pinned by the URL
        if (typeof v === 'number' && Number.isFinite(v)) renderer.setVolume(b, Math.min(1, Math.max(0, v)));
      }

      // ?perf=auto|eco|high pins the performance mode (docs/PERFORMANCE.md); a `perf` bus message
      // ({type:'perf', perf}) switches it live unless the URL pinned one. Default: auto.
      const hasPerfParam = params.has('perf');
      renderer.setPerf(hasPerfParam ? params.get('perf') : 'auto');

      // 2.2 story band: ?story=band|full|frame, ?band=15..35 (percent), ?zone=full|edges|bottom|top pin that
      // key each; 2.3 adds ?bandpos=bottom|chat (portrait: band at the very bottom / above the chat zone) and
      // ?storystyle=emoji|sketch|mixed. `layout` bus messages / the state message merge the other keys live.
      const PARAM = { storyLayout: 'story', band: 'band', zone: 'zone', bandPosition: 'bandpos', storyStyle: 'storystyle' };
      const pinned = {};
      const initial = {};
      for (const k of Object.keys(PARAM)) {
        pinned[k] = params.has(PARAM[k]);
        initial[k] = params.get(PARAM[k]);
      }
      renderer.setLayout(initial);
      function applyLayout(raw) {
        if (!raw || typeof raw !== 'object') return;
        const patch = {};
        for (const k of Object.keys(PARAM)) if (!pinned[k] && raw[k] !== undefined && raw[k] !== null) patch[k] = raw[k];
        if (Object.keys(patch).length) renderer.setLayout(patch);
      }

      // 2.2 live story: every `story` line (transcript sentence from the panel) runs through the director,
      // whose scene state the renderer draws in the band; `story-state` carries a ready-made state.
      // 2.3: attachDirector also ticks the director every second (props / actors leave when nobody mentions
      // them), and every story line keeps the band awake – an idle band comes back with the next sentence.
      const director = window.LiveFXStoryDirector ? window.LiveFXStoryDirector.create({ lang: 'auto', caption: false }) : null;
      if (director) renderer.attachDirector(director);

      bus.onMessage((msg) => {
        if (!msg || typeof msg !== 'object') return;
        if (msg.type === 'fire') renderer.fire(msg.trigger);
        else if (msg.type === 'volume') {
          if (typeof msg.volume === 'number' && Number.isFinite(msg.volume)) {
            const b = VOLUME_BUSES.includes(msg.bus) ? msg.bus : 'master';
            renderer.setVolume(b, Math.min(1, Math.max(0, msg.volume))); // explicit messages always apply
          }
        } else if (msg.type === 'theme') {
          if (!hasThemeParam && typeof msg.theme === 'string') renderer.setTheme(msg.theme);
        } else if (msg.type === 'perf') {
          if (!hasPerfParam && typeof msg.perf === 'string') renderer.setPerf(msg.perf);
        } else if (msg.type === 'layout') {
          applyLayout(msg);
        } else if (msg.type === 'story') {
          if (director && typeof msg.text === 'string') {
            director.feed(msg.text, { final: msg.final !== false, lang: msg.lang });
            renderer.storyTouch();
          }
        } else if (msg.type === 'story-state') {
          if (msg.state && typeof msg.state === 'object') renderer.story(msg.state);
        } else if (msg.type === 'state') {
          if (typeof msg.volume === 'number' && Number.isFinite(msg.volume)) applyVolume('master', msg.volume);
          if (msg.volumes && typeof msg.volumes === 'object') for (const b of VOLUME_BUSES) if (b in msg.volumes) applyVolume(b, msg.volumes[b]);
          if (!hasThemeParam && typeof msg.theme === 'string') renderer.setTheme(msg.theme);
          if (!hasPerfParam && typeof msg.perf === 'string') renderer.setPerf(msg.perf);
          applyLayout(msg.layout);
        }
      });

      // Browsers block audio until a user gesture; OBS browser sources are exempt.
      // For a normal tab: click anywhere once to unlock audio.
      document.addEventListener('pointerdown', () => renderer.ensureAudio(), { once: true });

      // Expose for tests / preview button.
      window.livefx = { renderer, bus, director };
    });
  </script>
  <script>
    // Overlay-only shell (no panel / ASR / demo code in the OBS source cache), own scope so it never
    // replaces the panel's worker. Should the scoped registration be refused, the full shell still works.
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker
        .register('/sw.js?shell=overlay', { scope: '/overlay.html' })
        .catch(() => navigator.serviceWorker.register('/sw.js'))
        .catch(() => {});
    }
  </script>
</body>
</html>
