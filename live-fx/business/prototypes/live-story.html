<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveFX Erzählfilm</title>
<meta name="description" content="LiveFX Vision-Prototyp: Aus erzählten Wörtern entsteht live eine animierte Szene im Browser (DE/TR/EN).">
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a303c; --text:#eceef3; --muted:#9aa3b2;
  --pink:#ff2d75; --green:#2dffb5; --gold:#ffd166; --blue:#5ad1ff; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;overflow-x:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--green),var(--blue));display:grid;place-items:center;font-weight:800;color:#0f1115;flex:none}
h1{font-size:1.15rem;margin:0;line-height:1.2}
.badge{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;border:1px solid var(--green);color:var(--green);margin-top:2px}
.langsw{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:none}
.langsw button{background:transparent;border:0;padding:6px 12px;font-weight:700;font-size:.85rem;color:var(--muted)}
.langsw button[aria-pressed="true"]{background:var(--green);color:#0f1115}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.stage{background:#000;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;justify-content:center}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:pan-y}
.portrait canvas{aspect-ratio:9/16;width:auto;height:min(78vh,calc((100vw - 36px) * 1.7778))}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);margin-top:6px}
.stats .rec{color:var(--pink);font-weight:700}
.transcript{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:2.4em;font-size:.95rem}
.transcript .lbl{color:var(--muted);font-size:.75rem;display:block}
.decide{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:10px;padding:8px 10px;font-size:.9rem;min-height:2.4em}
.chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:2px 9px;margin:2px 4px 2px 0;font-size:.82rem}
.chip b{color:var(--gold);font-weight:600}
.chip.r-place{border-color:#2a6b52}.chip.r-time{border-color:#3b4a8a}.chip.r-weather{border-color:#2f6f8f}.chip.r-figure{border-color:#7a3b5c}.chip.r-object{border-color:#6b5a2a}.chip.r-action{border-color:#5a3b7a}.chip.r-mood{border-color:#7a2a3b}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.panel h2{font-size:.9rem;margin:0 0 8px;color:var(--muted);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.row:first-child{margin-top:0}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);min-width:0;flex:1}
select,input[type=text],input[type=number],textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
textarea{min-height:92px;resize:vertical}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;white-space:nowrap}
.btn.primary{background:var(--green);border-color:var(--green);color:#0f1115;font-weight:700}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:700}
.btn.on{background:var(--pink);border-color:var(--pink);color:#fff}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 12px}
.seg button[aria-pressed="true"]{background:var(--green);color:#0f1115;font-weight:700}
.log{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto;font-size:.82rem}
.log li{padding:5px 0;border-bottom:1px solid var(--line)}
.log li .s{color:var(--muted);display:block}
pre{margin:0;background:var(--panel2);border-radius:10px;padding:8px;font-size:11px;line-height:1.35;max-height:240px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.note{font-size:.78rem;color:var(--muted);margin:10px 0 0;border-left:3px solid var(--green);padding-left:10px}
.hint{font-size:.8rem;color:var(--gold);margin-top:6px;min-height:1em}
.sr{position:absolute;left:-9999px}
.exrow{display:flex;gap:6px;flex-wrap:nowrap;align-items:center;margin-top:8px}
.exrow .btn{padding:6px 10px}
@media (max-width:520px){h1{font-size:1rem}.row .btn{flex:1 1 auto}}
@media (max-width:480px){.langrow label.f{flex-basis:100%}.langrow #btnMic{flex:1 1 100%}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">FX</div>
      <div>
        <h1 data-i18n="title">Erzählfilm</h1>
        <span class="badge" data-i18n="badge">Prototyp · Vision</span>
      </div>
    </div>
    <div class="langsw" role="group" data-i18n-aria="uiLang" aria-label="Sprache der Oberfläche">
      <button type="button" data-ui="de">DE</button><button type="button" data-ui="tr">TR</button><button type="button" data-ui="en">EN</button>
    </div>
  </header>

  <div class="grid">
    <main>
      <div class="stage" id="stage"><canvas id="cv" width="960" height="540" role="img" data-i18n-aria="canvasLabel" aria-label="Szene"></canvas></div>
      <div class="stats" id="stats" aria-live="off"></div>
      <div class="transcript"><span class="lbl" data-i18n="transcript">Gehört / getippt</span><span id="trText">–</span></div>
      <div class="decide" id="decide" role="status" aria-live="polite"></div>
    </main>

    <aside>
      <section class="panel">
        <h2 data-i18n="inputTitle">Erzählen</h2>
        <div class="row langrow">
          <label class="f"><span data-i18n="storyLang">Sprache der Geschichte</span>
            <select id="selLang">
              <option value="auto" data-i18n="auto">Automatisch erkennen</option>
              <option value="de" data-i18n="lang_de">Deutsch</option>
              <option value="tr" data-i18n="lang_tr">Türkisch</option>
              <option value="en" data-i18n="lang_en">Englisch</option>
            </select>
          </label>
          <button type="button" class="btn" id="btnMic" data-i18n="mic">🎤 Mikro</button>
        </div>
        <form class="row" id="form" autocomplete="off">
          <label class="f"><span class="sr" data-i18n="sentence">Satz</span>
            <input type="text" id="inp" data-i18n-ph="inputPh" placeholder=""></label>
        </form>
        <div class="row">
          <label class="f"><span class="sr" data-i18n="storyText">Geschichte</span>
            <textarea id="story" data-i18n-ph="storyPh" placeholder=""></textarea></label>
        </div>
        <div class="row">
          <button type="button" class="btn primary" id="btnSim" data-i18n="simulate">▶ Vorlesen simulieren</button>
        </div>
        <div class="exrow">
          <span class="muted" style="font-size:.8rem;color:var(--muted)" data-i18n="examples">Beispiel:</span>
          <button type="button" class="btn" data-ex="de">DE</button><button type="button" class="btn" data-ex="tr">TR</button><button type="button" class="btn" data-ex="en">EN</button>
        </div>
        <div class="hint" id="hint"></div>
      </section>

      <section class="panel">
        <h2 data-i18n="sceneTitle">Szene &amp; Ausgabe</h2>
        <div class="row">
          <div class="seg" role="group" data-i18n-aria="format" aria-label="Format">
            <button type="button" data-fmt="16x9">16:9</button><button type="button" data-fmt="9x16" data-i18n="portrait">9:16-Band</button>
          </div>
          <label class="f" style="max-width:110px"><span data-i18n="seed">Seed</span><input type="number" id="seed" value="7" min="0" step="1"></label>
        </div>
        <div class="row">
          <button type="button" class="btn" id="btnReplay" data-i18n="replay">↺ Nochmal abspielen</button>
          <button type="button" class="btn" id="btnNew" data-i18n="new">✕ Neue Szene</button>
          <button type="button" class="btn pink" id="btnRec" data-i18n="record">⏺ Aufnehmen (WebM)</button>
        </div>
        <div class="row">
          <button type="button" class="btn" id="btnExport" data-i18n="export">⬇ Zeitleiste (JSON)</button>
          <button type="button" class="btn" id="btnImport" data-i18n="import">⬆ Zeitleiste laden</button>
          <input type="file" id="file" accept="application/json,.json" hidden>
        </div>
      </section>

      <section class="panel">
        <h2 data-i18n="logTitle">Szenen-Entscheidungen</h2>
        <ul class="log" id="log"></ul>
      </section>

      <section class="panel">
        <h2 data-i18n="worldTitle">Weltzustand (live)</h2>
        <pre id="world"></pre>
      </section>
    </aside>
  </div>
  <p class="note" data-i18n="how">So funktioniert’s</p>
  <p class="note" style="border-color:var(--gold)" data-i18n="privacy">Hinweis</p>
</div>

});

/* ======================= Regisseur: Treffer → Zustands-Delta ======================= */
var FAST = ['place','landmark','time','weather','mood'];

    var nat = pl.filter(function(h){ return NATURE[h.id]; }), str = pl.filter(function(h){ return !NATURE[h.id]; });

  }

  if (st.length && (we.length || w.weather !== 'clear')) { d.weather = 'clear'; dec.push({w:st[0].word, role:'stop'}); }
  else if (we.length) { d.weather = last(we).id; dec.push({w:last(we).word, role:'weather', id:d.weather}); }

var FSLOT = [0.30, 0.70, 0.50, 0.15, 0.85, 0.40], OSLOT = [0.22, 0.78, 0.60, 0.08, 0.92, 0.42];
