<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>LiveFX – Handy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <header>
    <div class="title">
      <span class="dot" id="dot-server" title="Verbindung zum Server"></span>
      <strong>🎬 LiveFX</strong>
      <span class="sub" id="status">verbinde …</span>
    </div>
    <div class="controls">
      <button type="button" id="btn-mute" title="Effekte anhalten">⏸ Pause</button>
      <div class="volbox" role="group" aria-label="Lautstärke Overlay">
        <button type="button" id="btn-vol-down" title="Leiser (−6 dB)">🔉 Leiser</button>
        <span class="vol-label" id="vol-label">80 %</span>
        <button type="button" id="btn-vol-up" title="Lauter (+6 dB)">🔊 Lauter</button>
        <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Lautstärke Overlay" hidden>
      </div>
    </div>
    <div class="quick">
      <button type="button" id="btn-mic" title="Spracherkennung am Handy">🎙️ Mikro</button>
      <button type="button" id="btn-band" title="Story-Band im Overlay ein-/ausblenden" data-on="0">📖 Band an</button>
      <button type="button" id="btn-zone" title="Effekt-Zone im Overlay wechseln" data-zone="full">🎯 Zone: überall</button>
    </div>
    <div class="quick quick-look">
      <button type="button" id="btn-style" title="Story-Stil im Overlay wechseln: Gemischt → Zeichnung → Emoji" data-style="mixed">✏️ Stil: Gemischt</button>
      <button type="button" id="btn-bandpos" title="Band-Position im Hochformat (9:16): ganz unten ↔ über dem Chat" data-pos="bottom">📐 Band: ganz unten</button>
    </div>
  </header>

  <main>
    <div class="row">
      <input id="search" type="search" placeholder="Suchen … (Name oder Stichwort)" autocomplete="off" autocapitalize="off" aria-label="Trigger suchen">
    </div>
    <p class="hint" id="mic-hint" hidden></p>

    <div id="transcript" aria-live="polite"><span class="muted">Tippe eine Kachel – der Effekt erscheint im Overlay. Lange drücken = Favorit ⭐</span></div>

    <section id="favs-card" hidden>
      <h2>⭐ Favoriten <span class="count" id="favs-count"></span></h2>
      <div class="pad" id="favs"></div>
    </section>

    <section id="scenes-card" hidden>
      <h2>Szenen</h2>
      <div class="scenes" id="scenes"></div>
    </section>

    <section>
      <h2>Effekte <span class="count" id="count"></span></h2>
      <div class="pad" id="pad"></div>
      <p class="hint" id="empty" hidden>Nichts gefunden.</p>
    </section>

    <section id="packs-card">
      <h2>📦 Pakete <span class="count" id="packs-count"></span></h2>
      <div class="packs" id="packs"></div>
      <p class="hint">Ein Paket fügt seine Trigger hinzu – am PC und hier. Antippen = laden / entfernen.</p>
    </section>
  </main>

  <script src="js/triggers.js"></script>
  <script src="js/packs.js"></script>
  <script src="js/schema.js"></script>
  <script src="js/packs-store.js"></script>
  <script src="js/matcher.js"></script>
  <script src="js/bus.js"></script>
  <script src="js/store.js"></script>
  <script src="js/safety.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/asr.js"></script>
  <script src="js/mobile.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('/sw.js').catch(() => {});
  </script>
</body>
</html>
