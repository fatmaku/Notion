<style>
:root {
  --bg: #f6f0e8;
  --surface: #fffcf7;
  --surface-2: #f3ebe0;
  --text: #2a231e;
  --muted: #5a4f45;
  --border: #d6c7b5;
  --accent: #8a4527;
  --accent-text: #ffffff;
  --accent-soft: #f2dfcf;
  --accent-line: #b5694a;
  --focus: #1d5a91;
  --danger: #9a2a22;
  --danger-soft: #f8e2de;
  --safe: #2f5f4f;
  --safe-soft: #e1efe9;
  --shadow: 0 1px 2px rgba(60,40,20,.08), 0 6px 24px rgba(60,40,20,.08);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171411;
    --surface: #221d19;
    --surface-2: #2c2520;
    --text: #f4ede5;
    --muted: #cbbdaf;
    --border: #4b4037;
    --accent: #eaa47c;
    --accent-text: #1b1612;
    --accent-soft: #3d2d23;
    --accent-line: #c9825d;
    --focus: #8cc4ff;
    --danger: #ff9c90;
    --danger-soft: #3d2420;
    --safe: #9fd8c2;
    --safe-soft: #1f3530;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 24px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  font-size: 18px;
  line-height: 1.55;
}
.app {
  max-width: 440px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  position: relative;
}
@media (min-width: 480px) {
  body { padding: 24px 0; }
  .app { min-height: calc(100vh - 48px); border-radius: 22px; box-shadow: var(--shadow); overflow: clip; border: 1px solid var(--border); }
}
.skip { position: absolute; left: -999px; top: 8px; background: var(--accent); color: var(--accent-text); padding: 10px 14px; border-radius: 10px; z-index: 50; }
.skip:focus { left: 8px; }
.vh { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5em; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.1rem; }
p { margin: 0 0 .8em; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: .9rem; }

/* header */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px 8px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.05rem; margin-right: auto; color: var(--text); background: none; border: 0; padding: 0; min-height: 44px; cursor: pointer; font-family: inherit; }
.brand svg { width: 28px; height: 28px; flex: none; }
.langs { display: flex; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.langs button { min-width: 44px; min-height: 44px; border: 0; background: transparent; color: var(--text); font: inherit; font-size: .9rem; font-weight: 600; cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid transparent; background: transparent; color: var(--text); display: inline-grid; place-items: center; cursor: pointer; }
.icon-btn[aria-current="page"] { background: var(--accent-soft); border-color: var(--accent-line); }
.icon-btn svg { width: 24px; height: 24px; }

main { flex: 1; padding: 20px 16px 24px; }
.banner { margin: 12px 16px 0; padding: 10px 14px; border-radius: 12px; background: var(--danger-soft); color: var(--text); border: 1px solid var(--danger); font-size: .95rem; }

/* bottom nav */
.tabbar {
  position: sticky; bottom: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
}
.tabbar button {
  min-height: 56px; border: 0; background: transparent; color: var(--muted);
  font: inherit; font-size: .8rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 12px; cursor: pointer;
}
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--accent); font-weight: 700; background: var(--accent-soft); }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 10px 18px; border-radius: 12px;
  border: 1.5px solid var(--border); background: var(--surface); color: var(--text);
  font: inherit; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none;
}
.btn:hover { border-color: var(--accent-line); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn-primary:hover { filter: brightness(1.06); border-color: var(--accent); }
.btn-danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn-safe { color: var(--safe); border-color: var(--safe); background: var(--safe-soft); }
.btn-block { width: 100%; }
.btn-big {
  width: 100%; min-height: 120px; font-size: 1.3rem; border-radius: 20px; flex-direction: column; gap: 6px;
  box-shadow: var(--shadow);
}
.btn-big svg { width: 36px; height: 36px; }
.btn-sm { min-height: 44px; padding: 8px 12px; font-size: .9rem; font-weight: 500; }
.btn-link { background: none; border: 0; color: var(--accent); text-decoration: underline; font: inherit; cursor: pointer; min-height: 44px; padding: 0 4px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.stack > * + * { margin-top: 14px; }
.spacer { height: 12px; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.card-soft { background: var(--surface-2); border-color: transparent; }
.nav-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.nav-card { text-align: left; align-items: flex-start; flex-direction: column; min-height: 96px; font-weight: 600; }
.nav-card .muted { font-weight: 400; font-size: .9rem; }
.note { border-left: 4px solid var(--accent-line); padding: 10px 14px; background: var(--surface-2); border-radius: 0 12px 12px 0; font-size: .95rem; }
.badge { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }
.badge-demo { background: var(--accent-soft); color: var(--text); border-color: var(--accent-line); }

/* forms */
label.field, .field-label { display: block; font-weight: 600; margin-bottom: 6px; }
textarea, input[type="text"], input[type="search"], select {
  width: 100%; font: inherit; color: var(--text); background: var(--surface);
  border: 1.5px solid var(--border); border-radius: 12px; padding: 12px 14px; min-height: 48px;
}
textarea { min-height: 110px; resize: vertical; }
textarea:focus, input:focus, select:focus { border-color: var(--accent-line); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { font-weight: 600; margin-bottom: 8px; padding: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  position: relative; display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 8px 16px; border-radius: 999px;
  border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; font-size: 1rem;
}
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.chip.on::before { content: "✓"; font-weight: 700; color: var(--accent); }
.chip:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.chip-btn { font: inherit; color: var(--text); }
.chip-sep { width: 100%; height: 0; }
.tag { display: inline-flex; align-items: center; gap: 2px; padding: 2px 4px 2px 12px; border-radius: 999px; background: var(--accent-soft); border: 1px solid var(--accent-line); font-size: .95rem; }
.tag.static { padding: 2px 10px; }
.tag button { width: 44px; height: 44px; min-width: 44px; margin: -4px -8px -4px 0; border: 0; background: transparent; color: var(--text); border-radius: 50%; cursor: pointer; font-size: 1.1rem; }
.tag-input { display: flex; gap: 8px; }
.tag-input input { flex: 1; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.switch { position: relative; width: 58px; height: 34px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--border); transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(24px); }
.switch input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }

/* session */
.session-head { position: sticky; top: 61px; z-index: 5; background: var(--surface); margin: -20px -16px 16px; padding: 10px 16px 8px; border-bottom: 1px solid var(--border); }
.session-head .row { justify-content: space-between; }
.progress { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 6px 0 6px; }
.progress > div { height: 100%; background: var(--accent); border-radius: 99px; }
.safety-link {
  display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px;
  background: var(--safe-soft); color: var(--safe); border: 1px solid var(--safe); border-radius: 10px;
  font: inherit; font-size: .95rem; font-weight: 600; padding: 6px 12px; cursor: pointer; text-align: left;
}
.safety-link svg { width: 20px; height: 20px; flex: none; }
.step-title { font-size: 1.45rem; }
.hint { color: var(--muted); }
.alt-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--border); }
.alt-row .btn { min-height: 44px; padding: 6px 12px; font-size: .88rem; font-weight: 500; background: var(--surface-2); border-color: transparent; }
.alt-row .btn:hover { border-color: var(--border); }
.step-nav { display: flex; gap: 10px; margin-top: 20px; }
.step-nav .btn-primary { flex: 1; }
.status { margin-top: 12px; padding: 10px 14px; border-radius: 12px; background: var(--surface-2); font-size: .95rem; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.persp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.persp { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1.5px solid var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; font-size: .95rem; }
.persp strong { font-size: 1rem; }
.persp .q { color: var(--muted); font-style: italic; }
.persp .pick { margin-top: auto; display: flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 600; }
.persp .pick input { width: 22px; height: 22px; accent-color: var(--accent); }
.persp.on { border-color: var(--accent); background: var(--accent-soft); }
.persp:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
dl.summary { margin: 0; display: grid; gap: 10px; }
dl.summary dt { font-weight: 700; font-size: .9rem; color: var(--muted); text-transform: none; }
dl.summary dd { margin: 0; }
.quote { font-style: italic; }
.placeholder { border: 2px dashed var(--accent-line); background: var(--surface-2); }

/* journal */
.timeline { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px solid var(--border); }
.timeline li { position: relative; margin-bottom: 14px; }
.timeline li::before { content: ""; position: absolute; left: -26px; top: 18px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
.entry-card { display: block; width: 100%; text-align: left; font: inherit; color: var(--text); cursor: pointer; }
.entry-card:hover { border-color: var(--accent-line); }
.entry-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .88rem; color: var(--muted); margin-bottom: 4px; }
.excerpt { margin: 0 0 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.taglist { display: flex; flex-wrap: wrap; gap: 6px; }
.filters { display: grid; gap: 10px; margin-bottom: 16px; }
.pattern p { margin-bottom: 10px; }
.pattern-kind { font-size: .85rem; color: var(--muted); font-weight: 600; margin-bottom: 6px !important; }
.section { margin-top: 28px; }
.section:first-child { margin-top: 0; }
.danger-zone { border-color: var(--danger); }

footer.foot { padding: 16px 16px 20px; border-top: 1px solid var(--border); font-size: .88rem; color: var(--muted); background: var(--surface); }
footer.foot .slogan { color: var(--text); font-weight: 600; font-size: .95rem; margin-bottom: 4px; }
footer.foot p { margin: 0 0 6px; }

.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); max-width: 400px; width: calc(100% - 32px); background: var(--text); color: var(--surface); padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow); z-index: 40; font-size: .95rem; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.show { opacity: 1; }
dialog { border: 1px solid var(--border); border-radius: 18px; padding: 20px; max-width: 380px; width: calc(100% - 32px); background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(20,14,10,.5); }
.dlg-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.safety-screen h1 { font-size: 1.5rem; }
.contact { display: flex; flex-direction: column; gap: 6px; }
.contact a.btn { justify-content: flex-start; font-size: 1.05rem; }
.hero-icon { width: 56px; height: 56px; color: var(--safe); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

/* ------------------------------------------------------------------ *
 * Storage (works without localStorage)
 * ------------------------------------------------------------------ */
const store = {
  ok: true, mem: {},
  init() {
    try { const k = '__ik_test'; window.localStorage.setItem(k, '1'); window.localStorage.removeItem(k); }
    catch (e) { this.ok = false; }
  },
  get(k, fallback) {
    if (Object.prototype.hasOwnProperty.call(this.mem, k)) return this.mem[k];
    let v = null;
    try { const raw = window.localStorage.getItem(k); v = raw == null ? null : JSON.parse(raw); }
    catch (e) { v = null; }
    this.mem[k] = v == null ? fallback : v;
    return this.mem[k];
  },
  set(k, v) {
    this.mem[k] = v;
    try { window.localStorage.setItem(k, JSON.stringify(v)); } catch (e) { this.ok = false; }
  },
  clear() {
    ['ik.entries', 'ik.assoc', 'ik.hidden', 'ik.settings'].forEach(k => {
      delete this.mem[k];
      try { window.localStorage.removeItem(k); } catch (e) { /* ignore */ }
    });
  }
};
store.init();

const data = {
  get entries() { const v = store.get('ik.entries', []); return Array.isArray(v) ? v : []; },
  set entries(v) { store.set('ik.entries', v); },
  get assoc() { const v = store.get('ik.assoc', []); return Array.isArray(v) ? v : []; },

  get hidden() { const v = store.get('ik.hidden', []); return Array.isArray(v) ? v : []; },

};

function t(key, vars) {
  let s = T[state.lang][key];
  if (s == null) s = T.de[key];
  if (s == null) s = key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? String(vars[k]) : m));
  return s;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const e_ = (k, v) => esc(t(k, v));
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function fmtDate(iso, opts) {
  try { return new Intl.DateTimeFormat(LOCALE[state.lang], opts || { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(iso)); }
  catch (e) { return String(iso).slice(0, 10); }
}
function countLabel(n, one, many) { return n === 1 ? t(one) : t(many, { n }); }
function feelingInline(key) {
  const label = t('feel.' + key);
  return state.lang === 'de' ? label : label.toLocaleLowerCase(LOCALE[state.lang]);
}
function normTag(s) { return String(s).trim().toLocaleLowerCase(LOCALE[state.lang]); }

let toastTimer = null;
function announce(msg) {
  const live = document.getElementById('live');
  live.textContent = '';
  setTimeout(() => { live.textContent = msg; }, 30);
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
}
function ask(title, text, buttons) {
  const dlg = document.getElementById('dlg');
  if (typeof dlg.showModal !== 'function') {
    const primary = buttons.find(b => b.value !== null);
    return Promise.resolve(window.confirm(title + '\n\n' + text) ? primary.value : null);
  }
  document.getElementById('dlg-title').textContent = title;
  document.getElementById('dlg-text').textContent = text;
  const box = document.getElementById('dlg-actions');
  box.innerHTML = buttons.map((b, i) =>
    `<button type="button" class="btn ${b.cls || ''}" data-i="${i}">${esc(b.label)}</button>`).join('');
  const prevFocus = document.activeElement;
  return new Promise(resolve => {
    let done = false;
    const finish = v => {
      if (done) return; done = true;
      if (dlg.open) dlg.close();
      resolve(v);
      if (prevFocus && document.body.contains(prevFocus)) prevFocus.focus();
    };
    box.onclick = ev => { const b = ev.target.closest('button[data-i]'); if (b) finish(buttons[+b.dataset.i].value); };
    dlg.oncancel = ev => { ev.preventDefault(); finish(null); };
    dlg.showModal();
    const def = box.querySelector('button[data-i="' + Math.max(0, buttons.findIndex(b => b.focus)) + '"]');
    if (def) def.focus();
  });
}

/* ------------------------------------------------------------------ *
 * Rendering
 * ------------------------------------------------------------------ */
function render(opts) {
  opts = opts || {};
  const app = document.getElementById('app');
  const active = document.activeElement;
  const keepId = opts.keep && active && active.id ? active.id : null;
  document.documentElement.lang = state.lang;
  document.getElementById('skip').textContent = t('skip');
  const inFlow = state.view === 'session' || state.view === 'safety';
  if (!opts.keep && !opts.focus) { clearTimeout(toastTimer); document.getElementById('toast').classList.remove('show'); }
  app.innerHTML =
    headerHTML() +
    (store.ok ? '' : `<div class="banner" role="status">${e_('storageOff')}</div>`) +
    `<main id="main" tabindex="-1">${viewHTML()}</main>` +
    (inFlow ? '' : navHTML()) +
    footerHTML();
  if (keepId && document.getElementById(keepId)) {
    document.getElementById(keepId).focus();
  } else if (opts.focus) {
    const el = document.querySelector(opts.focus);
    if (el) el.focus();
  } else if (!opts.noFocus) {
    const h = document.querySelector('main h1, main h2');
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
    window.scrollTo(0, 0);
  }
}

/* ---------- Session ---------- */
function stepTitle(n) { return t('s' + n + '.title'); }
function curMetaKey() { return session.phase === 'step' ? String(session.step) : session.phase; }

function sessionHTML() {
  const s = session;
  let head;
  if (s.phase === 'step') {
    head = `<div class="row"><span>${e_('stepOf', { n: s.step, total: TOTAL })}</span></div>
      <div class="progress" role="progressbar" aria-label="${e_('progressLabel')}" aria-valuemin="1" aria-valuemax="${TOTAL}" aria-valuenow="${s.step}"><div style="width:${(s.step / TOTAL) * 100}%"></div></div>`;
  } else {
    head = `<div class="row"><span>${e_('spPre')}</span></div>`;
  }
  head += `<button type="button" class="safety-link" data-action="safety" data-from="session" id="safety-link">${I.shield}<span>${e_('safetyLink')}</span></button>`;
  let body = '';
  if (s.phase === 'sp-kind') body = spKindHTML();
  else if (s.phase === 'sp-safety') body = spSafetyHTML();
  else if (s.phase === 'sp-view') body = spViewHTML();
  else if (s.phase === 'sp-culture') body = spCultureHTML();
  else body = stepHTML(s.step);
  return `<div class="session-head">${head}</div><section aria-live="off">${body}</section>`;
}

function statusHTML() {
  const m = draft.meta[curMetaKey()];
  const msg = session.status || (m ? t('status.' + m) : '');

  return `<div class="status" role="status"><span>${esc(msg)}</span>${m ? `<button type="button" class="btn-link" data-action="alt-undo">${e_('statusUndo')}</button>` : ''}</div>`;

function altRowHTML() {

function radioChips(name, opts, current, labelPrefix, bindField) {
  return opts.map(o => {

    const on = current === o;
    return `<label class="chip ${on ? 'on' : ''}" for="${id}"><input type="radio" id="${id}" name="${name}" value="${o}" data-radio="${bindField}" ${on ? 'checked' : ''}><span>${e_(labelPrefix + o)}</span></label>`;
  }).join('');
}
function checkChips(name, opts, arr, labelPrefix, group) {
  return opts.map(o => {
    const id = `opt-${name}-${o}`;
    const on = arr.includes(o);
    return `<label class="chip ${on ? 'on' : ''}" for="${id}"><input type="checkbox" id="${id}" value="${o}" data-group="${group}" ${on ? 'checked' : ''}><span>${e_(labelPrefix + o)}</span></label>`;
  }).join('');
}
function textArea(id, field, label, value, ph, rows) {
  return `<div><label class="field" for="${id}">${esc(label)}</label><textarea id="${id}" data-bind="${field}" ${rows ? `rows="${rows}" style="min-height:auto"` : ''} ${ph ? `placeholder="${esc(ph)}"` : ''}>${esc(value)}</textarea></div>`;

function tagEditorHTML(tags, scope) {

  return `${title}${inner}${statusHTML()}${navRowHTML({ back: n > 1 || !!d.spiritual, primary: isLast ? t('saveFinish') : null })}${altRowHTML()}`;

function summaryHTML(d) {
  const metaNote = k => d.meta && d.meta[k] ? ` <span class="badge">${e_('meta.' + d.meta[k])}</span>` : '';
  const qo = state.lang === 'de' ? '„' : '“', qc = state.lang === 'de' ? '“' : '”';
  const q = s => s ? `<span class="quote">${qo}${esc(s)}${qc}</span>` : '';
  const empty = `<span class="muted">${e_('sum.empty')}</span>`;
  const join = arr => arr.filter(Boolean).join(' – ');
  const rows = [];
  if (d.spiritual) {
    const sp = [d.spiritual.kind ? esc(t('spk.' + d.spiritual.kind)) : '', d.spiritual.view ? esc(t('spv.' + d.spiritual.view)) : '', q(d.spiritual.kindText)];
    rows.push(['sum.spiritual', join(sp) || empty, '']);
  }
  rows.push(['sum.type', join([d.type ? esc(t('type.' + d.type)) : '', q(d.typeText)]) || empty, metaNote('1')]);
  rows.push(['sum.noticed', q(d.noticed) || empty, metaNote('2')]);
  rows.push(['sum.feelings', join([d.feelings.map(f => esc(t('feel.' + f))).join(', '), q(d.feelingText)]) || empty, metaNote('3')]);
  rows.push(['sum.connection', join([d.connections.map(c => esc(t('conn.' + c))).join(', '), q(d.connectionText)]) || empty, metaNote('4')]);
  rows.push(['sum.context', q(d.context) || empty, metaNote('5')]);
  rows.push(['sum.persp', join([d.perspectives.map(p => esc(t('persp.' + p))).join(', '), q(d.perspectiveText)]) || empty, metaNote('6')]);
  rows.push(['sum.tags', d.tags.length ? `<span class="taglist">${d.tags.map(x => `<span class="tag static">${esc(x)}</span>`).join('')}</span>` : empty, '']);
  return `<dl class="summary">${rows.map(([k, v, m]) => `<div><dt>${e_(k)}</dt><dd>${v}${m}</dd></div>`).join('')}</dl>`;
}

  return Array.from(map.entries()).sort((a, b) => a[1].localeCompare(b[1], LOCALE[state.lang]));

function entryText(en) {
  const parts = [en.typeText, en.noticed, en.feelingText, en.connectionText, en.context, en.perspectiveText, en.correction, en.ownThought, en.nextText, en.nextStep,
    en.spiritual && en.spiritual.kindText, en.type && t('type.' + en.type)];
  (en.tags || []).forEach(x => parts.push(x));
  (en.feelings || []).forEach(f => parts.push(t('feel.' + f)));
  (en.connections || []).forEach(c => parts.push(t('conn.' + c)));
  return parts.filter(Boolean).join(' ').toLocaleLowerCase(LOCALE[state.lang]);

/* ---------- Patterns ---------- */
function computePatterns() {
  const entries = data.entries;
  const hidden = data.hidden;
  const tagMap = new Map();
  const feelMap = new Map();
  entries.forEach(en => {
    const seen = new Set();
    (en.tags || []).forEach(tg => {
      const k = normTag(tg); if (!k || seen.has(k)) return; seen.add(k);
      if (!tagMap.has(k)) tagMap.set(k, { label: tg, entries: [] });
      tagMap.get(k).entries.push(en);
    });
    (en.feelings || []).forEach(f => {
      if (f === 'none' || f === 'unknown') return;
      if (!feelMap.has(f)) feelMap.set(f, { entries: [] });
      feelMap.get(f).entries.push(en);
    });
  });
  const cards = [];
  const span = list => {
    const dates = list.map(x => x.createdAt).sort();
    return { from: dates[0], to: dates[dates.length - 1] };
  };
  tagMap.forEach((v, k) => {
    if (v.entries.length < 2) return;
    const fc = {};
    v.entries.forEach(en => (en.feelings || []).forEach(f => { if (f !== 'none' && f !== 'unknown') fc[f] = (fc[f] || 0) + 1; }));
    let co = null;
    Object.keys(fc).forEach(f => { if (fc[f] >= 2 && (!co || fc[f] > co.k)) co = { f, k: fc[f] }; });
    const latest = v.entries.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt))[0];
    const label = (latest.tags || []).find(x => normTag(x) === k) || v.label;
    cards.push({ key: 'tag:' + k, kind: 'tag', term: label, n: v.entries.length, ids: v.entries.map(x => x.id), co, ...span(v.entries) });
  });
  feelMap.forEach((v, f) => {
    if (v.entries.length < 2) return;
    cards.push({ key: 'feel:' + f, kind: 'feel', feel: f, n: v.entries.length, ids: v.entries.map(x => x.id), ...span(v.entries) });
  });
  cards.forEach(c => { c.hidden = hidden.includes(c.key); });
  cards.sort((a, b) => (a.kind === b.kind ? b.n - a.n : (a.kind === 'tag' ? -1 : 1)));
  return cards;
}
function spanText(from, to) {
  const y1 = new Date(from).getFullYear(), y2 = new Date(to).getFullYear(), yNow = new Date().getFullYear();
  const opts = (y1 !== y2 || y1 !== yNow) ? { day: 'numeric', month: 'short', year: 'numeric' } : { day: 'numeric', month: 'short' };
  const f = fmtDate(from, opts), tt = fmtDate(to, opts);
  return f === tt ? t('p.spanSame', { from: f }) : t('p.span', { from: f, to: tt });
}
function patternCardHTML(c) {
  const span = spanText(c.from, c.to);
  let text;
  if (c.kind === 'tag') {
    text = t('p.tag', { n: c.n, span, term: c.term });
    if (c.co) text += ' ' + t('p.co', { k: c.co.k, feeling: feelingInline(c.co.f) });
  } else {
    text = t('p.feel', { n: c.n, span, term: feelingInline(c.feel) });
  }
  // capitalise first letter (TR sentences start with the date span)
  text = text.charAt(0).toLocaleUpperCase(LOCALE[state.lang]) + text.slice(1);
  return `<article class="card pattern" aria-label="${esc(c.kind === 'tag' ? c.term : t('feel.' + c.feel))}">
    <p class="pattern-kind">${e_(c.kind === 'tag' ? 'p.kindTag' : 'p.kindFeel')} · ${esc(countLabel(c.n, 'entriesCount1', 'entriesCountN'))}</p>
    <p>${esc(text)}</p>
    <div class="row">
      <button type="button" class="btn btn-sm btn-primary" data-action="pattern-view" data-key="${esc(c.key)}">${e_('p.view')}</button>
      ${c.hidden
        ? `<button type="button" class="btn btn-sm" data-action="pattern-unhide" data-key="${esc(c.key)}">${e_('p.unhide')}</button>`
        : `<button type="button" class="btn btn-sm" data-action="pattern-hide" data-key="${esc(c.key)}">${e_('p.hide')}</button>`}
    </div>
  </article>`;
}
function patternsHTML() {
  const cards = computePatterns();
  const vis = cards.filter(c => !c.hidden);
  const hid = cards.filter(c => c.hidden);
  return `<h1>${e_('p.title')}</h1>
    <p class="note">${e_('p.intro')}</p>
    ${vis.length ? `<div class="stack">${vis.map(patternCardHTML).join('')}</div>` : `<p class="muted">${e_('p.empty')}</p>`}

}

/* ------------------------------------------------------------------ *
 * Session logic
 * ------------------------------------------------------------------ */
function startSession(mode) {
  draft = newDraft(mode);
  assocDraft = { consent: false, term: '', meaning: '' };
  session = { mode, phase: mode === 'spiritual' ? 'sp-kind' : 'step', step: 1, returnToSummary: false, editList: false, status: '', aiNote: false };
  state.view = 'session';
  render();
}
function setPhase(phase, step) {
  session.phase = phase; if (step) session.step = step;
  session.status = ''; session.aiNote = false;
  render();
}
function advance() {
  const s = session;
  s.status = '';
  if (s.phase === 'sp-kind') return setPhase('sp-safety');
  if (s.phase === 'sp-view') {
    const v = draft.spiritual.view;
    if (v === 'culture' || v === 'both') return setPhase('sp-culture');
    return toFirstStep();
  }
  if (s.phase === 'sp-culture') return toFirstStep();
  if (s.returnToSummary) { s.returnToSummary = false; s.editList = false; return setPhase('step', 7); }
  if (s.step >= TOTAL) return saveDraft(false);
  setPhase('step', s.step + 1);
}
function toFirstStep() {
  const map = { dream: 'dream', personal: 'wake', story: 'story', unsure: 'unsure' };
  if (!draft.type && map[draft.spiritual.kind]) draft.type = map[draft.spiritual.kind];
  setPhase('step', 1);
}
function goBack() {
  const s = session;
  if (s.phase === 'sp-safety') return setPhase('sp-kind');
  if (s.phase === 'sp-view') return setPhase('sp-safety');
  if (s.phase === 'sp-culture') return setPhase('sp-view');
  if (s.phase === 'step') {
    if (s.returnToSummary) { s.returnToSummary = false; return setPhase('step', 7); }
    if (s.step > 1) return setPhase('step', s.step - 1);
    if (draft.spiritual) {
      const v = draft.spiritual.view;
      return setPhase((v === 'culture' || v === 'both') ? 'sp-culture' : 'sp-view');
    }
  }
}
function cleanEntry(d, partial) {
  const en = JSON.parse(JSON.stringify(d));
  en.partial = !!partial;
  ['typeText', 'noticed', 'feelingText', 'connectionText', 'context', 'perspectiveText', 'correction', 'ownThought', 'nextText', 'nextStep'].forEach(k => { en[k] = (en[k] || '').trim(); });
  if (en.next !== 'question') en.nextQuestion = '';
  if (en.summaryFeedback !== 'partly' && en.summaryFeedback !== 'no') en.correction = '';
  return en;
}
function saveDraft(partial) {
  const en = cleanEntry(draft, partial);
  data.entries = data.entries.concat([en]);
  let savedAssoc = false;
  if (assocDraft.consent && assocDraft.term.trim() && assocDraft.meaning.trim()) {
    data.assoc = data.assoc.concat([{ id: uid(), term: assocDraft.term.trim(), meaning: assocDraft.meaning.trim(), entryId: en.id, createdAt: new Date().toISOString() }]);
    savedAssoc = true;
  }
  lastSaved = { id: en.id, assoc: savedAssoc };
  session = null; draft = null; assocDraft = null;
  state.view = 'saved';
  render();
}
async function endSession() {
  const v = await ask(t('endTitle'), t('endText'), [
    { label: t('endSave'), value: 'save', cls: 'btn-primary' },
    { label: t('endDiscard'), value: 'discard' },
    { label: t('endContinue'), value: null, focus: true }
  ]);
  if (v === 'save') saveDraft(true);
  else if (v === 'discard') { session = null; draft = null; assocDraft = null; state.view = 'home'; render(); }
}
function addTag(scope) {
  const input = document.getElementById(scope + '-tag-input');
  if (!input) return;
  const parts = input.value.split(',').map(s => s.trim()).filter(Boolean);
  if (!parts.length) { input.focus(); return; }
  let target;
  if (scope === 'draft') target = draft.tags;
  else { const en = data.entries.find(x => x.id === state.entryId); if (!en) return; en.tags = en.tags || []; target = en.tags; }
  parts.forEach(p => { if (!target.some(x => normTag(x) === normTag(p))) target.push(p.slice(0, 40)); });
  if (scope === 'entry') saveEntries();
  render({ focus: '#' + scope + '-tag-input' });
  announce(t('tagAdded', { t: parts.join(', ') }));
}
function saveEntries() { data.entries = data.entries.slice(); }

/* ------------------------------------------------------------------ *
 * Export
 * ------------------------------------------------------------------ */
function exportAll() {
  const payload = { app: 'Innenkompass', format: 'innenkompass-prototype-export', version: 1, exportedAt: new Date().toISOString(),
    entries: data.entries, meanings: data.assoc, hiddenPatternCards: data.hidden, settings: data.settings };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'innenkompass-export-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  announce(t('exported'));
}

/* ------------------------------------------------------------------ *
 * Event handling
 * ------------------------------------------------------------------ */
const actions = {
  lang(el) {
    state.lang = el.dataset.lang;
    const s = data.settings; s.lang = state.lang; data.settings = s;
    render({ focus: `[data-action="lang"][data-lang="${state.lang}"]` });
  },
  go(el) {
    state.view = el.dataset.view;
    if (state.view === 'journal') { /* keep filters */ }
    render();
  },
  start(el) { startSession(el.dataset.mode); },
  next() { advance(); },
  back() { goBack(); },
  end() { endSession(); },
  alt(el) {
    const a = el.dataset.alt;
    const key = curMetaKey();
    const metaVal = a === 'skip' ? 'skipped' : a;
    draft.meta[key] = metaVal;
    if (a === 'none' || a === 'other') {
      session.status = '';
      render({ focus: '#free-cur', noFocus: true });
      if (!document.getElementById('free-cur')) { const st = document.querySelector('.status'); if (st) { st.setAttribute('tabindex', '-1'); st.focus(); } }
      announce(t('status.' + a));
    } else {
      announce(t('status.' + metaVal));
      advance();
    }
  },
  'alt-undo'() { delete draft.meta[curMetaKey()]; session.status = ''; render({ focus: '#next-btn' }); },
  'edit-toggle'() { session.editList = !session.editList; render({ focus: session.editList ? '#edit-title' : '#edit-toggle' }); },
  'edit-step'(el) { session.returnToSummary = true; session.editList = false; setPhase('step', +el.dataset.step); },
  'ai-stub'() { session.aiNote = true; render({ keep: true }); announce(t('aiStub')); },
  'sp-threat'(el) {
    const a = el.dataset.answer;
    if (a === 'yes') {
      session = null; draft = null; assocDraft = null;
      state.safetyFrom = 'spiritual'; state.view = 'safety';
      render();
    } else setPhase('sp-view');
  },
  safety(el) {
    state.safetyFrom = el.dataset.from || 'footer';
    state.prevView = state.view;
    state.view = 'safety';
    render();
  },
  'safety-back'() { state.view = 'session'; render(); },
  'safety-home'() { if (state.safetyFrom === 'session') { session = null; draft = null; assocDraft = null; } state.view = 'home'; render(); },
  'tag-add'(el) { addTag(el.dataset.scope); },
  'tag-remove'(el) {
    const i = +el.dataset.i; const scope = el.dataset.scope;
    if (scope === 'draft') draft.tags.splice(i, 1);
    else { const en = data.entries.find(x => x.id === state.entryId); if (en) { en.tags.splice(i, 1); saveEntries(); } }
    render({ focus: '#' + scope + '-tag-input' });
  },
  'open-entry'(el) { state.entryId = el.dataset.id; state.view = 'entry'; render(); },
  async 'delete-entry'(el) {
    const id = el.dataset.id;
    const v = await ask(t('e.delTitle'), t('e.delText'), [{ label: t('del'), value: 'del', cls: 'btn-danger' }, { label: t('cancel'), value: null, focus: true }]);
    if (v !== 'del') return;
    data.entries = data.entries.filter(x => x.id !== id);
    if (state.journalIds) state.journalIds = state.journalIds.filter(x => x !== id);
    state.view = 'journal'; render(); announce(t('e.deleted'));
  },
  'demo-load'() { loadDemo(); render({ noFocus: true, focus: 'main h1' }); },
  'demo-remove'() { data.entries = data.entries.filter(x => !x.demo); state.journalIds = null; render({ focus: 'main h1' }); announce(t('demoRemoved')); },
  export() { exportAll(); },
  async 'delete-all'() {
    const v = await ask(t('deleteAllTitle'), t('deleteAllText'), [{ label: t('deleteAll'), value: 'del', cls: 'btn-danger' }, { label: t('cancel'), value: null, focus: true }]);
    if (v !== 'del') return;
    const lang = state.lang;
    store.clear();
    data.settings = { lang };
    state.journalIds = null; state.journalTag = ''; state.journalQuery = ''; state.editingAssoc = null;
    state.view = 'home'; render(); announce(t('deletedAll'));
  },
  'clear-ids'() { state.journalIds = null; render({ focus: '#journal-search' }); },
  'pattern-view'(el) {
    const c = computePatterns().find(x => x.key === el.dataset.key);
    if (!c) return;
    state.journalIds = c.ids; state.journalTag = ''; state.journalQuery = '';
    state.view = 'journal'; render();
  },
  'pattern-hide'(el) { data.hidden = data.hidden.concat([el.dataset.key]); render({ focus: 'main h1' }); announce(t('p.hidden')); },
  'pattern-unhide'(el) { data.hidden = data.hidden.filter(k => k !== el.dataset.key); render({ focus: 'main h1' }); },
  'toggle-hidden'() { state.showHidden = !state.showHidden; render({ focus: '[data-action="toggle-hidden"]' }); },
  'assoc-edit'(el) { state.editingAssoc = el.dataset.id; render({ focus: '#ae-term-' + el.dataset.id }); },
  'assoc-cancel'() { state.editingAssoc = null; render({ focus: 'main h1' }); },
  'assoc-save'(el) {
    const id = el.dataset.id;
    const term = document.getElementById('ae-term-' + id).value.trim();
    const meaning = document.getElementById('ae-meaning-' + id).value.trim();
    data.assoc = data.assoc.map(a => a.id === id ? Object.assign({}, a, { term: term || a.term, meaning }) : a);
    state.editingAssoc = null; render({ focus: 'main h1' }); announce(t('m.saved'));
  },
  async 'assoc-delete'(el) {
    const id = el.dataset.id;
    const a = data.assoc.find(x => x.id === id);
    const v = await ask(t('m.delTitle'), a ? a.term + ': ' + a.meaning : '', [{ label: t('del'), value: 'del', cls: 'btn-danger' }, { label: t('cancel'), value: null, focus: true }]);
    if (v !== 'del') return;
    data.assoc = data.assoc.filter(x => x.id !== id); render({ focus: 'main h1' }); announce(t('m.deleted'));
  },
  async 'assoc-delete-all'() {
    const v = await ask(t('m.delAllTitle'), t('m.intro'), [{ label: t('m.delAll'), value: 'del', cls: 'btn-danger' }, { label: t('cancel'), value: null, focus: true }]);
    if (v !== 'del') return;
    data.assoc = []; render({ focus: 'main h1' }); announce(t('m.deleted'));
  }
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-action]');
  if (!el || !document.getElementById('app').contains(el)) return;
  const fn = actions[el.dataset.action];
  if (fn) { ev.preventDefault(); fn(el, ev); }
});

function setDraftField(path, value) {
  if (path.startsWith('sp.')) draft.spiritual[path.slice(3)] = value;
  else draft[path] = value;
}
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.bind && draft) setDraftField(el.dataset.bind, el.value);
  if (el.dataset.bindAssoc && assocDraft) assocDraft[el.dataset.bindAssoc] = el.value;
  if (el.id === 'journal-search') {
    state.journalQuery = el.value;
    const box = document.getElementById('journal-list');
    if (box) box.innerHTML = journalListHTML();
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'journal-tag') { state.journalTag = el.value; state.journalIds = null; render({ keep: true }); return; }
  if (el.id === 'ai-toggle') { const s = data.settings; s.ai = el.checked; data.settings = s; render({ keep: true }); return; }
  if (!draft) return;
  if (el.dataset.consent) { assocDraft.consent = el.checked; render({ keep: true }); return; }
  if (el.dataset.radio) {
    setDraftField(el.dataset.radio, el.value);
    render({ keep: true });
    return;
  }
  if (el.dataset.group) {
    const g = el.dataset.group;
    let arr = draft[g].slice();
    const v = el.value;
    if (el.checked) {
      if (g === 'feelings' && (v === 'none' || v === 'unknown')) arr = [v];
      else { arr = arr.filter(x => !(g === 'feelings' && (x === 'none' || x === 'unknown'))); if (!arr.includes(v)) arr.push(v); }
    } else arr = arr.filter(x => x !== v);
    draft[g] = arr;
    render({ keep: true });
  }
});
document.addEventListener('keydown', ev => {
  const el = ev.target;
  if (ev.key === 'Enter' && el.dataset && el.dataset.tagInput) { ev.preventDefault(); addTag(el.dataset.tagInput); }
});

render({ noFocus: true });
})();
</script>
