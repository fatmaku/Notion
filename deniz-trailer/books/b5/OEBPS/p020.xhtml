<p class="bl-eyebrow">PUSULA NE DİYOR?</p>
<h2 class="bl">Belirsizliği Küçük Kutulara Böl</h2>
<hr class="cizgi"/>
<p>Pusula, “Kesin olmayan şeye kesin söz vermeyiz,” dedi. “Ama bilgiyi saklamayız.”</p>
<p>Deniz’in bekleme çantasında şunlar vardı:</p>
<ul><li>Kulaklık</li><li>Küçük çizim veya bulmaca</li><li>Sıkma topu</li><li>Su</li><li>“Kaç kişi kaldı?” kontrol kartı</li></ul>
</div></body></html>
