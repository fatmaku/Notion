<p class="bl-eyebrow">PUSULA NE DİYOR?</p>
<h2 class="bl">“Birazdan” Görünür Olabilir</h2>
<hr class="cizgi"/>
<p>Pusula, “Saatteki sayı ile bedendeki zaman aynı değildir,” dedi.</p>
<p>Deniz için geçişin üç işareti vardı:</p>
<ul><li>Beş dakika kaldı.</li><li>İki dakika kaldı; son parçanı seç.</li><li>Şimdi bırak, fotoğrafını çek veya devam dosyasına koy.</li></ul>
