<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deniz Fragman Motoru</title>
<style>
@font-face{font-family:'Fredoka';src:url('src/OEBPS/fonts/fredoka-0.woff2') format('woff2');font-weight:400 700;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+1EF2-1EFF}
@font-face{font-family:'Fredoka';src:url('src/OEBPS/fonts/fredoka-2.woff2') format('woff2');font-weight:400 700;unicode-range:U+0000-00FF,U+0131,U+2000-206F,U+20AC}
:root{--sun:#F29B6B;--navy:#1E2D4A;--mor:#8B6FC7;--sky:#5CC8F0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0d1426;font-family:'Fredoka',sans-serif;transform-origin:0 0}
.scene{position:absolute;inset:0;overflow:hidden;opacity:0;will-change:opacity}
.scene img{position:absolute;left:50%;top:50%;width:1286px;height:1924px;margin:-962px 0 0 -643px;will-change:transform}
.scene img.cover{width:1200px;height:1920px;margin:-960px 0 0 -600px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.scene img.coverbg{width:1400px;height:2240px;margin:-1120px 0 0 -700px;filter:blur(40px) brightness(.6);transform:none!important}
#fx{position:absolute;inset:0;pointer-events:none}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse 85% 70% at 50% 45%,rgba(0,0,0,0) 55%,rgba(5,8,20,.55) 100%);pointer-events:none}
#grad{position:absolute;left:0;right:0;bottom:0;height:900px;background:linear-gradient(180deg,rgba(13,20,38,0) 0%,rgba(13,20,38,.55) 45%,rgba(13,20,38,.85) 100%);pointer-events:none;opacity:0}
#leak{position:absolute;inset:-20%;mix-blend-mode:screen;pointer-events:none;opacity:.5}
#flash{position:absolute;inset:0;background:#fff7e0;opacity:0;pointer-events:none}
#texts{position:absolute;inset:0;pointer-events:none}
.t{position:absolute;left:80px;right:80px;text-align:center;color:#fff;font-weight:600;line-height:1.18;text-shadow:0 4px 24px rgba(0,0,0,.55),0 2px 4px rgba(0,0,0,.4)}
.t .w{display:inline-block;will-change:transform,opacity}
.t .hl{color:var(--sun)}
.t .sky{color:#8FDBFF}
.t small{display:block;font-size:.5em;font-weight:500;letter-spacing:.16em;color:#FFD8B8;margin-top:22px;text-transform:uppercase}
.label{position:absolute;left:0;right:0;top:170px;text-align:center;font:600 34px 'Fredoka';letter-spacing:.34em;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.label span{display:inline-block;padding:14px 30px;border-radius:999px;background:rgba(242,155,107,.92);color:#fff;letter-spacing:.28em}
.bubble{position:absolute;padding:24px 36px;margin-left:0;border-radius:60px;background:rgba(255,255,255,.94);color:var(--navy);font:600 52px 'Fredoka';box-shadow:0 18px 40px rgba(0,0,0,.35);white-space:nowrap;transform-origin:50% 100%}
.bubble:after{content:"";position:absolute;left:50%;bottom:-18px;margin-left:-18px;border:18px solid transparent;border-top-color:rgba(255,255,255,.94);border-bottom:0}
#bfly{position:absolute;left:0;top:0;width:220px;height:200px;margin:-100px 0 0 -110px;pointer-events:none;will-change:transform;filter:drop-shadow(0 0 18px rgba(120,210,255,.85))}
#bfly .wl,#bfly .wr{transform-box:fill-box}
#bfly .wl{transform-origin:100% 50%}
#bfly .wr{transform-origin:0% 50%}
#end{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse 90% 60% at 50% 38%,#2A3F6B 0%,#1E2D4A 45%,#0d1426 100%)}
#end .cov{position:absolute;left:50%;top:250px;width:560px;height:896px;margin-left:-280px;border-radius:22px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 6px rgba(255,255,255,.08)}
#end .cov img{width:100%;height:100%;object-fit:cover}
#end .series{position:absolute;left:0;right:0;top:1230px;text-align:center;font:600 30px 'Fredoka';letter-spacing:.3em;color:var(--sun)}
#end .title{position:absolute;left:70px;right:70px;top:1290px;text-align:center;font:700 84px/1.08 'Fredoka';color:#fff}
#end .by{position:absolute;left:0;right:0;top:1540px;text-align:center;font:500 40px 'Fredoka';color:#DDE6F7}
#end .by b{color:#fff;font-weight:700}
#end .handle{position:absolute;left:0;right:0;top:1640px;text-align:center}
#end .handle span{display:inline-block;padding:16px 36px;border-radius:999px;border:3px solid rgba(143,219,255,.8);font:600 38px 'Fredoka';color:#8FDBFF}
</style>
</head>
<body>
<div id="stage">
  <div id="scenes"></div>
  <div id="end">
    <div class="cov"><img id="endcov"></div>
    <div class="series" id="e-series"></div>
    <div class="title" id="e-title"></div>
    <div class="by">Yazar: <b>Tuncay Sancak</b></div>
    <div class="handle"><span>@happytuncay · happytuncay.com</span></div>
  </div>
  <div id="leak"></div>
  <div id="vignette"></div>
  <div id="grad"></div>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="texts"></div>
  <svg id="bfly" viewBox="-110 -100 220 200">
    <defs>
      <radialGradient id="wg" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#BDF0FF"/><stop offset=".45" stop-color="#4FB8EE"/><stop offset="1" stop-color="#1B5FB0"/></radialGradient>
    </defs>
    <g class="wl"><path d="M-6 -4 C-40 -80 -108 -70 -96 -18 C-90 8 -50 10 -6 4Z" fill="url(#wg)" stroke="#0E3F7A" stroke-width="3"/><path d="M-6 6 C-50 14 -84 40 -64 70 C-44 92 -14 50 -6 12Z" fill="url(#wg)" stroke="#0E3F7A" stroke-width="3"/>
      <circle cx="-58" cy="-34" r="7" fill="#fff" opacity=".85"/><circle cx="-40" cy="46" r="5" fill="#fff" opacity=".8"/><circle cx="-78" cy="-10" r="4" fill="#FFE9A8"/></g>
    <g class="wr"><path d="M6 -4 C40 -80 108 -70 96 -18 C90 8 50 10 6 4Z" fill="url(#wg)" stroke="#0E3F7A" stroke-width="3"/><path d="M6 6 C50 14 84 40 64 70 C44 92 14 50 6 12Z" fill="url(#wg)" stroke="#0E3F7A" stroke-width="3"/>
      <circle cx="58" cy="-34" r="7" fill="#fff" opacity=".85"/><circle cx="40" cy="46" r="5" fill="#fff" opacity=".8"/><circle cx="78" cy="-10" r="4" fill="#FFE9A8"/></g>
    <ellipse cx="0" cy="4" rx="7" ry="34" fill="#12447F"/><circle cx="0" cy="-32" r="10" fill="#12447F"/>
    <circle cx="-4" cy="-34" r="2.6" fill="#fff"/><circle cx="4" cy="-34" r="2.6" fill="#fff"/>
    <path d="M-3 -40 C-10 -60 -20 -66 -24 -66 M3 -40 C10 -60 20 -66 24 -66" stroke="#12447F" stroke-width="3" fill="none"/>
    <circle cx="-24" cy="-66" r="4" fill="#FFD27A"/><circle cx="24" cy="-66" r="4" fill="#FFD27A"/>
  </svg>
  <div id="flash"></div>
</div>
<script>
/* Book trailer engine: every book shares one 70 s timeline; books/bN/config.js supplies content. */
const BOOK = new URLSearchParams(location.search).get('book') || '1';
document.write(`<script src="books/b${BOOK}/config.js"><\/script>`);
</script>
<script>
const C = window.CFG, IMG = `books/b${BOOK}/OEBPS/images/`;
const DUR = 70;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const easeOut=p=>1-Math.pow(1-p,3);
const easeBack=p=>{const c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const prog=(t,a,b)=>clamp((t-a)/(b-a));
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}

/* ---------- build the shared timeline from the config ---------- */
const SC=[], TX=[], LABELS=[];
const F=(f,s=1.06,r=0)=>({s,fx:f[0],fy:f[1],r});
SC.push({img:C.open.img, a:0.0, b:6.6, from:F(C.open.face,1.45,-1.5), to:F([.5,.5],1.08,0)});
SC.push({img:C.voices.img, a:6.0, b:12.8, from:F([.5,.5],1.05,0), to:F(C.voices.face,1.32,1)});
const PZ=C.pusula.zoom||[1.9,1.55];
SC.push({img:C.pusula.img, a:12.2, b:19.8, from:F(C.pusula.face,PZ[0],0), to:F(C.pusula.face,PZ[1],-1), cover:C.pusula.cover});
const M=C.montage, slot=28.5/M.length;
M.forEach((m,i)=>{
  const a=22.0+i*slot, b=a+slot+0.5, rot=(i%2?1:-1)*1.5;
  SC.push(i%2 ? {img:m.img,a,b,from:F([.5,.5],1.06,0),to:F(m.face,1.32,rot)} : {img:m.img,a,b,from:F(m.face,1.3,rot),to:F([.5,.5],1.06,0)});
  TX.push({a:a+.4,b:a+slot+.1,y:m.y||1420,size:m.size||78,text:m.text});
  LABELS.push([m.label,a+.4,a+slot+.1]);
});
SC.push({img:C.final.img, a:50.4, b:59.2, from:F(C.final.face,1.75,0), to:F([.5,.5],1.04,0)});
SC.push({img:'cover.jpg', a:58.6, b:65.6, from:{s:1.05,fx:.5,fy:.45,r:0}, to:{s:.86,fx:.5,fy:.5,r:0}, cover:true, bg:true});
TX.push({a:1.0,b:6.0,y:1450,size:C.open.size||76,text:C.open.text});
TX.push({a:10.9,b:12.5,y:1500,size:C.voices.size||68,text:C.voices.text});
TX.push({a:13.6,b:16.4,y:1380,size:C.pusula.size1||78,text:C.pusula.t1,sub:C.pusula.sub1||'Pusula'});
TX.push({a:16.6,b:19.4,y:1380,size:C.pusula.size2||78,text:C.pusula.t2,sub:C.pusula.sub2||'Pusula'});
TX.push({a:19.8,b:22.2,y:780,size:96,text:'[8] macera.',dark:1});
TX.push({a:20.5,b:22.2,y:930,size:96,text:'{1} pusula.',dark:1});
TX.push({a:51.2,b:54.6,y:1420,size:C.final.size1||80,text:C.final.t1});
TX.push({a:54.8,b:58.8,y:1330,size:C.final.size2||76,text:C.final.t2});
const QS=C.voices.bubbles.map((b,i)=>[b, 6.8+i*0.7, [340,720,330,700,540][i], [470,720,980,1230,300][i], [-4,3,-2,4,-3][i]]);

const scenesEl=document.getElementById('scenes');
const els=SC.map((s,k)=>{const d=document.createElement('div');d.className='scene';
  d.innerHTML=(s.bg?`<img class="coverbg" src="${IMG}cover.jpg">`:'')+`<img class="${s.cover?'cover':''}" src="${IMG}${s.img}">`;scenesEl.appendChild(d);return d});
const imgs=els.map(e=>e.querySelector('img:last-child'));
document.getElementById('endcov').src=IMG+'cover.jpg';
document.getElementById('e-series').textContent=C.series;
document.getElementById('e-title').textContent=C.title;
const FADE=0.7;

const TXT=document.getElementById('texts');
function mk(html,cls){const d=document.createElement('div');d.className=cls;d.innerHTML=html;TXT.appendChild(d);return d}
TX.forEach(o=>{
  const words=o.text.split(' ').map(w=>{
    let c='';if(/^\[.*\]$/.test(w)){c='hl';w=w.slice(1,-1)}else if(/^\{.*\}$/.test(w)){c='sky';w=w.slice(1,-1)}
    w=w.replace(/\[|\]|\{|\}/g,'');return `<span class="w ${c}">${w}</span>`});
  o.el=mk(words.join(' ')+(o.sub?`<small>— ${o.sub}</small>`:''),'t');
  o.el.style.top=o.y+'px';o.el.style.fontSize=o.size+'px';
  o.ws=[...o.el.querySelectorAll('.w')];o.sm=o.el.querySelector('small');
});
LABELS.forEach(l=>{l.el=mk(`<span>${l[0]}</span>`,'label')});
QS.forEach(q=>{q.el=mk(q[0],'bubble');q.el.style.top=q[3]+'px'});

const FLY=[
 [[12.3,1250,300,.5],[13.2,820,520,.9],[14.2,560,760,1.05],[15.4,760,980,1.0],[16.6,520,1120,.95],[17.8,330,900,.85],[19.4,-200,700,.6]],
 [[50.6,1250,1500,.5],[52,780,1250,.8],[53.4,380,1020,.75],[54.8,640,760,.7],[56.4,470,520,.65],[58.2,560,300,.55],[59.4,600,-200,.4]],
 [[64.8,-200,1300,.6],[66.2,300,1000,.8],[67.4,760,1130,.75],[68.6,850,880,.7],[70,920,860,.7]],
];
function flyAt(t){
  for(const P of FLY){
    if(t<P[0][0]||t>P[P.length-1][0])continue;
    let i=0;while(i<P.length-2&&t>P[i+1][0])i++;
    const [t0,x0,y0,s0]=P[i],[t1,x1,y1,s1]=P[i+1],p=ease(prog(t,t0,t1));
    return {x:lerp(x0,x1,p),y:lerp(y0,y1,p)+Math.sin(t*3.1)*14,s:lerp(s0,s1,p)*1.3,dx:x1-x0};
  }
  return null;
}

const bf=document.getElementById('bfly'),wl=bf.querySelector('.wl'),wr=bf.querySelector('.wr');
const cv=document.getElementById('fx'),cx=cv.getContext('2d');
const leak=document.getElementById('leak'),flash=document.getElementById('flash'),grad=document.getElementById('grad'),end=document.getElementById('end');
const DUST=Array.from({length:90},(_,i)=>({x:hash(i)*1080,y:hash(i+99)*1920,r:1.5+hash(i+7)*3.5,sp:10+hash(i+3)*30,ph:hash(i+5)*6.28,dr:hash(i+11)*2-1}));
const FLASHES=[12.3,22.0,50.5,64.6];

function render(t){
  SC.forEach((s,k)=>{
    const e=els[k];
    if(t<s.a-0.01||t>s.b+0.01){e.style.opacity=0;e.style.visibility='hidden';return}
    e.style.visibility='visible';
    let o=Math.min(prog(t,s.a,s.a+FADE),1-prog(t,s.b-FADE,s.b));
    if(k==0)o=Math.min(1,prog(t,0,1.4));
    e.style.opacity=ease(o);
    const p=ease(prog(t,s.a,s.b)),f=s.from,g=s.to;
    const sc=lerp(f.s,g.s,p),fx=lerp(f.fx,g.fx,p),fy=lerp(f.fy,g.fy,p),r=lerp(f.r,g.r,p);
    const W=imgs[k].offsetWidth,H=imgs[k].offsetHeight;
    let tx=(0.5-fx)*W*sc, ty=(0.5-fy)*H*sc;
    const mx=Math.max(0,(W*sc-1080)/2), my=Math.max(0,(H*sc-1920)/2);
    tx=clamp(tx,-mx,mx);ty=clamp(ty,-my,my);
    imgs[k].style.transform=`translate(${tx}px,${ty}px) scale(${sc}) rotate(${r}deg)`;
  });
  const inter=Math.min(prog(t,19.3,19.9),1-prog(t,21.8,22.4));
  const ep=Math.min(prog(t,64.6,65.6),1);
  end.style.opacity=ep;
  const cov=end.querySelector('.cov');cov.style.transform=`translateY(${(1-easeOut(prog(t,64.6,66.2)))*120}px) scale(${lerp(.9,1,easeOut(prog(t,64.6,66.2)))}) rotate(${Math.sin(t*.8)*1.2}deg)`;
  [['.series',65.4],['.title',65.8],['.by',66.4],['.handle',66.9]].forEach(([s,a])=>{const el=end.querySelector(s),q=easeOut(prog(t,a,a+.8));el.style.opacity=q;el.style.transform=`translateY(${(1-q)*40}px)`});
  const fin=prog(t,68.8,70);
  const anyText=TX.some(o=>!o.dark&&t>o.a-.3&&t<o.b+.3);
  grad.style.opacity=(anyText?1:0)*(1-ep);
  const lx=50+Math.sin(t*.23)*30,ly=30+Math.cos(t*.17)*20;
  leak.style.background=`radial-gradient(circle at ${lx}% ${ly}%,rgba(255,190,120,.55),rgba(255,140,90,.18) 30%,rgba(0,0,0,0) 55%)`;
  leak.style.opacity=(.35+.15*Math.sin(t*.7))*(1-inter);
  let fl=0;FLASHES.forEach(a=>{const q=t-a;if(q>0&&q<.6)fl=Math.max(fl,.42*(1-q/.6))});
  flash.style.opacity=fl;
  TX.forEach(o=>{
    const on=t>o.a-.05&&t<o.b+.05;o.el.style.display=on?'block':'none';if(!on)return;
    const out=1-prog(t,o.b-.45,o.b);
    o.ws.forEach((w,i)=>{const q=easeBack(prog(t,o.a+i*.1,o.a+i*.1+.5));w.style.opacity=clamp(prog(t,o.a+i*.1,o.a+i*.1+.35))*out;w.style.transform=`translateY(${(1-q)*50}px) scale(${lerp(.85,1,q)})`});
    if(o.sm){const q=prog(t,o.a+.9,o.a+1.4);o.sm.style.opacity=q*out}
  });
  LABELS.forEach(l=>{const on=t>l[1]&&t<l[2];l.el.style.display=on?'block':'none';if(!on)return;const q=easeBack(prog(t,l[1],l[1]+.5)),out=1-prog(t,l[2]-.4,l[2]);l.el.style.opacity=clamp(prog(t,l[1],l[1]+.3))*out;l.el.style.transform=`scale(${lerp(.6,1,q)})`});
  QS.forEach(q=>{const on=t>q[1]&&t<10.9;q.el.style.display=on?'block':'none';if(!on)return;
    const w=q.el.offsetWidth,x=clamp(q[2]-w/2,40,1040-w);q.el.style.left=x+'px';
    const p=easeBack(prog(t,q[1],q[1]+.45)),out=1-prog(t,10.4,10.9);q.el.style.opacity=clamp(prog(t,q[1],q[1]+.25))*out;q.el.style.transform=`translateY(${Math.sin(t*2+q[2])*10}px) rotate(${q[4]}deg) scale(${p*lerp(1,.8,1-out)})`});

  cx.clearRect(0,0,1080,1920);
  if(inter>0){cx.fillStyle=`rgba(13,20,38,${inter*.92})`;cx.fillRect(0,0,1080,1920)}
  cx.globalCompositeOperation='lighter';
  DUST.forEach(d=>{
    const y=((d.y-t*d.sp)%1920+1920)%1920,x=d.x+Math.sin(t*.6+d.ph)*30*d.dr;
    const a=(.25+.55*Math.pow(Math.sin(t*1.7+d.ph)*.5+.5,3))*(1-fin);
    const g=cx.createRadialGradient(x,y,0,x,y,d.r*4);g.addColorStop(0,`rgba(255,225,160,${a})`);g.addColorStop(1,'rgba(255,200,120,0)');
    cx.fillStyle=g;cx.beginPath();cx.arc(x,y,d.r*4,0,6.283);cx.fill();
  });
  const B=flyAt(t);
  if(B){
    for(let k=1;k<46;k++){
      const tk=t-k*.035,P=flyAt(tk);if(!P)continue;
      const j=hash(k+Math.floor(tk*28.57)),a=(1-k/46)*.9;
      const x=P.x+(j-.5)*60,y=P.y+(hash(k*3+Math.floor(tk*28.57))-.5)*60+k*1.5,r=(2+j*5)*(1-k/60);
      const g=cx.createRadialGradient(x,y,0,x,y,r*3);g.addColorStop(0,`rgba(${j>.5?'255,230,160':'170,230,255'},${a})`);g.addColorStop(1,'rgba(255,255,255,0)');
      cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r*3,0,6.283);cx.fill();
    }
    const flap=.25+.75*Math.abs(Math.sin(t*13));
    wl.style.transform=`scaleX(${flap})`;wr.style.transform=`scaleX(${flap})`;
    bf.style.display='block';
    bf.style.transform=`translate(${B.x}px,${B.y}px) scale(${B.s}) rotate(${clamp(B.dx/40,-18,18)}deg)`;
  } else bf.style.display='none';
  if(inter>0){
    for(let i=0;i<60;i++){const an=i/60*6.283+t*.4,rr=380+Math.sin(t*2+i)*30,x=540+Math.cos(an)*rr,y=860+Math.sin(an)*rr*.6,a=inter*(.3+.7*hash(i+Math.floor(t*6)));
      const g=cx.createRadialGradient(x,y,0,x,y,10);g.addColorStop(0,`rgba(143,219,255,${a})`);g.addColorStop(1,'rgba(143,219,255,0)');cx.fillStyle=g;cx.beginPath();cx.arc(x,y,10,0,6.283);cx.fill()}
  }
  cx.globalCompositeOperation='source-over';
  if(fin>0){cx.fillStyle=`rgba(0,0,0,${fin})`;cx.fillRect(0,0,1080,1920)}
}
window.render=render;window.DUR=DUR;
if(!location.search.includes('capture')){
  const st=document.getElementById('stage');const fit=()=>{const s=Math.min(innerWidth/1080,innerHeight/1920);st.style.transform=`scale(${s})`;st.style.marginLeft=((innerWidth-1080*s)/2)+'px'};addEventListener('resize',fit);fit();
  const t0=performance.now();const loop=()=>{render(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop)};requestAnimationFrame(loop);
}
</script>
</body>
</html>
