<html xmlns="http://www.w3.org/1999/xhtml"><head><link href="../styles/stylesheet.css" rel="stylesheet" type="text/css"/></head><body class="body0" xmlns:epub="http://www.idpf.org/2007/ops"><p class="para34"><span class="span23">Jetzt du — Das letzte Wort gehört dir</span></p><p class="para39"><span class="span24">Wenn du dieses Buch beendest: Welches Kapitel hat dich am meisten berührt? Was hast du erlebt, was fühlst du gerade, was hast du überwunden oder denkst du zu überwinden? Schreib dir einen Satz — ein Wort, das du von heute in den morgigen Tag trägst.</span></p><p class="para40"><span class="span25">                </span></p><p class="para40"><span class="span25">                </span></p><p class="para40"><span class="span25">                </span></p><p class="para40"><span class="span25">                </span></p><p class="para40"><span class="span25">                </span></p><p class="para40"><span class="span25">                </span></p><p class="para40"><span class="span25">                </span></p><p class="para40"><span class="span25">                </span></p><p class="para40"><span class="span25">                </span></p><p class="para40"><span class="span25">                </span></p><p class="para40"><span class="span25">                </span></p><p class="para40"><span class="span25">                </span></p><p class="para40"><span class="span25">                </span></p><p class="para40"><span class="span25">                </span></p><p class="para40"><span class="span25">                </span></p><p class="para40"><span class="span25">                </span></p></body></html>
