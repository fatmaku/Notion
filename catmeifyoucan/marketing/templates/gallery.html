<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cat Me If You Can · Social kit</title>
  <!-- Übersicht aller gerenderten Bilder. Start: node marketing/render.js --serve 8940 -->
  <link rel="stylesheet" href="/css/fonts.css">
  <style>
    :root { --navy: #14213d; --orange: #f28c28; --cream: #fbf3e4; --teal: #1f8a8a; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px 64px; background: var(--navy); color: var(--cream); font: 500 16px/1.5 'Manrope', system-ui, sans-serif; }
    h1 { font: 800 28px/1.2 'Unbounded', sans-serif; margin: 0 0 8px; }
    p { margin: 0 0 24px; opacity: .8; max-width: 60ch; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    button { font: 700 15px 'Manrope', sans-serif; padding: 8px 16px; border-radius: 999px; border: 2px solid rgba(251, 243, 228, .3); background: transparent; color: var(--cream); cursor: pointer; }
    button[aria-pressed="true"] { background: var(--orange); border-color: var(--orange); color: var(--navy); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px 16px; }
    figure { margin: 0; }
    figure img { width: 100%; height: auto; display: block; border-radius: 12px; background: #000; }
    figcaption { font-size: 13px; opacity: .75; margin-top: 6px; word-break: break-all; }
    .og { grid-column: span 2; }
    @media (max-width: 520px) { .og { grid-column: auto; } }
  </style>
</head>
<body>
  <h1>Cat Me If You Can · Social kit</h1>
  <p>All rendered images. Re-render with <code>node marketing/render.js</code>. Captions and hashtags: <code>marketing/CAPTIONS.md</code>.</p>
  <div class="bar" id="langs"></div>
  <div class="bar" id="formats"></div>
  <div class="grid" id="grid"></div>
  <script type="module" src="/marketing/templates/gallery.js"></script>
</body>
</html>
