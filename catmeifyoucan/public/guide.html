      <h1>How to help street cats</h1>
      <p class="guide-lead">You don’t need to touch a cat to help it.</p>
      <noscript><p>Food: dry cat food. No milk, no salty or spicy leftovers, no cooked bones. Fresh water every day. In winter, a dry box with straw. Don’t move kittens: the mother is usually near. Sick or hurt? Keep a calm distance, don’t chase, ask a vet nearby or the municipality’s vet service. A cut ear tip means the cat is neutered.</p></noscript>
