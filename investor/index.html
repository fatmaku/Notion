<style>
:root {
  --bg: #15111A; --bg2: #1B1520; --card: #241C2A; --line: #3A2E40;

  --gold: #D4B27A; --wine: #6E1630; --pink: #FF2D75; --mint: #2DFFB5; --violet: #A08FFF;
  --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans: 'Jost', Arial, Helvetica, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.55; overflow-x: hidden; }
a { color: inherit; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 720px) { .wrap { padding: 0 32px; } }

header.bar { position: sticky; top: 0; z-index: 5; background: rgba(21,17,26,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
header.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 56px; }
.brand { font-family: var(--serif); font-weight: 700; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.langs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; flex: none; }
.langs button { font: 600 13px var(--sans); letter-spacing: .08em; color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--gold); color: var(--bg); }
.langs button:focus-visible, a:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }

.hero { padding: 40px 0 28px; display: grid; gap: 28px; }
.hero > * { min-width: 0; }
@media (min-width: 900px) { .hero { grid-template-columns: 1.15fr .85fr; align-items: center; padding: 64px 0 40px; } }
.kicker { font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(40px, 9vw, 72px); line-height: 1; margin: 12px 0 14px; }
.lead { color: var(--muted); font-size: 18px; max-width: 34em; margin: 0 0 20px; }
.wave { display: flex; align-items: center; gap: 3px; height: 34px; margin: 6px 0 22px; overflow: hidden; }
.wave i { flex: none; width: 4px; border-radius: 4px; }
.askrow { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
.ask { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 18px; }
.ask small { display: block; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.ask b { font-family: var(--serif); font-size: 34px; line-height: 1.1; }
.people { font-size: 14px; color: var(--muted); }
.people b { color: var(--text); font-weight: 600; }
.mosaic { display: grid; grid-template-columns: 1.1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; aspect-ratio: 5 / 4; }
.mosaic figure { margin: 0; position: relative; border-radius: 16px; overflow: hidden; background: var(--card); }
.mosaic figure:first-child { grid-row: span 2; }
.mosaic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mosaic figcaption { position: absolute; left: 10px; bottom: 10px; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; background: rgba(21,17,26,.85); border: 1px solid currentColor; }

section { padding: 36px 0; border-top: 1px solid var(--line); }
h2 { font-family: var(--serif); font-size: clamp(28px, 5vw, 40px); line-height: 1.1; margin: 8px 0 20px; }
.grid3 { display: grid; gap: 16px; }
@media (min-width: 860px) { .grid3 { grid-template-columns: repeat(3, 1fr); } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tag { align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; border: 1.5px solid currentColor; border-radius: 999px; padding: 2px 12px; }
.card h3 { font-family: var(--serif); font-size: 24px; line-height: 1.15; margin: 0; }
.card p { margin: 0; color: var(--muted); }
.status { font-size: 14px; color: var(--text); }
.nums { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 4px 0; }
.nums b { display: block; font-family: var(--serif); font-size: 26px; line-height: 1.05; overflow-wrap: anywhere; }
.nums span { font-size: 13px; color: var(--muted); }
.links { list-style: none; margin: auto 0 0; padding: 10px 0 0; border-top: 1px solid var(--line); display: grid; gap: 6px; font-size: 14px; }
.links a { text-decoration: none; display: inline-flex; gap: 6px; align-items: baseline; }
.links a::before { content: '→'; color: var(--gold); }
.links a:hover { text-decoration: underline; }
.src { font-size: 12px; color: var(--dim); font-style: italic; }

.split { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
.splithead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 14px; }
.prop { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--pink); border: 1.5px solid var(--pink); border-radius: 999px; padding: 3px 12px; }
.bars { display: flex; height: 36px; border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
.bars div { display: flex; align-items: center; justify-content: center; color: var(--bg); font-weight: 700; font-size: 14px; }
.legend { display: grid; gap: 12px; }
@media (min-width: 720px) { .legend { grid-template-columns: repeat(3, 1fr); } }
.legend b { font-size: 16px; }
.legend .amt { font-family: var(--serif); font-size: 26px; font-weight: 700; display: block; line-height: 1.1; }
.legend small { color: var(--muted); font-size: 13px; }
.note { font-size: 13px; color: var(--muted); margin: 14px 0 0; }

.docs { display: grid; gap: 14px; }
@media (min-width: 720px) { .docs { grid-template-columns: repeat(3, 1fr); } }
.doc { background: var(--bg2); border: 1px solid var(--line); border-radius: 16px; padding: 18px; text-decoration: none; display: flex; flex-direction: column; gap: 6px; transition: border-color .15s; }
.doc:hover { border-color: var(--gold); }
.doc .type { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.doc b { font-family: var(--serif); font-size: 22px; line-height: 1.15; }
.doc span { color: var(--muted); font-size: 14px; }
.other { font-size: 13px; color: var(--muted); margin-top: 12px; }
.other a { color: var(--gold); }

.syn { display: grid; gap: 14px; }
@media (min-width: 720px) { .syn { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1000px) { .syn { grid-template-columns: repeat(4, 1fr); } }
.syn div { background: var(--bg2); border-radius: 16px; padding: 18px; }
.syn b { display: block; margin-bottom: 6px; }
.syn span { color: var(--muted); font-size: 14px; }

footer { border-top: 1px solid var(--line); padding: 28px 0 40px; color: var(--muted); font-size: 14px; }
footer .contact { color: var(--text); font-weight: 600; font-size: 16px; margin-bottom: 8px; }
footer .disc { font-size: 12px; color: var(--dim); font-style: italic; margin-top: 10px; }
</style>
