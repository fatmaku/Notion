name: window-blaster

on:
  push:
    branches: [main, master, 'claude/laughing-ride-afs0pe']
    paths: ['window-blaster/**', '.github/workflows/window-blaster.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-window-blaster
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: window-blaster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: window-blaster/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: window-blaster/launcher/go.sum
      - name: Launcher tests + Linux build for e2e
        working-directory: window-blaster/launcher
        run: go test ./... && CGO_ENABLED=0 go build -o dist/windowblaster-linux-amd64 .
      - name: Typecheck leaderboard worker
        working-directory: window-blaster/server/leaderboard-worker
        run: npm ci && npm run typecheck
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke test (headless, fake camera)
        run: npm run e2e
      - name: Build for GitHub Pages
        env:
          VITE_BASE: /${{ github.event.repository.name }}/window-blaster/
          VITE_LEADERBOARD_URL: ${{ vars.LEADERBOARD_URL }}
        run: npm run build
      - name: Assemble site
        run: |
          mkdir -p ../_site/window-blaster
          cp -r dist/* ../_site/window-blaster/
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=window-blaster/"><a href="window-blaster/">Window Blaster</a>' > ../_site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: window-blaster/test-results
          if-no-files-found: ignore

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Hint when GitHub Pages is not enabled yet
        if: steps.deployment.outcome != 'success'
        run: |
          echo "::warning title=GitHub Pages nicht aktiviert::Bitte einmalig unter https://github.com/${{ github.repository }}/settings/pages die Quelle 'GitHub Actions' wählen. Danach deployt dieser Workflow automatisch nach https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/window-blaster/"
          echo "Build und Tests sind grün; nur das Deployment wurde übersprungen."
