 Art. 9 DSGVO (z. B. Angaben zu\nVerletzungen nach einem Unfall) erfasst werden, soweit dies nicht im\nEinzelfall erforderlich ist.</p>\n<p>(7) <strong>Aufbewahrung und Archivierung.</strong> Der Kunde legt\ndie Löschfristen für seinen Mandanten fest. Er ist selbst dafür\nverantwortlich, handels- und steuerrechtliche Aufbewahrungspflichten zu\nerfüllen, insbesondere Unterlagen, die Buchungsbelege sind, nach den\nGoBD in seinen eigenen Systemen zu archivieren. Der Anbieter empfiehlt,\nAbliefernachweise und Dokumente regelmäßig zu exportieren.</p>\n<p>(8) <strong>Endgeräte.</strong> Der Kunde stellt sicher, dass die\nEndgeräte seiner Nutzer die technischen Voraussetzungen der\nLeistungsbeschreibung erfüllen, mit Bildschirmsperre geschützt und auf\naktuellem Stand sind. Ob Fahrer Dienstgeräte oder private Geräte nutzen,\nentscheidet der Kunde in eigener Verantwortung.</p>\n<p>(9) <strong>Mitwirkung bei Störungen.</strong> Der Kunde meldet\nStörungen über die Supportwege der Leistungsbeschreibung/SLA mit einer\nnachvollziehbaren Beschreibung.</p>\n<p>(10) <strong>Subunternehmer.</strong> Setzt der Kunde Fahrer von\nSubunternehmern ein, verpflichtet er diese vertraglich auf die\nNutzungsbedingungen für Fahrer und stellt deren Information nach Art. 13\nDSGVO sicher.</p>\n<h2 id=\"-10-unzulässige-nutzung-vorübergehende-beschränkung\">§ 10\nUnzulässige Nutzung, vorübergehende Beschränkung</h2>\n<p>(1) Unzulässig ist insbesondere,</p>\n<ol type=\"1\">\n<li>rechtswidrige Inhalte oder Schadsoftware hochzuladen;</li>\n<li>Sicherheitsmaßnahmen zu umgehen, Zugänge Dritter zu nutzen oder\nTarifgrenzen technisch zu umgehen;</li>\n<li>die Plattform übermäßig zu belasten oder Sicherheitstests ohne\nvorherige Zustimmung des Anbieters in Textform durchzuführen;</li>\n<li>die Plattform zu einer fortlaufenden Ortung oder Überwachung von\nPersonen zu verwenden, die über die vorgesehenen Funktionen\nhinausgeht.</li>\n</ol>\n<p>(2) Bestehen konkrete Anhaltspunkte für einen Verstoß gegen Abs. 1\noder droht eine Gefahr für die Sicherheit der Plattform oder anderer\nKunden (z. B. kompromittierter Zugang), kann der Anbieter einzelne\nZugänge oder Funktionen vorübergehend beschränken. Er wählt das mildeste\ngeeignete Mittel, informiert den Kunden unverzüglich, möglichst vorab,\nund hebt die Beschränkung auf, sobald der Grund entfallen ist. Hat der\nKunde den Grund zu vertreten, bleibt die Vergütungspflicht bestehen.</p>\n<h2 id=\"-11-verfügbarkeit-wartung-support\">§ 11 Verfügbarkeit, Wartung,\nSupport</h2>\n<p>(1) Der Anbieter stellt die Plattform mit einer Verfügbarkeit im\nMonatsmittel von 99,0 % in den Tarifen Start und Flotte und von 99,5 %\nim Tarif Premium bereit. Berechnung, Ausnahmen, Wartungsfenster und\nGutschriften regelt das SLA.</p>\n<p>(2) Der Anbieter führt geplante Wartungen grundsätzlich in den\nWartungsfenstern des SLA durch und kündigt sie vorher an.</p>\n<p>(3) Supportzeiten, Supportwege und Reaktionszeiten ergeben sich aus\ndem SLA. Der Prioritäts-Support ist Bestandteil des Tarifs Premium.</p>\n<h2 id=\"-12-weiterentwicklung-der-plattform\">§ 12 Weiterentwicklung der\nPlattform</h2>\n<p>(1) Der Anbieter entwickelt die Plattform fortlaufend weiter. Er darf\nFunktionen ändern, ersetzen oder einstellen, wenn dies (a) aus\nrechtlichen oder regulatorischen Gründen, zur Gewährleistung der\nSicherheit oder wegen Änderungen bei Dritten (z. B. Browser,\nBetriebssysteme, Push-Dienste, App-Stores) erforderlich ist oder (b) für\nden Kunden unter Berücksichtigung seiner Interessen zumutbar ist. Die\nKernfunktionen Lieferungen, Statusmeldungen, Dokumente und Fotos,\nBenachrichtigungen und Datenexport bleiben mindestens gleichwertig\nerhalten.</p>\n<p>(2) Wesentliche Änderungen, die sich für den Kunden nachteilig\nauswirken, kündigt der Anbieter mindestens [6] Wochen vor ihrem\nWirksamwerden in Textform an. Der Kunde kann den Vertrag in diesem Fall\naußerordentlich zum Zeitpunkt des Wirksamwerdens kündigen. Der Anbieter\nweist in der Ankündigung auf dieses Recht hin.</p>\n<p>(3) Als „Beta“ gekennzeichnete Funktionen sind freiwillige\nVorabversionen. Für sie gelten keine Verfügbarkeitszusagen.</p>\n<h2 id=\"-13-vergütung-abrechnung-zahlung\">§ 13 Vergütung, Abrechnung,\nZahlung</h2>\n<p>(1) Alle Preise verstehen sich in Euro zuzüglich der jeweils\ngesetzlichen Umsatzsteuer.</p>\n<p>(2) <strong>Monatliche Zahlweise.</strong> Der Grundpreis des Tarifs\nist monatlich im Voraus fällig. Zusatzfahrer und Zusatzspeicher werden\nmonatlich nachträglich abgerechnet.</p>\n<p>(3) <strong>Jährliche Zahlweise.</strong> Bei jährlicher Zahlweise\nzahlt der Kunde für zwölf Monate den zehnfachen monatlichen Grundpreis\nim Voraus („2 Monate geschenkt“). Zusatzfahrer und Zusatzspeicher werden\nmonatlich nachträglich abgerechnet.</p>\n<p>(4) Rechnungen werden elektronisch übermittelt. Der Kunde ist mit dem\nEmpfang elektronischer Rechnungen einverstanden. Soweit gesetzlich\nvorgeschrieben oder vom Kunden gewünscht, stellt der Anbieter Rechnungen\nin einem strukturierten elektronischen Format (z. B. XRechnung oder\nZUGFeRD) aus.</p>\n<p>(5) Rechnungsbeträge sind innerhalb von [14] Tagen nach Zugang der\nRechnung ohne Abzug fällig. Zahlungen erfolgen per Überweisung oder,\nfalls vereinbart, per SEPA-Lastschrift. Bei SEPA-Lastschrift wird die\nVorabankündigung (Pre-Notification) auf [einen] Tag vor Fälligkeit\nverkürzt. Kosten einer vom Kunden zu vertretenden Rücklastschrift trägt\nder Kunde.</p>\n<p>(6) Kunden mit Sitz in einem anderen Mitgliedstaat der EU teilen ihre\ngültige Umsatzsteuer-Identifikationsnummer mit. Liegt der Ort der\nLeistung im Ausland, rechnet der Anbieter ohne deutsche Umsatzsteuer ab;\ndie Steuer schuldet der Kunde als Leistungsempfänger.</p>\n<p>(7) Die Plattform ermittelt die abrechnungsrelevanten Kennzahlen\n(Tarif, Fahrerzahl, Speicher). Einwendungen gegen eine Rechnung erhebt\nder Kunde innerhalb von [6] Wochen nach Zugang in Textform. Unterlässt\ner dies, gilt die Rechnung als genehmigt; der Anbieter weist in jeder\nRechnung auf diese Folge hin. Gesetzliche Ansprüche des Kunden bei\nbegründeten Einwendungen nach Fristablauf bleiben unberührt.</p>\n<p>(8) Der Kunde kann nur mit unbestrittenen oder rechtskräftig\nfestgestellten Forderungen aufrechnen und ein Zurückbehaltungsrecht nur\nwegen Ansprüchen aus demselben Vertragsverhältnis ausüben. Dies gilt\nnicht für Gegenansprüche wegen Mängeln oder teilweiser Nichterfüllung\naus demselben Vertrag.</p>\n<h2 id=\"-14-zahlungsverzug-und-sperrung\">§ 14 Zahlungsverzug und\nSperrung</h2>\n<p>(1) Gerät der Kunde in Zahlungsverzug, schuldet er Verzugszinsen in\ngesetzlicher Höhe (§ 288 Abs. 2 BGB) und die Pauschale nach § 288 Abs. 5\nBGB. Weitergehende Ansprüche bleiben unberührt.</p>\n<p>(2) Ist der Kunde mit einem Betrag von mindestens einem monatlichen\nGrundpreis länger als [14] Tage nach Fälligkeit in Verzug, kann der\nAnbieter den Mandanten in den Status „Gesperrt“ versetzen. Voraussetzung\nist eine Mahnung in Textform, die die Sperrung ankündigt und eine\nZahlungsfrist von mindestens [10] Werktagen setzt.</p>\n<p>(3) Im Status „Gesperrt“ können die Nutzer die Daten weiterhin lesen\nund der Admin kann alle Daten vollständig exportieren. Neue Lieferungen,\nStatusmeldungen und Uploads sind nicht möglich; die Fahrer-App zeigt\neinen entsprechenden Hinweis. Der Kunde ist selbst dafür verantwortlich,\nlaufende Touren in diesem Fall auf andere Weise zu dokumentieren.</p>\n<p>(4) Der Anbieter hebt die Sperrung innerhalb von [einem] Werktag nach\nvollständigem Zahlungseingang auf. Die Vergütungspflicht besteht während\nder Sperrung fort.</p>\n<p>(5) Ist der Kunde für zwei aufeinanderfolgende Monate mit der\nVergütung oder einem nicht unerheblichen Teil davon oder über einen\nlängeren Zeitraum mit einem Betrag in Höhe von zwei monatlichen\nGrundpreisen in Verzug, kann der Anbieter den Vertrag außerordentlich\nkündigen. § 18 (Abrufzeitraum) bleibt unberührt.</p>\n<h2 id=\"-15-preisanpassung\">§ 15 Preisanpassung</h2>\n<p>(1) Der Anbieter kann die Vergütung nach billigem Ermessen (§ 315\nBGB) an die Entwicklung der Kosten anpassen, die für die Erbringung der\nLeistungen maßgeblich sind. Maßgeblich sind ausschließlich die Kosten\nfür Rechenzentrum und Hosting, Speicher und Datensicherung, Lizenzen und\nLeistungen Dritter, Energie sowie Personalkosten für Betrieb und\nSupport. Steigerungen einer Kostenart dürfen nur in dem Umfang\nberücksichtigt werden, in dem sie nicht durch Kostensenkungen in anderen\nBereichen ausgeglichen werden. Kostensenkungen gibt der Anbieter in\ngleicher Weise weiter. Eine Erhöhung des Gewinnanteils ist\nausgeschlossen.</p>\n<p>(2) Eine Anpassung ist frühestens zwölf Monate nach Vertragsbeginn\nund danach höchstens einmal in zwölf Monaten zulässig. Jede Erhöhung ist\nauf [5] % des bisherigen Entgelts begrenzt. Bei jährlicher Zahlweise\nwird eine Anpassung erst zu Beginn des nächsten Vertragsjahres\nwirksam.</p>\n<p>(3) Der Anbieter teilt dem Kunden die Anpassung mindestens [6] Wochen\nvor ihrem Wirksamwerden in Textform mit und erläutert die maßgeblichen\nKostenänderungen. Im Fall einer Erhöhung kann der Kunde den Vertrag\ninnerhalb von [4] Wochen nach Zugang der Mitteilung zum Zeitpunkt des\nWirksamwerdens kündigen. Der Anbieter weist in der Mitteilung auf dieses\nRecht hin.</p>\n<p>(4) Änderungen des gesetzlichen Umsatzsteuersatzes werden ab ihrem\nInkrafttreten berücksichtigt.</p>\n<blockquote>\n<p><strong>Prüfhinweis:</strong> Kostenelementeklauseln sind in\nDauerschuldverhältnissen nicht grundsätzlich unwirksam, müssen aber\ntransparent sein und Kostensenkungen gleichermaßen berücksichtigen (BGH,\nUrt. v. 15.11.2007 – III ZR 247/06). Ein Kündigungsrecht gleicht eine\nunangemessene Klausel nach der BGH-Linie nicht allein aus. Für B2B-SaaS\nfehlt eigene Rechtsprechung; die Maßstäbe aus dem Verbraucherbereich\nwerden herangezogen. Eine automatische Indexbindung wäre am\nPreisklauselgesetz zu messen. <strong>Einfachere Alternative:</strong>\nfeste Preise für die Erstlaufzeit; bei Jahresverträgen kann der Anbieter\nfür die Verlängerung neue Preise anbieten, die nur wirksam werden, wenn\nder Kunde nicht vor Beginn der Verlängerung kündigt.</p>\n</blockquote>\n<h2 id=\"-16-laufzeit-und-kündigung\">§ 16 Laufzeit und Kündigung</h2>\n<p>(1) <strong>Monatsvertrag.</strong> Bei monatlicher Zahlweise läuft\nder Vertrag auf unbestimmte Zeit. Der Kunde kann mit einer Frist von\n[14] Tagen zum Ende eines Abrechnungsmonats kündigen. Der Anbieter kann\nmit einer Frist von [drei] Monaten zum Ende eines Abrechnungsmonats\nkündigen.</p>\n<p>(2) <strong>Jahresvertrag.</strong> Bei jährlicher Zahlweise beträgt\ndie Laufzeit zwölf Monate. Sie verlängert sich jeweils um weitere zwölf\nMonate, wenn nicht eine Partei mit einer Frist von [einem] Monat (Kunde)\nbzw. [drei] Monaten (Anbieter) zum Ende der jeweiligen Laufzeit kündigt.\nDer Anbieter erinnert den Kunden spätestens [acht] Wochen vor Ablauf der\nKündigungsfrist in Textform an die bevorstehende Verlängerung und an die\nMöglichkeit, in die monatliche Zahlweise zu wechseln.</p>\n<p>(3) <strong>Anbieterwechsel.</strong> Unabhängig von Abs. 1 und 2\nkann der Kunde jederzeit nach § 17 einen Anbieterwechsel, eine\nÜbertragung in eigene IT-Infrastruktur oder die Löschung seiner Daten\nverlangen. Bei einem Jahresvertrag wird in diesem Fall die tatsächliche\nNutzungsdauer bis zum Vertragsende zum monatlichen Grundpreis\nabgerechnet. Übersteigt die Vorauszahlung diesen Betrag, erstattet der\nAnbieter die Differenz. Eine Nachforderung findet nicht statt. Weitere\nEntgelte für die vorzeitige Beendigung werden nicht erhoben.</p>\n<p>(4) Das Recht zur außerordentlichen Kündigung aus wichtigem Grund\nbleibt unberührt. Ein wichtiger Grund für den Kunden liegt insbesondere\nvor, wenn die vereinbarte Verfügbarkeit in zwei aufeinanderfolgenden\nMonaten oder in drei Monaten innerhalb von zwölf Monaten um mehr als\n[zwei] Prozentpunkte unterschritten wird. Ein wichtiger Grund für den\nAnbieter liegt insbesondere in den Fällen des § 14 Abs. 5 sowie bei\neinem schwerwiegenden Verstoß gegen § 10 vor, der trotz Abmahnung in\nTextform nicht abgestellt wird.</p>\n<p>(5) Kündigungen bedürfen der Textform. Der Admin kann den Vertrag\nauch über die Plattform kündigen.</p>\n<p>(6) Nach Zugang einer Kündigung erhält der Mandant den Status\n„Gekündigt“. Bis zum Vertragsende steht die Plattform unverändert zur\nVerfügung.</p>\n<blockquote>\n<p><strong>Prüfhinweis:</strong> Art. 25 Abs. 2 lit. d Data Act begrenzt\ndie Frist für die Einleitung des Wechselvorgangs auf höchstens zwei\nMonate. Ob dies auch ein Recht zur vorzeitigen Beendigung befristeter\nVerträge begründet, ist umstritten. Erwägungsgrund 89 lässt befristete\nVerträge mit verhältnismäßigen Entgelten für die vorzeitige Beendigung\nzu; was verhältnismäßig ist, ist offen. Abs. 3 wählt eine\nkundenfreundliche Lösung (Wegfall des Jahresrabatts, keine\nNachforderung), um nicht als Wechselhindernis (Art. 23) zu gelten. Der\nDigital Omnibus (Vorschlag der Kommission vom 19.11.2025) sieht hierzu\nKlarstellungen und Ausnahmen für KMU vor; er war am 16.10.2026 noch\nnicht verabschiedet.</p>\n</blockquote>\n<h2 id=\"-17-datenexport-und-anbieterwechsel-eu-data-act\">§ 17\nDatenexport und Anbieterwechsel (EU Data Act)</h2>\n<p>(1) <strong>Jederzeitiger Export.</strong> Der Admin kann jederzeit,\nauch im Status „Gesperrt“ oder „Gekündigt“, alle exportierbaren Daten\n(Anlage A) in strukturierten, gängigen und maschinenlesbaren Formaten\nexportieren: JSON (vollständiger Datenbestand mit Metadaten), CSV\n(Tabellen) und die Originaldateien (Fotos, PDF-Dokumente,\nUnterschriften, Logo). Im Tarif Premium steht zusätzlich die REST-API\nzur Verfügung. Die Datenformate und Datenstrukturen sind unter\n[Website-URL/export-formate] dokumentiert.</p>\n<p>(2) <strong>Wechselverlangen.</strong> Der Kunde kann in Textform\nverlangen,</p>\n<ol type=\"1\">\n<li>zu einem anderen Anbieter von Datenverarbeitungsdiensten zu\nwechseln,</li>\n<li>seine Daten in eine eigene IT-Infrastruktur zu übertragen oder</li>\n<li>seine exportierbaren Daten löschen zu lassen.</li>\n</ol>\n<p>Das Wechselverlangen kann mit einer Frist von höchstens zwei Monaten\nerklärt werden; der Kunde bestimmt den Zeitpunkt innerhalb dieser\nFrist.</p>\n<p>(3) <strong>Übergangszeitraum.</strong> Nach Ablauf der Frist nach\nAbs. 2 beginnt ein Übergangszeitraum von höchstens 30 Kalendertagen. In\ndieser Zeit erbringt der Anbieter die vertraglichen Leistungen\nunverändert weiter, unterstützt den Wechsel nach Treu und Glauben,\nstellt die erforderlichen Informationen bereit, arbeitet – soweit\nerforderlich – mit dem neuen Anbieter zusammen und wahrt ein hohes Maß\nan Sicherheit. Ist der Wechsel innerhalb von 30 Kalendertagen technisch\nnicht durchführbar, teilt der Anbieter dies dem Kunden innerhalb von 14\nWerktagen nach Zugang des Wechselverlangens mit, begründet dies und\nnennt einen alternativen Übergangszeitraum von höchstens sieben Monaten.\nDer Kunde kann den Übergangszeitraum einmal um einen von ihm für\nangemessen gehaltenen Zeitraum verlängern.</p>\n<p>(4) <strong>Datenabrufzeitraum.</strong> Nach Ablauf des\nÜbergangszeitraums kann der Kunde seine Daten noch mindestens 30\nKalendertage lesen und exportieren.</p>\n<p>(5) <strong>Vertragsende.</strong> Der Vertrag endet mit dem\nerfolgreichen Abschluss des Wechselvorgangs; der Anbieter bestätigt dies\nin Textform. Verlangt der Kunde nur die Löschung (Abs. 2 Nr. 3), endet\nder Vertrag mit Ablauf der Frist nach Abs. 2. Danach gilt § 18.</p>\n<p>(6) <strong>Kosten.</strong> Der Anbieter erhebt für den Wechsel, den\nDatenexport und die Unterstützung nach Abs. 3 keine Entgelte.\nLeistungen, die über die gesetzlich vorgeschriebene Unterstützung\nhinausgehen (z. B. die Umwandlung der Daten in das Format eines\nbestimmten Zielsystems), erbringt der Anbieter nur auf Grundlage einer\ngesonderten Vereinbarung und nur, soweit dies nach Art. 29 Data Act\nzulässig ist.</p>\n<p>(7) <strong>Informationen.</strong> Der Anbieter stellt unter\n[Website-URL/datenwechsel] Informationen über das Wechselverfahren, die\nverfügbaren Methoden und Formate, bekannte Einschränkungen und\ntechnische Grenzen, die Standorte der IT-Infrastruktur (ausschließlich\nDeutschland) sowie die Maßnahmen gegen unrechtmäßigen staatlichen\nZugriff aus Drittstaaten bereit.</p>\n<blockquote>\n<p><strong>Prüfhinweis:</strong> Die Plattform ist ein\nDatenverarbeitungsdienst im Sinne des Art. 2 Nr. 8 Data Act; die\nBundesnetzagentur ordnet SaaS ausdrücklich ein. Pflichtinhalte nach Art.\n25 Abs. 2: Wechselrecht und Unterstützung (lit. a), Übergangszeitraum 30\nTage mit Verlängerung (lit. a i. V. m. Abs. 4 und 5), Kündigung nach\nAbschluss (lit. c), höchstens zwei Monate Frist (lit. d), abschließende\nAufzählung exportierbarer Daten (lit. e) und ausgenommener Daten (lit.\nf), Abrufzeitraum mindestens 30 Tage (lit. g), vollständige Löschung\n(lit. h), Wechselentgelte (lit. i). Art. 29: Wechselentgelte ab\n12.01.2027 unzulässig; bis dahin höchstens kostendeckend.\nInformationspflichten: Art. 26 und Art. 28. Aufsichtsbehörde ist die\nBundesnetzagentur (Data-Act-Durchführungsgesetz, in Kraft seit\n30.05.2026).</p>\n</blockquote>\n<h2 id=\"-18-vertragsende-abrufzeitraum-und-löschung\">§ 18 Vertragsende,\nAbrufzeitraum und Löschung</h2>\n<p>(1) Nach Vertragsende kann der Admin die Daten noch 30 Kalendertage\nlesen und exportieren (Abrufzeitraum). Im Fall des § 17 tritt der\nDatenabrufzeitraum nach § 17 Abs. 4 an die Stelle dieses\nAbrufzeitraums.</p>\n<p>(2) Nach Ablauf des Abrufzeitraums löscht der Anbieter alle\nKundendaten einschließlich der Dateien innerhalb von [30] Tagen\nvollständig. Datensicherungen werden im regulären Sicherungszyklus\nüberschrieben, spätestens [30] Tage nach der Löschung im\nProduktivsystem. Der Anbieter bestätigt die Löschung auf Verlangen in\nTextform.</p>\n<p>(3) Von der Löschung ausgenommen sind Daten, die der Anbieter als\nVerantwortlicher aufgrund eigener gesetzlicher Pflichten aufbewahren\nmuss, insbesondere Vertrags- und Abrechnungsdaten. Auftragsdaten gehören\nnicht dazu.</p>\n<p>(4) Es obliegt dem Kunden, seine Daten vor Ablauf des Abrufzeitraums\nzu exportieren.</p>\n<h2 id=\"-19-mängelrechte\">§ 19 Mängelrechte</h2>\n<p>(1) Für die Bereitstellung der Plattform gelten die Vorschriften des\nMietrechts (§§ 535 ff. BGB) nach Maßgabe der folgenden Absätze. Der\nAnbieter erhält die Plattform während der Vertragslaufzeit in einem zum\nvertragsgemäßen Gebrauch geeigneten Zustand.</p>\n<p>(2) Die verschuldensunabhängige Haftung des Anbieters für Mängel, die\nbereits bei Vertragsschluss vorhanden waren (§ 536a Abs. 1 Alt. 1 BGB),\nist ausgeschlossen.</p>\n<p>(3) Der Kunde zeigt Mängel unverzüglich in Textform mit einer\nnachvollziehbaren Beschreibung an (§ 536c BGB).</p>\n<p>(4) Der Anbieter beseitigt Mängel innerhalb angemessener Frist unter\nBerücksichtigung der Reaktionszeiten des SLA. Er kann einen Mangel auch\ndurch eine zumutbare Umgehungslösung beheben.</p>\n<p>(5) Das Recht des Kunden zur Minderung bleibt unberührt. Gutschriften\nnach dem SLA werden auf Minderungs- und Schadensersatzansprüche\nangerechnet. Der Kunde kann die Minderung durch Abzug von laufenden\nZahlungen nur geltend machen, wenn der Minderungsanspruch unbestritten\noder rechtskräftig festgestellt ist; im Übrigen kann er zu viel gezahlte\nBeträge zurückfordern.</p>\n<p>(6) Eine Kündigung wegen Nichtgewährung des Gebrauchs nach § 543 Abs.\n2 Satz 1 Nr. 1 BGB ist erst zulässig, wenn der Anbieter ausreichend\nGelegenheit zur Mängelbeseitigung hatte und diese fehlgeschlagen\nist.</p>\n<p>(7) Ein Mangel liegt nicht vor bei unerheblichen Abweichungen sowie\nbei Beeinträchtigungen, die auf Endgeräte, Netze oder Software des\nKunden oder Dritter (z. B. Browser, Push-Dienste, App-Stores, Mobilfunk)\noder auf eine nicht bestimmungsgemäße Nutzung zurückgehen.</p>\n<p>(8) Für werkvertragliche Leistungen (z. B. Erstellung der\nWhite-Label-App, individuelle Anpassungen) verjähren Mängelansprüche in\nzwölf Monaten ab Abnahme. Dies gilt nicht für Schadensersatzansprüche\nnach § 20 Abs. 1 und bei Arglist.</p>\n<p>(9) Schadensersatz und Ersatz vergeblicher Aufwendungen schuldet der\nAnbieter nur nach § 20.</p>\n<blockquote>\n<p><strong>Prüfhinweis:</strong> Der BGH ordnet die Bereitstellung von\nSoftware über das Internet als Mietvertrag ein (BGH, Urt. v. 15.11.2006\n– XII ZR 120/04). Zu prüfen sind die AGB-Festigkeit von Abs. 2 und Abs.\n5 im B2B-Verkehr sowie die Anrechnung der Gutschriften.</p>\n</blockquote>\n<h2 id=\"-20-haftung\">§ 20 Haftung</h2>\n<p>(1) Der Anbieter haftet unbeschränkt</p>\n<ol type=\"1\">\n<li>bei Vorsatz und grober Fahrlässigkeit,</li>\n<li>bei Verletzung des Lebens, des Körpers oder der Gesundheit,</li>\n<li>nach dem Produkthaftungsgesetz,</li>\n<li>im Umfang einer ausdrücklich als solche bezeichneten Garantie,</li>\n<li>bei arglistig verschwiegenen Mängeln.</li>\n</ol>\n<p>(2) Bei einfacher Fahrlässigkeit haftet der Anbieter nur bei\nVerletzung einer wesentlichen Vertragspflicht. Wesentliche\nVertragspflichten sind Pflichten, deren Erfüllung die ordnungsgemäße\nDurchführung des Vertrags überhaupt erst ermöglicht und auf deren\nEinhaltung der Kunde regelmäßig vertrauen darf, insbesondere die\nBereitstellung der Plattform im Wesentlichen, die Einhaltung der\ntechnischen und organisatorischen Maßnahmen und die Datensicherung nach\nder Leistungsbeschreibung. In diesem Fall ist die Haftung auf den bei\nVertragsschluss vorhersehbaren, vertragstypischen Schaden begrenzt.</p>\n<p>(3) In den Fällen des Abs. 2 ist die Haftung je Schadensfall auf [den\nBetrag der für die vorangegangenen zwölf Monate geschuldeten Vergütung,\nmindestens jedoch 10.000 €] und für alle Schadensfälle eines\nVertragsjahres insgesamt auf [25.000 €] begrenzt.</p>\n<p>(4) Für den Verlust von Daten haftet der Anbieter im Fall des Abs. 2\nnur in Höhe des Aufwands, der für die Wiederherstellung aus der letzten\nnach der Leistungsbeschreibung geschuldeten Datensicherung erforderlich\nist, es sei denn, der Anbieter hat die Datensicherung pflichtwidrig\nunterlassen.</p>\n<p>(5) Die Haftungsbeschränkungen gelten auch zugunsten der Organe,\nMitarbeiter und Erfüllungsgehilfen des Anbieters.</p>\n<p>(6) Die Haftung gegenüber betroffenen Personen nach Art. 82 DSGVO\nbleibt unberührt. Im Verhältnis der Parteien gelten Art. 82 Abs. 4 und 5\nDSGVO und der AVV.</p>\n<p>(7) Schadensersatzansprüche nach Abs. 2 verjähren in einem Jahr ab\ndem gesetzlichen Verjährungsbeginn. Für Ansprüche nach Abs. 1 gelten die\ngesetzlichen Fristen.</p>\n<p>(8) Ein Mitverschulden des Kunden, insbesondere die Nichtbeachtung\nder Pflichten aus § 9, ist zu berücksichtigen (§ 254 BGB).</p>\n<blockquote>\n<p><strong>Prüfhinweis:</strong> Im unternehmerischen Verkehr ist die\nKlausel nur an § 307 BGB zu messen; § 309 Nr. 7 BGB wirkt über § 307\nindiziell. Die Haftungshöchstsumme muss den vertragstypischen,\nvorhersehbaren Schaden abdecken (BGH, Urt. v. 17.10.2013 – I ZR 226/12);\nder Begriff „Kardinalpflicht“ ist zu erläutern, wie in Abs. 2 geschehen.\nDie Beträge sind mit der Deckungssumme der IT-Haftpflichtversicherung\nabzustimmen. Zur neuen Produkthaftung: Die Richtlinie (EU) 2024/2853\nerfasst Software als Produkt und ist bis 09.12.2026 umzusetzen. Der\nBundestag hat das Gesetz zur Modernisierung des Produkthaftungsrechts am\n08.10.2026 beschlossen (BT-Drs. 21/4297, 21/8429), der zweite Durchgang\nim Bundesrat stand am 16.10.2026 aus (BR-Drs. 584/26). Gegenüber\nGeschädigten kann die Haftung nicht vertraglich ausgeschlossen werden.\nSachschäden an ausschließlich beruflich genutzten Sachen und der Verlust\nberuflich genutzter Daten sind nach der Richtlinie nicht ersatzfähig.\nRelevant bleiben Personenschäden, etwa bei Unfällen.</p>\n</blockquote>\n<h2 id=\"-21-schutzrechte-dritter-freistellung\">§ 21 Schutzrechte\nDritter, Freistellung</h2>\n<p>(1) Der Anbieter stellt den Kunden von Ansprüchen Dritter frei, die\ndarauf gestützt werden, dass die vertragsgemäße Nutzung der Plattform in\nDeutschland Schutzrechte Dritter verletzt. Voraussetzung ist, dass der\nKunde den Anbieter unverzüglich informiert, keine Ansprüche anerkennt\nund dem Anbieter die Verteidigung überlässt. Der Anbieter kann nach\nseiner Wahl die Plattform so ändern, dass sie die Schutzrechte nicht\nmehr verletzt, oder ein Nutzungsrecht beschaffen. § 20 gilt für\nweitergehende Ansprüche.</p>\n<p>(2) Der Kunde stellt den Anbieter von Ansprüchen Dritter frei, die\naus einer vom Kunden zu vertretenden rechtswidrigen Nutzung der\nPlattform durch ihn oder seine Nutzer entstehen; § 8 Abs. 4 Satz 2 und 3\ngilt entsprechend.</p>\n<h2 id=\"-22-datenschutz\">§ 22 Datenschutz</h2>\n<p>(1) Soweit der Anbieter im Auftrag des Kunden personenbezogene Daten\nverarbeitet, handelt er als Auftragsverarbeiter nach Art. 28 DSGVO auf\nGrundlage des AVV. Der AVV wird mit diesen AGB in elektronischer Form\ngeschlossen (Art. 28 Abs. 9 DSGVO).</p>\n<p>(2) Der Anbieter hat keine Einsicht in Auftragsdaten. Ein\nSupport-Zugriff auf den Mandanten erfolgt nur, wenn der Admin ihn\nfreigibt; die Freigabe ist zeitlich begrenzt, jederzeit widerruflich und\njeder Zugriff wird im für den Kunden einsehbaren Protokoll dokumentiert\n(Einzelheiten: AVV Anlage 4).</p>\n<p>(3) Für Daten zur Vertragsanbahnung, zum Kundenkonto und zur\nAbrechnung ist der Anbieter Verantwortlicher. Einzelheiten enthält die\nDatenschutzerklärung unter [Website-URL/datenschutz].</p>\n<h2 id=\"-23-vertraulichkeit\">§ 23 Vertraulichkeit</h2>\n<p>(1) Die Parteien behandeln alle ihnen im Rahmen des Vertrags bekannt\nwerdenden vertraulichen Informationen der anderen Partei, insbesondere\nGeschäftsgeheimnisse im Sinne des Geschäftsgeheimnisgesetzes,\nKundendaten, Preise und Sicherheitsinformationen, vertraulich und\nverwenden sie nur zur Durchführung des Vertrags.</p>\n<p>(2) Die Pflicht gilt nicht für Informationen, die öffentlich bekannt\nsind oder ohne Verstoß gegen diese Pflicht werden, die der empfangenden\nPartei bereits bekannt waren oder die aufgrund gesetzlicher Pflicht oder\nbehördlicher oder gerichtlicher Anordnung offengelegt werden müssen; im\nletzten Fall informiert die offenlegende Partei die andere Partei,\nsoweit zulässig, vorab.</p>\n<p>(3) Die Vertraulichkeitspflicht besteht für [drei] Jahre nach\nVertragsende fort, für Geschäftsgeheimnisse so lange, wie sie\nGeschäftsgeheimnisse sind.</p>\n<h2 id=\"-24-informationssicherheit-sicherheitsvorfälle-nis2\">§ 24\nInformationssicherheit, Sicherheitsvorfälle, NIS2</h2>\n<p>(1) Der Anbieter trifft die technischen und organisatorischen\nMaßnahmen nach Anlage 2 des AVV und betreibt die Plattform in einem nach\nISO/IEC 27001 zertifizierten Rechenzentrum in Deutschland.</p>\n<p>(2) Der Anbieter informiert den Kunden unverzüglich, spätestens\ninnerhalb von [24] Stunden nach Kenntnis, über Sicherheitsvorfälle, die\ndie Daten oder die Verfügbarkeit des Mandanten erheblich\nbeeinträchtigen. Meldungen von Verletzungen des Schutzes\npersonenbezogener Daten richten sich nach dem AVV.</p>\n<p>(3) Ist der Kunde eine wichtige oder besonders wichtige Einrichtung\nim Sinne des BSI-Gesetzes, unterstützt der Anbieter ihn in angemessenem\nUmfang bei der Erfüllung seiner Pflichten zur Sicherheit in der\nLieferkette, insbesondere durch Auskünfte zu Sicherheitsmaßnahmen,\nNachweise (z. B. Zertifikate des Rechenzentrums) und die Beantwortung\neines Sicherheitsfragebogens einmal je Vertragsjahr ohne zusätzliche\nVergütung. Darüber hinausgehenden Aufwand vergütet der Kunde nach\nAufwand.</p>\n<p>(4) Hinweise auf Sicherheitslücken nimmt der Anbieter unter\n[Sicherheits-E-Mail] entgegen (security.txt unter\n[Website-URL]/.well-known/security.txt).</p>\n<p>(5) Sicherheitstests des Kunden (z. B. Penetrationstests) sind nur\nnach vorheriger Abstimmung in Textform zulässig.</p>\n<blockquote>\n<p><strong>Prüfhinweis:</strong> Das NIS2UmsuCG gilt seit 06.12.2025\nohne Übergangsfristen. Erfasst sind Einrichtungen der Anlagen 1 und 2\ndes BSIG ab 50 Beschäftigten oder mehr als 10 Mio. € Jahresumsatz und\nJahresbilanzsumme. Anbieter von Cloud-Computing-Diensten unterliegen\nnach der Systematik der NIS2-Richtlinie den Größenschwellen; ein kleiner\nAnbieter ist danach nicht erfasst (Einordnung als\n„Cloud-Computing-Dienst“ prüfen, BSI-Betroffenheitsprüfung durchführen).\nSpeditionen und Frachtführer sind in den Anlagen nicht genannt;\nKurierdienste als Anbieter von Postdienstleistungen (Anlage 2) können\nerfasst sein und verlangen Lieferkettenklauseln (§ 30 BSIG).</p>\n</blockquote>\n<h2 id=\"-25-referenznennung\">§ 25 Referenznennung</h2>\n<p>(1) Der Anbieter darf den Kunden mit Firma und Logo als\nReferenzkunden auf seiner Website, in Präsentationen und\nVertriebsunterlagen nennen. Inhalte der Kundendaten und\nVertragskonditionen werden dabei nicht offengelegt.</p>\n<p>(2) Der Kunde kann der Referenznennung jederzeit ohne Angabe von\nGründen in Textform oder über die Einstellungen der Plattform\nwidersprechen. Der Anbieter entfernt die Nennung dann innerhalb von [30]\nTagen aus Online-Medien und verwendet sie in neuen Unterlagen nicht\nmehr.</p>\n<p>(3) Fallstudien, Zitate und Abbildungen von Mitarbeitern des Kunden\nverwendet der Anbieter nur mit gesonderter Zustimmung.</p>\n<h2 id=\"-26-höhere-gewalt\">§ 26 Höhere Gewalt</h2>\n<p>Keine Partei haftet für die Nichterfüllung von Pflichten, soweit\ndiese auf Umständen beruht, die außerhalb ihres zumutbaren\nEinflussbereichs liegen, insbesondere Naturkatastrophen, Pandemien,\nKrieg, Terror, behördliche Anordnungen, flächendeckende Ausfälle von\nStrom- oder Telekommunikationsnetzen oder Arbeitskampfmaßnahmen in\nDrittbetrieben. Die betroffene Partei informiert die andere\nunverzüglich. Dauert die Behinderung länger als [30] Tage, kann jede\nPartei den Vertrag außerordentlich kündigen.</p>\n<h2 id=\"-27-änderungen-dieser-agb\">§ 27 Änderungen dieser AGB</h2>\n<p>(1) Der Anbieter kann diese AGB mit Wirkung für die Zukunft ändern,\nwenn hierfür ein triftiger Grund besteht, insbesondere eine Änderung der\nRechtslage oder Rechtsprechung, neue Funktionen oder\nSicherheitsanforderungen, und der Kunde dadurch nicht unangemessen\nbenachteiligt wird. Leistungsumfang und Preise werden nicht nach dieser\nBestimmung geändert; für Preise gilt § 15.</p>\n<p>(2) Der Anbieter teilt dem Kunden Änderungen mindestens [6] Wochen\nvor ihrem Wirksamwerden in Textform mit und hebt die Änderungen hervor.\nWiderspricht der Kunde nicht innerhalb dieser Frist in Textform, gelten\ndie Änderungen als angenommen. Der Anbieter weist in der Mitteilung auf\ndie Frist und die Folgen eines unterlassenen Widerspruchs hin.\nWiderspricht der Kunde, gilt der Vertrag zu den bisherigen Bedingungen\nfort; jede Partei kann ihn dann außerordentlich zum Zeitpunkt des\ngeplanten Wirksamwerdens kündigen.</p>\n<blockquote>\n<p><strong>Prüfhinweis:</strong> Der BGH hat Zustimmungsfiktionsklauseln\ngegenüber Verbrauchern für unwirksam erklärt, soweit sie ohne\nBeschränkung auf bestimmte Inhalte gelten (BGH, Urt. v. 27.04.2021 – XI\nZR 26/20). Die Übertragbarkeit auf B2B ist offen; die Klausel ist daher\nauf Änderungen außerhalb der Hauptleistungspflichten beschränkt.</p>\n</blockquote>\n<h2 id=\"-28-schlussbestimmungen\">§ 28 Schlussbestimmungen</h2>\n<p>(1) Es gilt das Recht der Bundesrepublik Deutschland unter Ausschluss\ndes UN-Kaufrechts (CISG).</p>\n<p>(2) Ist der Kunde Kaufmann, juristische Person des öffentlichen\nRechts oder öffentlich-rechtliches Sondervermögen, ist ausschließlicher\nGerichtsstand für alle Streitigkeiten aus diesem Vertrag [Sitz des\nAnbieters/Ort des Gerichtsstands]. Der Anbieter ist berechtigt, den\nKunden auch an dessen allgemeinem Gerichtsstand zu verklagen.</p>\n<p>(3) Erklärungen nach diesem Vertrag bedürfen der Textform, soweit\nnicht ausdrücklich etwas anderes bestimmt ist.</p>\n<p>(4) Der Kunde kann Rechte aus diesem Vertrag nur mit Zustimmung des\nAnbieters abtreten. § 354a HGB bleibt unberührt.</p>\n<p>(5) Sollte eine Bestimmung dieses Vertrags unwirksam sein oder\nwerden, bleibt die Wirksamkeit der übrigen Bestimmungen unberührt.\nAnstelle der unwirksamen Bestimmung gelten die gesetzlichen\nVorschriften.</p>\n<p>(6) Maßgeblich ist die deutsche Fassung dieser AGB. Übersetzungen\ndienen nur der Information.</p>\n<p>(7) Der Anbieter ist nicht bereit und nicht verpflichtet, an\nStreitbeilegungsverfahren vor einer Verbraucherschlichtungsstelle\nteilzunehmen; der Vertrag richtet sich ausschließlich an\nUnternehmer.</p>\n<hr />\n<h2 id=\"anlage-a--exportierbare-und-nicht-exportierbare-daten\">Anlage A\n– Exportierbare und nicht exportierbare Daten</h2>\n<p>Abschließende Aufzählung nach Art. 25 Abs. 2 lit. e und f Data\nAct.</p>\n<h3 id=\"a1-exportierbare-daten-und-digitale-vermögenswerte\">A.1\nExportierbare Daten und digitale Vermögenswerte</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Kategorie</th>\n<th>Inhalt</th>\n<th>Format</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mandant</td>\n<td>Firmenname, Anschrift, Firmencode, Buchungsnummern-Präfix,\nEinstellungen (z. B. Fotopflicht, Unterschrift, Ankunftserfassung,\nPalettentausch, Fahrsperre, Standort beim Statuswechsel,\nLöschfristen)</td>\n<td>JSON</td>\n</tr>\n<tr class=\"even\">\n<td>Branding</td>\n<td>Logo, Markenfarbe, App-Name, Domain-Einstellungen</td>\n<td>JSON, Originaldatei</td>\n</tr>\n<tr class=\"odd\">\n<td>Nutzer</td>\n<td>Name, Rolle, E-Mail bzw. Handynummer, Sprache, Status,\nFührerscheinklasse, zugeordnetes Fahrzeug</td>\n<td>JSON, CSV</td>\n</tr>\n<tr class=\"even\">\n<td>Fahrzeuge</td>\n<td>Kennzeichen, Art, Nutzlast, Stellplätze, Ausstattung,\nHU-/SP-Termine, Status, Notizen</td>\n<td>JSON, CSV</td>\n</tr>\n<tr class=\"odd\">\n<td>Lieferungen</td>\n<td>Buchungsnummer, Auftraggeber, Referenz, Lade- und Entladestellen mit\nAdressen, Zeitfenstern und Ansprechpartnern, Ware, Paletten, Gewicht,\nGefahrgut, Temperatur, Hinweise, Zuweisung, Status</td>\n<td>JSON, CSV</td>\n</tr>\n<tr class=\"even\">\n<td>Verlauf</td>\n<td>Ereignisse mit
