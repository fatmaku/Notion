rt\ndie Plattform den Mandanten automatisch (Anzeige „Abgelaufen“); es\ngelten die Wirkungen des Status „Gesperrt“ (§ 14 Abs. 3). Der Admin kann\ndann für weitere 30 Tage alle Daten lesen und exportieren (§ 17 Abs. 1).\nDanach setzt der Anbieter den Status „Gekündigt“ und löscht den\nMandanten einschließlich aller Kundendaten nach § 18 Abs. 2. Bucht der\nKunde einen Tarif, bleiben die in der Testphase erfassten Daten\nerhalten.</p>\n<p>(4) Während der Testphase gelten keine Verfügbarkeitszusagen und\nkeine Gutschriften nach dem SLA. Der Anbieter haftet während der\nTestphase – außer bei Verletzung von Leben, Körper oder Gesundheit, nach\ndem Produkthaftungsgesetz, bei arglistig verschwiegenen Mängeln und bei\nÜbernahme einer Garantie – nur für Vorsatz und grobe Fahrlässigkeit.</p>\n<p>(5) Werden in der Testphase personenbezogene Daten verarbeitet, gilt\nder AVV ab Beginn der Testphase.</p>\n<p>(6) Der Anbieter kann die Testphase vorzeitig beenden, wenn konkrete\nAnhaltspunkte für eine Nutzung entgegen § 10 bestehen.</p>\n<blockquote>\n<p><strong>Prüfhinweis:</strong> Für zeitlich begrenzte Testversionen\ngelten nach Art. 31 Abs. 2 Data Act die Wechselpflichten des Kapitels VI\nnicht. Der Datenexport wird trotzdem angeboten, weil Testkunden\nregelmäßig Echtdaten erfassen. Die Haftungsmilderung in Abs. 4 lehnt\nsich an die Leihe (§§ 599, 600 BGB) an; zu prüfen ist, ob sie bei einer\nunentgeltlichen SaaS-Überlassung im B2B-Verkehr AGB-fest ist.</p>\n</blockquote>\n<h2 id=\"-5-vertragsgegenstand-und-leistungsumfang\">§ 5\nVertragsgegenstand und Leistungsumfang</h2>\n<p>(1) Der Anbieter stellt dem Kunden die Plattform für die\nVertragslaufzeit als Software-as-a-Service über das Internet zur Nutzung\nbereit. Der Anbieter betreibt die Plattform in Rechenzentren in\nDeutschland. Übergabepunkt ist der Routerausgang des vom Anbieter\ngenutzten Rechenzentrums. Die Internetverbindung des Kunden und seiner\nNutzer, Mobilfunkverbindungen, Endgeräte und Browser sind nicht\nGegenstand der Leistung des Anbieters.</p>\n<p>(2) Der Funktionsumfang je Rolle, die technischen Voraussetzungen,\ndie Verfügbarkeit, die Datensicherung, die Speicherkontingente und der\nSupport ergeben sich aus der Leistungsbeschreibung/SLA.</p>\n<p>(3) Die Tarife umfassen insbesondere:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Leistung</th>\n<th>Start</th>\n<th>Flotte</th>\n<th>Premium</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Grundpreis je Monat (netto)</td>\n<td>49 €</td>\n<td>129 €</td>\n<td>299 €</td>\n</tr>\n<tr class=\"even\">\n<td>Fahrer inklusive</td>\n<td>3</td>\n<td>15</td>\n<td>40</td>\n</tr>\n<tr class=\"odd\">\n<td>jeder weitere Fahrer je Monat (netto)</td>\n<td>nicht buchbar (Tarifwechsel)</td>\n<td>7 €</td>\n<td>6 €</td>\n</tr>\n<tr class=\"even\">\n<td>Fahrzeuge (LKW und Auflieger)</td>\n<td>6</td>\n<td>40</td>\n<td>unbegrenzt</td>\n</tr>\n<tr class=\"odd\">\n<td>Disponenten-Zugänge</td>\n<td>1</td>\n<td>5</td>\n<td>unbegrenzt</td>\n</tr>\n<tr class=\"even\">\n<td>eigenes Logo, Farben, App-Name</td>\n<td>ja</td>\n<td>ja</td>\n<td>ja</td>\n</tr>\n<tr class=\"odd\">\n<td>Lieferungen, Push-Benachrichtigungen, 8 Sprachen,\nOffline-Funktion</td>\n<td>ja, unbegrenzt</td>\n<td>ja, unbegrenzt</td>\n<td>ja, unbegrenzt</td>\n</tr>\n<tr class=\"even\">\n<td>Lieferschein-Speicher</td>\n<td>5 GB</td>\n<td>50 GB</td>\n<td>250 GB</td>\n</tr>\n<tr class=\"odd\">\n<td>Berichte und CSV-Export</td>\n<td>ja</td>\n<td>ja</td>\n<td>ja</td>\n</tr>\n<tr class=\"even\">\n<td>eigene Subdomain / eigene Domain</td>\n<td>–</td>\n<td>Subdomain</td>\n<td>eigene Domain</td>\n</tr>\n<tr class=\"odd\">\n<td>REST-API, Prioritäts-Support</td>\n<td>–</td>\n<td>–</td>\n<td>ja</td>\n</tr>\n<tr class=\"even\">\n<td>Verfügbarkeit im Monatsmittel (SLA)</td>\n<td>99,0 %</td>\n<td>99,0 %</td>\n<td>99,5 %</td>\n</tr>\n<tr class=\"odd\">\n<td>White-Label-App im App Store / Google Play</td>\n<td>–</td>\n<td>–</td>\n<td>Zusatz (§ 6 Abs. 3)</td>\n</tr>\n</tbody>\n</table>\n<p>Der vollständige Datenexport nach § 17 steht in allen Tarifen zur\nVerfügung.</p>\n<p>(4) Die Plattform prüft die Grenzen des gebuchten Tarifs\n(Fahrerplätze, Fahrzeuge, Büro-Zugänge, Speicher), nimmt darüber hinaus\nkeine weiteren aktiven Zugänge, Fahrzeuge oder Dateien an und weist auf\neinen möglichen Tarifwechsel hin; die Regeln zum Speicher enthält die\nLeistungsbeschreibung/SLA (Teil A Ziffer 4). Den Wechsel in einen\nanderen Tarif kann der Admin in der Plattform anfragen (Einstellungen →\nLizenz → „Tarif wechseln anfragen“); der Anbieter führt ihn aus. Ein\nWechsel in einen höheren Tarif ist jederzeit mit sofortiger Wirkung\nmöglich und wird zeitanteilig abgerechnet. Ein Wechsel in einen\nniedrigeren Tarif wird zum Ende des laufenden Abrechnungszeitraums\nwirksam, wenn die Nutzung zu diesem Zeitpunkt innerhalb der Grenzen des\nniedrigeren Tarifs liegt; die Plattform zeigt dem Anbieter vor dem\nWechsel an, wo die Nutzung darüber liegt. Wird der Wechsel dennoch\nvereinbart, kann der Kunde bis zur Bereinigung keine weiteren Zugänge\noder Fahrzeuge anlegen. Eigene Domains entfallen mit dem Wechsel in\neinen Tarif ohne eigene Domain, die Subdomain mit Firmen-Marke mit dem\nWechsel in den Tarif Start.</p>\n<p>(5) Nicht geschuldet sind, soweit nicht ausdrücklich gesondert\nvereinbart:</p>\n<ol type=\"1\">\n<li>Rechts-, Steuer- oder Datenschutzberatung;</li>\n<li>eine revisionssichere Archivierung im Sinne der GoBD; die Plattform\nist kein zertifiziertes Archivsystem (§ 9 Abs. 7);</li>\n<li>eine bestimmte Beweiskraft von Abliefernachweisen, Fotos oder\nUnterschriften sowie die Erfüllung gesetzlicher Formerfordernisse,\ninsbesondere eines Frachtbriefs nach § 408 HGB oder eines Frachtbriefs\nnach CMR; die Unterschrift auf dem Display ist eine einfache\nelektronische Signatur und keine qualifizierte elektronische Signatur im\nSinne des § 126a BGB;</li>\n<li>ein elektronischer Frachtbrief nach dem Zusatzprotokoll zur CMR\n(eCMR); eine eCMR-Schnittstelle ist Gegenstand der Produktplanung;</li>\n<li>eine fortlaufende Ortung von Fahrzeugen oder Personen (Telematik),\neine Arbeitszeiterfassung oder eine Lenk- und Ruhezeitenkontrolle;</li>\n<li>Leistungen Dritter, insbesondere der Push-Dienste der Browser- und\nBetriebssystemhersteller, der App-Stores, der Mobilfunknetze und der\nNavigationsdienste (Google Maps, Apple Karten), die die Plattform\nlediglich aufruft.</li>\n</ol>\n<h2 id=\"-6-zusatzleistungen-und-white-label-app\">§ 6 Zusatzleistungen\nund White-Label-App</h2>\n<p>(1) <strong>Zusatzfahrer.</strong> In den Tarifen Flotte und Premium\nkann der Kunde über die inklusiven Fahrer hinaus zusätzliche\nFahrerplätze buchen; der Anbieter schaltet sie frei. Abgerechnet wird je\nAbrechnungsmonat die Zahl der gebuchten Zusatzplätze, unabhängig davon,\nwie viele davon belegt sind. Mehr aktive Fahrerzugänge, als Plätze\nvorhanden sind, lässt die Plattform nicht zu; gesperrte und gelöschte\nFahrerzugänge belegen keinen Platz. Im Tarif Start sind Zusatzfahrer\nnicht buchbar.</p>\n<p>(2) <strong>Zusatzspeicher.</strong> [Der Kunde kann zusätzlichen\nSpeicher zu [Preis] € netto je angefangene [10] GB und Monat buchen.]\nDie Regeln bei Erreichen des Speicherkontingents ergeben sich aus der\nLeistungsbeschreibung/SLA.</p>\n<blockquote>\n<p><strong>Prüfhinweis (Technik):</strong> Die Plattform kennt derzeit\nkeinen Zusatzspeicher: Das Kontingent ergibt sich fest aus dem Tarif\n(<code>PLANS[…].storageGB</code> in <code>core/engine.js</code>), und\nder Anbieter kann es in der Konsole nicht erhöhen. Mehr Speicher gibt es\nnur über einen Tarifwechsel. Den ersten Satz von Abs. 2 bis zur\nUmsetzung streichen.</p>\n</blockquote>\n<p>(3) <strong>White-Label-App (nur im Tarif Premium).</strong></p>\n<ol type=\"1\">\n<li>Der Anbieter erstellt auf Grundlage der Plattform eine native App\nfür iOS und Android mit Namen, Icon, Startbildschirm und Farben des\nKunden, bereitet die Einreichung in den App-Stores vor, unterstützt die\nErsteinreichung und pflegt die App während der Vertragslaufzeit\n(Anpassung an neue Betriebssystemversionen und Store-Vorgaben,\nSicherheitsaktualisierungen, erneute Einreichung).</li>\n<li>Die Vergütung beträgt einmalig 1.990 € netto für die Erstellung und\n99 € netto je Monat für Betrieb und Pflege. Die Einmalvergütung ist mit\nBereitstellung des ersten einreichungsfähigen App-Builds fällig, die\nMonatsvergütung ab dem Folgemonat.</li>\n<li>Die App wird im eigenen Entwicklerkonto des Kunden veröffentlicht\n(Apple Developer Program und Google Play Console, jeweils als\nOrganisation). Der Kunde schließt die hierfür erforderlichen Verträge\nmit Apple und Google selbst, trägt deren Gebühren, beschafft die\nerforderliche D-U-N-S-Nummer und räumt dem Anbieter die für Erstellung\nund Pflege erforderlichen technischen Rollen ein. Der Kunde stellt\nStore-Texte, Bildmaterial, Impressum, Datenschutzerklärung und die\nAngaben für Datenschutz-Labels bereit; der Anbieter liefert die\ntechnischen Angaben hierzu.</li>\n<li>Die Zulassung durch Apple oder Google ist nicht geschuldet. Der\nAnbieter schuldet die fachgerechte Erstellung und Einreichung nach den\nzum Zeitpunkt der Einreichung veröffentlichten Store-Richtlinien. Lehnt\nein Store die App aus Gründen ab, die im Verantwortungsbereich des\nAnbieters liegen, und gelingt die Zulassung nicht innerhalb von [60]\nTagen nach der Ablehnung, kann der Kunde von dieser Zusatzleistung\nzurücktreten; der Anbieter erstattet die Einmalvergütung. Ablehnungen\naus Gründen in der Sphäre des Kunden (z. B. Marken- oder Kontoprobleme,\nfehlende Angaben) berechtigen nicht zum Rücktritt.</li>\n<li>Die White-Label-App endet mit dem Vertrag über den Tarif Premium.\nMit Vertragsende stellt der Anbieter die Pflege und die Anbindung an die\nPlattform ein. Der Kunde entfernt die App innerhalb von [30] Tagen aus\nden Stores.</li>\n<li>Da die App unter dem Namen oder der Marke des Kunden vertrieben\nwird, kann der Kunde als Hersteller im Sinne der Verordnung (EU)\n2024/2847 (Cyber Resilience Act) und des Produkthaftungsrechts gelten.\nDer Anbieter wirkt als technischer Entwickler mit: Er betreibt ein\nVerfahren zur Behandlung von Schwachstellen, stellt\nSicherheitsaktualisierungen bereit, übergibt auf Anforderung eine\nSoftware-Stückliste (SBOM) und die technischen Unterlagen, die der Kunde\nfür seine Pflichten benötigt, und informiert den Kunden über aktiv\nausgenutzte Schwachstellen und schwerwiegende Sicherheitsvorfälle, die\ndie App betreffen, unverzüglich, spätestens innerhalb von [12] Stunden\nnach Kenntnis, damit der Kunde etwaige Meldefristen einhalten kann.</li>\n</ol>\n<blockquote>\n<p><strong>Prüfhinweis:</strong> Nach Ziffer 4.2.6 der App Review\nGuidelines von Apple werden Apps aus kommerziellen Vorlagen oder\nApp-Generatoren abgelehnt, wenn sie nicht direkt vom Anbieter der\nApp-Inhalte eingereicht werden. Deshalb ist die Veröffentlichung im\nKonto des Kunden vorgesehen. Hersteller im Sinne des Art. 3 Nr. 13 CRA\nist, wer ein Produkt mit digitalen Elementen entwickeln lässt und unter\neigenem Namen oder eigener Marke vertreibt. Die Meldepflichten nach Art.\n14 CRA gelten seit 11.09.2026 (Frühwarnung binnen 24 Stunden), die\nübrigen Pflichten ab 11.12.2027. Zu prüfen sind (a) die Rollenverteilung\nHersteller/Zulieferer, (b) ob der Anbieter alternativ selbst als\nHersteller auftreten soll, (c) ein Regress im Innenverhältnis zum neuen\nProdukthaftungsrecht (Quasi-Hersteller).</p>\n</blockquote>\n<p>(4) <strong>Individuelle Leistungen</strong> wie Datenübernahme aus\nAltsystemen, Schulungen vor Ort oder kundenspezifische Anpassungen\nerbringt der Anbieter nur auf Grundlage eines gesonderten Angebots, im\nZweifel zu einem Tagessatz von [Betrag] € netto.</p>\n<h2 id=\"-7-nutzungsrechte\">§ 7 Nutzungsrechte</h2>\n<p>(1) Der Anbieter räumt dem Kunden für die Vertragslaufzeit das\neinfache, nicht übertragbare und nicht unterlizenzierbare Recht ein, die\nPlattform im Rahmen des gebuchten Tarifs durch seine Nutzer\nbestimmungsgemäß für eigene Geschäftszwecke zu nutzen. Fahrer von\nSubunternehmern dürfen die Plattform nutzen, soweit sie Lieferungen für\nden Kunden durchführen.</p>\n<p>(2) Der Kunde ist nicht berechtigt, die Plattform zu vervielfältigen,\nzu bearbeiten, zu vermieten, Dritten zur Nutzung zu überlassen, sie in\nfremde Angebote einzubetten (Framing), automatisiert auszulesen (außer\nüber die REST-API) oder für die Entwicklung eines Konkurrenzprodukts zu\nverwenden. § 69d und § 69e UrhG bleiben unberührt.</p>\n<p>(3) API-Schlüssel (Tarif Premium) sind geheim zu halten. Es gelten\ndie in der Leistungsbeschreibung genannten Nutzungsgrenzen.</p>\n<p>(4) Die Rechte an den Kundendaten verbleiben beim Kunden. Der Kunde\nräumt dem Anbieter die Rechte ein, die zur Erbringung der Leistungen\nerforderlich sind (Speichern, Verarbeiten, Darstellen, Umformatieren,\nSichern), beschränkt auf den Vertragszweck und die Vertragslaufzeit\neinschließlich des Abrufzeitraums.</p>\n<p>(5) Der Anbieter darf aggregierte Nutzungskennzahlen je Mandant ohne\nPersonenbezug und ohne Inhalte der Auftragsdaten (z. B. Anzahl der\nFahrer, Büro-Zugänge, Fahrzeuge und Lieferungen, Zeitpunkt der letzten\nAktivität) für Abrechnung, Kapazitätsplanung und Produktverbesserung\nverwenden.</p>\n<p>(6) Alle Rechte an der Plattform, insbesondere am Quellcode, an der\nDokumentation und an den Marken des Anbieters, verbleiben beim\nAnbieter.</p>\n<h2 id=\"-8-branding-rechte-an-logo-und-marke-freistellung\">§ 8 Branding,\nRechte an Logo und Marke, Freistellung</h2>\n<p>(1) Der Kunde kann in der Plattform Logo, Markenfarbe und App-Namen\nhinterlegen sowie – je nach Tarif – eine Subdomain oder eigene Domain\nnutzen. Das Branding erscheint insbesondere in der App, auf der\nAnmeldeseite, im Symbol auf dem Startbildschirm, in\nPush-Benachrichtigungen, im Abliefernachweis und in der\nWhite-Label-App.</p>\n<p>(2) Der Kunde gewährleistet, dass er über alle Rechte an den von ihm\nbereitgestellten Kennzeichen, Logos, Bildern, Texten und Domains\nverfügt, insbesondere Marken-, Urheber-, Namens- und\nPersönlichkeitsrechte, und dass deren Nutzung im Rahmen dieses Vertrags\nkeine Rechte Dritter und keine gesetzlichen Vorschriften verletzt.</p>\n<p>(3) Der Kunde räumt dem Anbieter für die Vertragslaufzeit\nunentgeltlich das einfache, nicht übertragbare Recht ein, diese Inhalte\nzu vervielfältigen, in Größe und Format anzupassen und öffentlich\nzugänglich zu machen, soweit dies für die Erbringung der Leistungen\nerforderlich ist, einschließlich der White-Label-App und – vorbehaltlich\neines Widerspruchs nach § 25 – der Referenznennung.</p>\n<p>(4) Der Kunde stellt den Anbieter von allen Ansprüchen Dritter frei,\ndie diese wegen einer Verletzung ihrer Rechte durch die vom Kunden\nbereitgestellten Inhalte gegen den Anbieter geltend machen, soweit der\nKunde die Rechtsverletzung zu vertreten hat. Die Freistellung umfasst\ndie angemessenen Kosten der Rechtsverteidigung in Höhe der gesetzlichen\nGebühren. Der Anbieter informiert den Kunden unverzüglich über die\nInanspruchnahme, erkennt Ansprüche nicht ohne Zustimmung des Kunden an\nund überlässt ihm, soweit rechtlich möglich, die Verteidigung.</p>\n<p>(5) Der Anbieter darf Inhalte vorläufig ausblenden, wenn sie\noffensichtlich rechtswidrig sind oder ihm eine hinreichend begründete\nMeldung eines Dritten vorliegt. Er informiert den Kunden unverzüglich\nunter Angabe der Gründe und gibt ihm Gelegenheit zur Stellungnahme.</p>\n<p>(6) Der Anbieter darf im Informations- bzw. Impressumsbereich der App\neinen unauffälligen Hinweis auf sich als technischen Anbieter aufnehmen\n(„bereitgestellt mit LADEKLAR“). Auf den Arbeitsoberflächen der Nutzer\nerscheint kein Hinweis auf den Anbieter.</p>\n<p>(7) Bei Nutzung einer eigenen Domain ist der Kunde für deren\nRegistrierung und die DNS-Einträge verantwortlich. Der Anbieter stellt\ndas TLS-Zertifikat automatisch bereit.</p>\n<blockquote>\n<p><strong>Prüfhinweis:</strong> Die Plattform speichert Inhalte, die\nNutzer bereitstellen. Sie dürfte daher ein Hostingdienst im Sinne des\nDigital Services Act (VO (EU) 2022/2065) sein. Pflichten nach Art. 11,\n12 (Kontaktstellen), Art. 14 (Angaben zu Inhaltsbeschränkungen in den\nAGB), Art. 16 (Melde- und Abhilfeverfahren) und Art. 17 (Begründung)\ngelten unabhängig von der Unternehmensgröße. Abs. 5 und § 10 sind als\nBeschränkungshinweis im Sinne des Art. 14 DSA gedacht; Meldeweg:\n[E-Mail/Formular].</p>\n</blockquote>\n<h2 id=\"-9-pflichten-und-obliegenheiten-des-kunden\">§ 9 Pflichten und\nObliegenheiten des Kunden</h2>\n<p>(1) <strong>Zugangsdaten.</strong> Der Kunde hält Passwörter, PINs,\nEinladungslinks und API-Schlüssel geheim und sorgt dafür, dass seine\nNutzer dies ebenfalls tun. Admin- und Disponentenzugänge sind\npersonengebunden. Bei Verdacht auf Missbrauch informiert der Kunde den\nAnbieter unverzüglich und setzt betroffene Zugänge zurück. Zugänge\nausscheidender Nutzer deaktiviert der Kunde unverzüglich. Der Anbieter\nempfiehlt, für Admin- und Disponentenzugänge die Zwei-Faktor-Anmeldung\nder Plattform einzuschalten.</p>\n<p>(2) <strong>Verantwortung für Nutzer.</strong> Der Kunde ist für die\nHandlungen seiner Nutzer im Mandanten wie für eigene Handlungen\nverantwortlich, soweit sie im Zusammenhang mit der Nutzung der Plattform\nstehen.</p>\n<p>(3) <strong>Unterweisung der Fahrer, Straßenverkehr.</strong> Der\nKunde unterweist jeden Fahrer vor der ersten Nutzung über die\nNutzungsbedingungen für Fahrer und dokumentiert dies. Er weist\ninsbesondere darauf hin, dass ein Mobiltelefon oder Tablet während der\nFahrt nur unter den Voraussetzungen des § 23 Abs. 1a StVO benutzt werden\ndarf, dass die Befreiung für stehende Fahrzeuge nach § 23 Abs. 1b StVO\nnur bei vollständig ausgeschaltetem Motor gilt und dass die Abschaltung\ndurch eine Start-Stopp-Automatik nicht genügt. Der Kunde gestaltet seine\nAbläufe so, dass Fahrer die App nur bei sicher abgestelltem Fahrzeug\nbedienen müssen. Die Fahrsperre der App ist ein Hilfsmittel: Sie wirkt\nnur bei erteilter Standortfreigabe, erst ab einer Geschwindigkeit von\netwa 8 km/h und nicht bei stehendem Fahrzeug mit laufendem Motor. Sie\nentbindet weder den Fahrer noch den Kunden von ihrer Verantwortung.</p>\n<p>(4) <strong>Datenschutz.</strong> Der Kunde ist für die Verarbeitung\nder Kundendaten Verantwortlicher im Sinne der DSGVO. Er stellt\ninsbesondere sicher, dass</p>\n<ol type=\"1\">\n<li>für die Verarbeitung der Daten seiner Fahrer, Disponenten,\nAuftraggeber, Empfänger und Ansprechpartner an Lade- und Entladestellen\neine Rechtsgrundlage besteht;</li>\n<li>die betroffenen Personen nach Art. 13 und 14 DSGVO informiert werden\n(Vorlage: Datenschutzhinweise für Fahrer einschließlich Kurzhinweis für\nEmpfänger);</li>\n<li>erforderliche Einwilligungen, insbesondere für die Standortabfrage\nbeim Statuswechsel und für den Zugriff auf den Gerätestandort durch die\nFahrsperre (in der Plattform voreingestellt eingeschaltet), wirksam\neingeholt werden;</li>\n<li>eine erforderliche Datenschutz-Folgenabschätzung durchgeführt\nwird.</li>\n</ol>\n<p>Die vom Kunden in der Plattform gewählten Einstellungen (z. B.\nStandort beim Statuswechsel, Ankunftserfassung, Fotopflicht,\nUnterschrift, Löschfristen) sind Weisungen im Sinne des AVV.</p>\n<p>(5) <strong>Betriebsrat.</strong> Besteht beim Kunden ein\nBetriebsrat, wahrt der Kunde dessen Beteiligungsrechte, insbesondere\nnach § 87 Abs. 1 Nr. 6 BetrVG, bevor er die Plattform mit Fahrern oder\nDisponenten produktiv nutzt. Die vom Anbieter bereitgestellte\nMuster-Betriebsvereinbarung ist eine unverbindliche Vorlage.</p>\n<p>(6) <strong>Inhalte.</strong> Der Kunde sorgt dafür, dass über die\nPlattform keine rechtswidrigen Inhalte verarbeitet werden. Fotos sollen\nnur Lieferdokumente, Ware, Ladung, Schäden und Fahrzeuge zeigen, keine\nPersonen. In Freitextfeldern sollen keine besonderen Kategorien\npersonenbezogener Daten im Sinne des Art. 9 DSGVO (z. B. Angaben zu\nVerletzungen nach einem Unfall) erfasst werden, soweit dies nicht im\nEinzelfall erforderlich ist.</p>\n<p>(7) <strong>Aufbewahrung und Archivierung.</strong> Der Kunde legt\nfest, wie lange abgeschlossene Lieferungen mit allen Dokumenten\naufbewahrt werden (1 bis 10 Jahre, Voreinstellung 3 Jahre, gerechnet ab\nder Zustellung bzw. Stornierung); danach löscht die Plattform sie\nautomatisch. Die übrigen Fristen sind in der Leistungsbeschreibung Teil\nA Ziffer 6 festgelegt. Der Kunde ist selbst dafür verantwortlich,\nhandels- und steuerrechtliche Aufbewahrungspflichten zu erfüllen,\ninsbesondere Unterlagen, die Buchungsbelege sind, nach den GoBD in\nseinen eigenen Systemen zu archivieren. Der Anbieter empfiehlt,\nAbliefernachweise und Dokumente regelmäßig zu exportieren.</p>\n<p>(8) <strong>Endgeräte.</strong> Der Kunde stellt sicher, dass die\nEndgeräte seiner Nutzer die technischen Voraussetzungen der\nLeistungsbeschreibung erfüllen, mit Bildschirmsperre geschützt und auf\naktuellem Stand sind. Ob Fahrer Dienstgeräte oder private Geräte nutzen,\nentscheidet der Kunde in eigener Verantwortung.</p>\n<p>(9) <strong>Mitwirkung bei Störungen.</strong> Der Kunde meldet\nStörungen über die Supportwege der Leistungsbeschreibung/SLA mit einer\nnachvollziehbaren Beschreibung.</p>\n<p>(10) <strong>Subunternehmer.</strong> Setzt der Kunde Fahrer von\nSubunternehmern ein, verpflichtet er diese vertraglich auf die\nNutzungsbedingungen für Fahrer und stellt deren Information nach Art. 13\nDSGVO sicher.</p>\n<h2 id=\"-10-unzulässige-nutzung-vorübergehende-beschränkung\">§ 10\nUnzulässige Nutzung, vorübergehende Beschränkung</h2>\n<p>(1) Unzulässig ist insbesondere,</p>\n<ol type=\"1\">\n<li>rechtswidrige Inhalte oder Schadsoftware hochzuladen;</li>\n<li>Sicherheitsmaßnahmen zu umgehen, Zugänge Dritter zu nutzen oder\nTarifgrenzen technisch zu umgehen;</li>\n<li>die Plattform übermäßig zu belasten oder Sicherheitstests ohne\nvorherige Zustimmung des Anbieters in Textform durchzuführen;</li>\n<li>die Plattform zu einer fortlaufenden Ortung oder Überwachung von\nPersonen zu verwenden, die über die vorgesehenen Funktionen\nhinausgeht.</li>\n</ol>\n<p>(2) Bestehen konkrete Anhaltspunkte für einen Verstoß gegen Abs. 1\noder droht eine Gefahr für die Sicherheit der Plattform oder anderer\nKunden (z. B. kompromittierter Zugang), kann der Anbieter einzelne\nZugänge oder Funktionen vorübergehend beschränken. Er wählt das mildeste\ngeeignete Mittel, informiert den Kunden unverzüglich, möglichst vorab,\nund hebt die Beschränkung auf, sobald der Grund entfallen ist. Hat der\nKunde den Grund zu vertreten, bleibt die Vergütungspflicht bestehen.</p>\n<h2 id=\"-11-verfügbarkeit-wartung-support\">§ 11 Verfügbarkeit, Wartung,\nSupport</h2>\n<p>(1) Der Anbieter stellt die Plattform mit einer Verfügbarkeit im\nMonatsmittel von 99,0 % in den Tarifen Start und Flotte und von 99,5 %\nim Tarif Premium bereit. Berechnung, Ausnahmen, Wartungsfenster und\nGutschriften regelt das SLA.</p>\n<p>(2) Der Anbieter führt geplante Wartungen grundsätzlich in den\nWartungsfenstern des SLA durch und kündigt sie vorher an.</p>\n<p>(3) Supportzeiten, Supportwege und Reaktionszeiten ergeben sich aus\ndem SLA. Der Prioritäts-Support ist Bestandteil des Tarifs Premium.</p>\n<h2 id=\"-12-weiterentwicklung-der-plattform\">§ 12 Weiterentwicklung der\nPlattform</h2>\n<p>(1) Der Anbieter entwickelt die Plattform fortlaufend weiter. Er darf\nFunktionen ändern, ersetzen oder einstellen, wenn dies (a) aus\nrechtlichen oder regulatorischen Gründen, zur Gewährleistung der\nSicherheit oder wegen Änderungen bei Dritten (z. B. Browser,\nBetriebssysteme, Push-Dienste, App-Stores) erforderlich ist oder (b) für\nden Kunden unter Berücksichtigung seiner Interessen zumutbar ist. Die\nKernfunktionen Lieferungen, Statusmeldungen, Dokumente und Fotos,\nBenachrichtigungen und Datenexport bleiben mindestens gleichwertig\nerhalten.</p>\n<p>(2) Wesentliche Änderungen, die sich für den Kunden nachteilig\nauswirken, kündigt der Anbieter mindestens [6] Wochen vor ihrem\nWirksamwerden in Textform an. Der Kunde kann den Vertrag in diesem Fall\naußerordentlich zum Zeitpunkt des Wirksamwerdens kündigen. Der Anbieter\nweist in der Ankündigung auf dieses Recht hin.</p>\n<p>(3) Als „Beta“ gekennzeichnete Funktionen sind freiwillige\nVorabversionen. Für sie gelten keine Verfügbarkeitszusagen.</p>\n<h2 id=\"-13-vergütung-abrechnung-zahlung\">§ 13 Vergütung, Abrechnung,\nZahlung</h2>\n<p>(1) Alle Preise verstehen sich in Euro zuzüglich der jeweils\ngesetzlichen Umsatzsteuer.</p>\n<p>(2) <strong>Monatliche Zahlweise.</strong> Der monatliche Preis aus\nGrundpreis des Tarifs, gebuchten Zusatzfahrern und gegebenenfalls dem\nBetrieb der White-Label-App ist für jeden Kalendermonat ab dem Monat des\nBeginns der kostenpflichtigen Nutzung im Voraus fällig. [Zusatzspeicher\nwird monatlich nachträglich abgerechnet.]</p>\n<p>(3) <strong>Jährliche Zahlweise.</strong> Bei jährlicher Zahlweise\nzahlt der Kunde für zwölf Monate den zehnfachen monatlichen Preis\neinschließlich gebuchter Zusatzfahrer und des Betriebs der\nWhite-Label-App im Voraus („2 Monate geschenkt“), erstmals im Monat des\nBeginns der kostenpflichtigen Nutzung und danach alle zwölf Monate.\n[Zusatzspeicher wird monatlich nachträglich abgerechnet.]</p>\n<blockquote>\n<p><strong>Prüfhinweis (Technik):</strong> Die Abrechnungsvorschau der\nLizenzgeber-Konsole (<code>billingRun</code>) rechnet aus der\nLizenz-Historie des Kunden (jede Änderung von Status, Tarif, Zahlweise,\nZusatzfahrern, Store-App und Laufzeitende mit Zeitpunkt). Bezahlt ist\neine Lizenz, solange sie aktiv ist, auch während einer Sperre nach\nvorheriger Zahlung (§ 14 Abs. 4), bis zum Laufzeitende; Testtage werden\nnie berechnet. Monatliche Zahler: jeder Kalendermonat mit mindestens\neinem bezahlten Tag, auch der Monat, in dem eine Kündigung wirksam wird;\nTarif und Zusätze wie am letzten bezahlten Tag des Monats (Berliner\nZeit). Jährliche Zahler: zehnfacher Monatspreis im ersten bezahlten\nMonat und danach alle zwölf Monate, nicht, wenn die Laufzeit vor dem\nVerlängerungstag endet; Änderungen im bezahlten Jahr gelten erst ab der\nVerlängerung. Wechsel monatlich → jährlich: im Wechselmonat beginnt ein\nneues Jahr ohne Monatsbeitrag; jährlich → monatlich: Monatsbeiträge erst\nnach dem bezahlten Jahr. Einrichtung der White-Label-App: 1.990 €\neinmalig im ersten bezahlten Monat mit App. Jede Zeile nennt ihren\nGrund, die CSV hat die Spalte „Grund“. Nicht abgebildet sind eine\nzeitanteilige Abrechnung von Tarifwechseln innerhalb eines Monats bzw.\neines Jahres, die Erstattung nach § 16 Abs. 3, Zusatzspeicher und\nindividuelle Leistungen; diese sind gesondert abzurechnen. Die Vorschau\nerzeugt keine Rechnungen.</p>\n</blockquote>\n<p>(4) Rechnungen werden elektronisch übermittelt. Der Kunde ist mit dem\nEmpfang elektronischer Rechnungen einverstanden. Soweit gesetzlich\nvorgeschrieben oder vom Kunden gewünscht, stellt der Anbieter Rechnungen\nin einem strukturierten elektronischen Format (z. B. XRechnung oder\nZUGFeRD) aus.</p>\n<p>(5) Rechnungsbeträge sind innerhalb von [14] Tagen nach Zugang der\nRechnung ohne Abzug fällig. Zahlungen erfolgen per Überweisung oder,\nfalls vereinbart, per SEPA-Lastschrift. Bei SEPA-Lastschrift wird die\nVorabankündigung (Pre-Notification) auf [einen] Tag vor Fälligkeit\nverkürzt. Kosten einer vom Kunden zu vertretenden Rücklastschrift trägt\nder Kunde.</p>\n<p>(6) Kunden mit Sitz in einem anderen Mitgliedstaat der EU teilen ihre\ngültige Umsatzsteuer-Identifikationsnummer mit. Liegt der Ort der\nLeistung im Ausland, rechnet der Anbieter ohne deutsche Umsatzsteuer ab;\ndie Steuer schuldet der Kunde als Leistungsempfänger.</p>\n<p>(7) Die Plattform ermittelt die abrechnungsrelevanten Kennzahlen\n(Tarif, Fahrerzahl, Speicher). Einwendungen gegen eine Rechnung erhebt\nder Kunde innerhalb von [6] Wochen nach Zugang in Textform. Unterlässt\ner dies, gilt die Rechnung als genehmigt; der Anbieter weist in jeder\nRechnung auf diese Folge hin. Gesetzliche Ansprüche des Kunden bei\nbegründeten Einwendungen nach Fristablauf bleiben unberührt.</p>\n<p>(8) Der Kunde kann nur mit unbestrittenen oder rechtskräftig\nfestgestellten Forderungen aufrechnen und ein Zurückbehaltungsrecht nur\nwegen Ansprüchen aus demselben Vertragsverhältnis ausüben. Dies gilt\nnicht für Gegenansprüche wegen Mängeln oder teilweiser Nichterfüllung\naus demselben Vertrag.</p>\n<h2 id=\"-14-zahlungsverzug-und-sperrung\">§ 14 Zahlungsverzug und\nSperrung</h2>\n<p>(1) Gerät der Kunde in Zahlungsverzug, schuldet er Verzugszinsen in\ngesetzlicher Höhe (§ 288 Abs. 2 BGB) und die Pauschale nach § 288 Abs. 5\nBGB. Weitergehende Ansprüche bleiben unberührt.</p>\n<p>(2) Ist der Kunde mit einem Betrag von mindestens einem monatlichen\nGrundpreis länger als [14] Tage nach Fälligkeit in Verzug, kann der\nAnbieter den Mandanten in den Status „Gesperrt“ versetzen. Voraussetzung\nist eine Mahnung in Textform, die die Sperrung ankündigt und eine\nZahlungsfrist von mindestens [10] Werktagen setzt.</p>\n<p>(3) Im Status „Gesperrt“ können sich Admins und Disponenten weiter\nanmelden und die Daten lesen; der Admin kann alle Daten vollständig\nexportieren, Personen löschen und Kündigungs- oder Tarifwünsche senden.\nNeue Lieferungen, Statusmeldungen, Uploads und sonstige Änderungen sind\nnicht möglich; die App zeigt einen entsprechenden Hinweis. Die REST-API\nist gesperrt. Angemeldete Fahrer werden abgemeldet und können sich nicht\nneu anmelden; die App zeigt ihnen „Zugang gesperrt – bitte die\nDisposition anrufen.“ Meldungen, die ein Fahrer ohne Netz gespeichert\nhat, bleiben auf seinem Gerät und werden erst gesendet, wenn er sich\nnach Aufhebung der Sperrung wieder anmeldet; liegt sein Tippen dann mehr\nals 72 Stunden zurück, speichert die Plattform den Zeitpunkt des\nEingangs. Der Kunde ist selbst dafür verantwortlich, laufende Touren in\ndiesem Fall auf andere Weise zu dokumentieren.</p>\n<p>(4) Der Anbieter hebt die Sperrung innerhalb von [einem] Werktag nach\nvollständigem Zahlungseingang auf. Die Vergütungspflicht besteht während\nder Sperrung fort.</p>\n<p>(5) Ist der Kunde für zwei aufeinanderfolgende Monate mit der\nVergütung oder einem nicht unerheblichen Teil davon oder über einen\nlängeren Zeitraum mit einem Betrag in Höhe von zwei monatlichen\nGrundpreisen in Verzug, kann der Anbieter den Vertrag außerordentlich\nkündigen. § 18 (Abrufzeitraum) bleibt unberührt.</p>\n<h2 id=\"-15-preisanpassung\">§ 15 Preisanpassung</h2>\n<p>(1) Der Anbieter kann die Vergütung nach billigem Ermessen (§ 315\nBGB) an die Entwicklung der Kosten anpassen, die für die Erbringung der\nLeistungen maßgeblich sind. Maßgeblich sind ausschließlich die Kosten\nfür Rechenzentrum und Hosting, Speicher und Datensicherung, Lizenzen und\nLeistungen Dritter, Energie sowie Personalkosten für Betrieb und\nSupport. Steigerungen einer Kostenart dürfen nur in dem Umfang\nberücksichtigt werden, in dem sie nicht durch Kostensenkungen in anderen\nBereichen ausgeglichen werden. Kostensenkungen gibt der Anbieter in\ngleicher Weise weiter. Eine Erhöhung des Gewinnanteils ist\nausgeschlossen.</p>\n<p>(2) Eine Anpassung ist frühestens zwölf Monate nach Vertragsbeginn\nund danach höchstens einmal in zwölf Monaten zulässig. Jede Erhöhung ist\nauf [5] % des bisherigen Entgelts begrenzt. Bei jährlicher Zahlweise\nwird eine Anpassung erst zu Beginn des nächsten Vertragsjahres\nwirksam.</p>\n<p>(3) Der Anbieter teilt dem Kunden die Anpassung mindestens [6] Wochen\nvor ihrem Wirksamwerden in Textform mit und erläutert die maßgeblichen\nKostenänderungen. Im Fall einer Erhöhung kann der Kunde den Vertrag\ninnerhalb von [4] Wochen nach Zugang der Mitteilung zum Zeitpunkt des\nWirksamwerdens kündigen. Der Anbieter weist in der Mitteilung auf dieses\nRecht hin.</p>\n<p>(4) Änderungen des gesetzlichen Umsatzsteuersatzes werden ab ihrem\nInkrafttreten berücksichtigt.</p>\n<blockquote>\n<p><strong>Prüfhinweis:</strong> Kostenelementeklauseln sind in\nDauerschuldverhältnissen nicht grundsätzlich unwirksam, müssen aber\ntransparent sein und Kostensenkungen gleichermaßen berücksichtigen (BGH,\nUrt. v. 15.11.2007 – III ZR 247/06). Ein Kündigungsrecht gleicht eine\nunangemessene Klausel nach der BGH-Linie nicht allein aus. Für B2B-SaaS\nfehlt eigene Rechtsprechung; die Maßstäbe aus dem Verbraucherbereich\nwerden herangezogen. Eine automatische Indexbindung wäre am\nPreisklauselgesetz zu messen. <strong>Einfachere Alternative:</strong>\nfeste Preise für die Erstlaufzeit; bei Jahresverträgen kann der Anbieter\nfür die Verlängerung neue Preise anbieten, die nur wirksam werden, wenn\nder Kunde nicht vor Beginn der Verlängerung kündigt.</p>\n</blockquote>\n<h2 id=\"-16-laufzeit-und-kündigung\">§ 16 Laufzeit und Kündigung</h2>\n<p>(1) <strong>Monatsvertrag.</strong> Bei monatlicher Zahlweise läuft\nder Vertrag auf unbestimmte Zeit. Der Kunde kann mit einer Frist von\n[14] Tagen zum Ende eines Abrechnungsmonats kündigen. Der Anbieter kann\nmit einer Frist von [drei] Monaten zum Ende eines Abrechnungsmonats\nkündigen.</p>\n<p>(2) <strong>Jahresvertrag.</strong> Bei jährlicher Zahlweise beträgt\ndie Laufzeit zwölf Monate. Sie verlängert sich jeweils um weitere zwölf\nMonate, wenn nicht eine Partei mit einer Frist von [einem] Monat (Kunde)\nbzw. [drei] Monaten (Anbieter) zum Ende der jeweiligen Laufzeit kündigt.\nDer Anbieter erinnert den Kunden spätestens [acht] Wochen vor Ablauf der\nKündigungsfrist in Textform an die bevorstehende Verlängerung und an die\nMöglichkeit, in die monatliche Zahlweise zu wechseln.</p>\n<p>(3) <strong>Anbieterwechsel.</strong> Unabhängig von Abs. 1 und 2\nkann der Kunde jederzeit nach § 17 einen Anbieterwechsel, eine\nÜbertragung in eigene IT-Infrastruktur oder die Löschung seiner Daten\nverlangen. Bei einem Jahresvertrag wird in diesem Fall die tatsächliche\nNutzungsdauer bis zum Vertragsende zum monatlichen Grundpreis\nabgerechnet. Übersteigt die Vorauszahlung diesen Betrag, erstattet der\nAnbieter die Differenz. Eine Nachforderung findet nicht statt. Weitere\nEntgelte für die vorzeitige Beendigung werden nicht erhoben.</p>\n<p>(4) Das Recht zur außerordentlichen Kündigung aus wichtigem Grund\nbleibt unberührt. Ein wichtiger Grund für den Kunden liegt insbesondere\nvor, wenn die vereinbarte Verfügbarkeit in zwei aufeinanderfolgenden\nMonaten oder in drei Monaten innerhalb von zwölf Monaten um mehr als\n[zwei] Prozentpunkte unterschritten wird. Ein wichtiger Grund für den\nAnbieter liegt insbesondere in den Fällen des § 14 Abs. 5 sowie bei\neinem schwerwiegenden Verstoß gegen § 10 vor, der trotz Abmahnung in\nTextform nicht abgestellt wird.</p>\n<p>(5) Kündigungen bedürfen der Textform. Der Admin kann den Vertrag\nauch in der Plattform kündigen (Einstellungen → Lizenz → „Kündigen“, mit\noptionalem Grund und einer Bestätigung auf derselben Seite). Die\nPlattform speichert Zeitpunkt und Grund, vermerkt die Kündigung im\nProtokoll des Kunden und benachrichtigt den Anbieter. Der Anbieter\nbestätigt dem Kunden den Zugang und das Vertragsende in Textform. Bis\ndahin läuft der Vertrag unverändert weiter.</p>\n<blockquote>\n<p><strong>Prüfhinweis:</strong> Ob die Erklärung in der Plattform die\nTextform (§ 126b BGB: Erklärung auf einem dauerhaften Datenträger)\nwahrt, ist zu prüfen; die Plattform sendet dem Kunden keine Kopie, die\nErklärung steht nur in der Datenbank und im Protokoll des Kunden\n(Eintrag <code>tenant.cancel_request</code>). Die Bestätigung des\nAnbieters in Textform, z. B. per E-Mail, schließt diese Lücke. Ein\nKündigungsbutton nach § 312k BGB ist im B2B-Verkehr nicht\nvorgeschrieben. Die Plattform bietet keinen eigenen Weg, eine gesendete\nKündigung zurückzunehmen; das geschieht in Textform beim Anbieter.</p>\n</blockquote>\n<p>(6) Nach Zugang einer Kündigung trägt der Anbieter das Vertragsende\nals Laufzeitende in der Plattform ein. Bis zum Vertragsende steht die\nPlattform unverändert zur Verfügung. Mit dem Vertragsende sperrt die\nPlattform den Mandanten automatisch (Anzeige „Abgelaufen“, Wirkungen wie\n§ 14 Abs. 3), und der Anbieter setzt den Status „Gekündigt“: Nur noch\nder Admin kann sich anmelden; er kann alle Daten lesen, exportieren (§\n17 Abs. 1) und Personen löschen, aber nichts mehr ändern. Disponenten\nund Fahrer können sich nicht mehr anmelden.</p>\n<blockquote>\n<p><strong>Prüfhinweis:</strong> Art. 25 Abs. 2 lit. d Data Act begrenzt\ndie Frist für die Einleitung des Wechselvorgangs auf höchstens zwei\nMonate. Ob dies auch ein Recht zur vorzeitigen Beendigung befristeter\nVerträge begründet, ist umstritten. Erwägungsgrund 89 lässt befristete\nVerträge mit verhältnismäßigen Entgelten für die vorzeitige Beendigung\nzu; was verhältnismäßig ist, ist offen. Abs. 3 wählt eine\nkundenfreundliche Lösung (Wegfall des Jahresrabatts, keine\nNachforderung), um nicht als Wechselhindernis (Art. 23) zu gelten. Der\nDigital Omnibus (Vorschlag der Kommission vom 19.11.2025) sieht hierzu\nKlarstellungen und Ausnahmen für KMU vor; er war am 16.10.2026 noch\nnicht verabschiedet.</p>\n</blockquote>\n<h2 id=\"-17-datenexport-und-anbieterwechsel-eu-data-act\">§ 17\nDatenexport und Anbieterwechsel (EU Data Act)</h2>\n<p>(1) <strong>Jederzeitiger Export.</strong> Der Admin kann jederzeit,\nauch im Status „Gesperrt“, „Abgelaufen“ oder „Gekündigt“, alle\nexportierbaren Daten (Anlage A) in strukturierten, gängigen und\nmaschinenlesbaren Formaten exportieren: als ZIP-Archiv („Alles als ZIP\n(mit Lieferscheinen)“) mit JSON (<code>daten.json</code>, vollständiger\nDatenbestand mit Metadaten), CSV (<code>lieferungen.csv</code>, alle\nLieferungen), allen gespeicherten Dateien (Fotos, PDF-Dokumente,\nUnterschriften, Logo) und einer Beschreibung\n(<code>LIESMICH.txt</code>); Archive über 4 GB im Format ZIP64; außerdem\neinzeln als JSON und als CSV. Berichte lassen sich je Monat als CSV\nherunterladen (die letzten 24 Monate). In CSV-Dateien sind Zellen, die\nmit einem Formelzeichen beginnen, durch ein vorangestelltes Apostroph\nentschärft. Jeder Export steht im Protokoll des Kunden. Im Tarif Premium\nsteht zusätzlich die REST-API für Lieferungen zur Verfügung. Die\nDatenformate und Datenstrukturen sind unter [Website-URL/export-formate]\ndokumentiert.</p>\n<p>(2) <strong>Wechselverlangen.</strong> Der Kunde kann in Textform\nverlangen,</p>\n<ol type=\"1\">\n<li>zu einem anderen Anbieter von Datenverarbeitungsdiensten zu\nwechseln,</li>\n<li>seine Daten in eine eigene IT-Infrastruktur zu übertragen oder</li>\n<li>seine exportierbaren Daten löschen zu lassen.</li>\n</ol>\n<p>Das Wechselverlangen kann mit einer Frist von höchstens zwei Monaten\nerklärt werden; der Kunde bestimmt den Zeitpunkt innerhalb dieser\nFrist.</p>\n<p>(3) <strong>Übergangszeitraum.</strong> Nach Ablauf der Frist nach\nAbs. 2 beginnt ein Übergangszeitraum von höchstens 30 Kalendertagen. In\ndieser Zeit erbringt der Anbieter die vertraglichen Leistungen\nunverändert weiter, unterstützt den Wechsel nach Treu und Glauben,\nstellt die erforderlichen Informationen bereit, arbeitet – soweit\nerforderlich – mit dem neuen Anbieter zusammen und wahrt ein hohes Maß\nan Sicherheit. Ist der Wechsel innerhalb von 30 Kalendertagen technisch\nnicht durchführbar, teilt der Anbieter dies dem Kunden innerhalb von 14\nWerktagen nach Zugang des Wechselverlangens mit, begründet dies und\nnennt einen alternativen Übergangszeitraum von höchstens sieben Monaten.\nDer Kunde kann den Übergangszeitraum einmal um einen von ihm für\nangemessen gehaltenen Zeitraum verlängern.</p>\n<p>(4) <strong>Datenabrufzeitraum.</strong> Nach Ablauf des\nÜbergangszeitraums kann der Kunde seine Daten noch mindestens 30\nKalendertage lesen und exportieren.</p>\n<p>(5) <strong>Vertragsende.</strong> Der Vertrag endet mit dem\nerfolgreichen Abschluss des Wechselvorgangs; der Anbieter bestätigt dies\nin Textform. Verlangt der Kunde nur die Löschung (Abs. 2 Nr. 3), endet\nder Vertrag mit Ablauf der Frist nach Abs. 2. Danach gilt § 18.</p>\n<p>(6) <strong>Kosten.</strong> Der Anbieter erhebt für den Wechsel, den\nDatenexport und die Unterstützung nach Abs. 3 keine Entgelte.\nLeistungen, die über die gesetzlich vorgeschriebene Unterstützung\nhinausgehen (z. B. die Umwandlung der Daten in das Format eines\nbestimmten Zielsystems), erbringt der Anbieter nur auf Grundlage einer\ngesonderten Vereinbarung und nur, soweit dies nach Art. 29 Data Act\nzulässig ist.</p>\n<p>(7) <strong>Informationen.</strong> Der Anbieter stellt unter\n[Website-URL/datenwechsel] Informationen über das Wechselverfahren, die\nverfügbaren Methoden und Formate, bekannte Einschränkungen und\ntechnische Grenzen, die Standorte der IT-Infrastruktur (ausschließlich\nDeutschland) sowie die Maßnahmen gegen unrechtmäßigen staatlichen\nZugriff aus Drittstaaten bereit.</p>\n<blockquote>\n<p><strong>Prüfhinweis:</strong> Die Plattform ist ein\nDatenverarbeitungsdienst im Sinne des Art. 2 Nr. 8 Data Act; die\nBundesnetzagentur ordnet SaaS ausdrücklich ein. Pflichtinhalte nach Art.\n25 Abs. 2: Wechselrecht und Unterstützung (lit. a), Übergangszeitraum 30\nTage mit Verlängerung (lit. a i. V. m. Abs. 4 und 5), Kündigung nach\nAbschluss (lit. c), höchstens zwei Monate Frist (lit. d), abschließende\nAufzählung exportierbarer Daten (lit. e) und ausgenommener Daten (lit.\nf), Abrufzeitraum mindestens 30 Tage (lit. g), vollständige Löschung\n(lit. h), Wechselentgelte (lit. i). Art. 29: Wechselentgelte ab\n12.01.2027 unzulässig; bis dahin höchstens kostendeckend.\nInformationspflichten: Art. 26 und Art. 28. Aufsichtsbehörde ist die\nBundesnetzagentur (Data-Act-Durchführungsgesetz, in Kraft seit\n30.05.2026).</p>\n</blockquote>\n<h2 id=\"-18-vertragsende-abrufzeitraum-und-löschung\">§ 18 Vertragsende,\nAbrufzeitraum und Löschung</h2>\n<p>(1) Nach Vertragsende kann der Admin die Daten noch 30 Kalendertage\nlesen und exportieren (Abrufzeitraum); der Mandant hat in dieser Zeit\nden Status „Gekündigt“ (§ 16 Abs. 6). Im Fall des § 17 tritt der\nDatenabrufzeitraum nach § 17 Abs. 4 an die Stelle dieses\nAbrufzeitraums.</p>\n<p>(2) Nach Ablauf des Abrufzeitraums löscht der Anbieter alle\nKundendaten einschließlich der Dateien innerhalb von [30] Tagen\nvollständig. Er löscht dazu den Mandanten in der Lizenzgeber-Konsole;\ndie Plattform verlangt zur Bestätigung den Firmencode und entfernt\nLieferungen, Dateien, Nutzer, Fahrzeuge, Mitteilungen, das Protokoll des\nMandanten, Sitzungen, Push-Abonnements sowie die Firmen- und\nLizenzdaten. Im Protokoll des Anbieters bleibt ein Eintrag mit\nFirmencode, Firmenname und Anzahl der gelöschten Nutzer und Dateien.\nDatensicherungen werden im regulären Sicherungszyklus überschrieben,\nspätestens [30] Tage nach der Löschung im Produktivsystem. Der Anbieter\nbestätigt die Löschung auf Verlangen in Textform.</p>\n<p>(3) Von der Löschung ausgenommen sind Daten, die der Anbieter als\nVerantwortlicher aufgrund eigener gesetzlicher Pflichten aufbewahren\nmuss, insbesondere Vertrags- und Abrechnungsdaten. Diese bewahrt der\nAnbieter außerhalb der Plattform auf (z. B. in seiner Buchhaltung).\nAuftragsdaten gehören nicht dazu.</p>\n<p>(4) Es obliegt dem Kunden, seine Daten vor Ablauf des Abrufzeitraums\nzu exportieren.</p>\n<h2 id=\"-19-mängelrechte\">§ 19 Mängelrechte</h2>\n<p>(1) Für die Bereitstellung der Plattform gelten die Vorschriften des\nMietrechts (§§ 535 ff. BGB) nach Maßgabe der folgenden Absätze. Der\nAnbieter erhält die Plattform während der Vertragslaufzeit in einem zum\nvertragsgemäßen Gebrauch geeigneten Zustand.</p>\n<p>(2) Die verschuldensunabhängige Haftung des Anbieters für Mängel, die\nbereits bei Vertragsschluss vorhanden waren (§ 536a Abs. 1 Alt. 1 BGB),\nist ausgeschlossen.</p>\n<p>(3) Der Kunde zeigt Mängel unverzüglich in Textform mit einer\nnachvollziehbaren Beschreibung an (§ 536c BGB).</p>\n<p>(4) Der Anbieter beseitigt Mängel innerhalb angemessener Frist unter\nBerücksichtigung der Reaktionszeiten des SLA. Er kann einen Mangel auch\ndurch eine zumutbare Umgehungslösung beheben.</p>\n<p>(5) Das Recht des Kunden zur Minderung bleibt unberührt. Gutschriften\nnach dem SLA werden auf Minderungs- und Schadensersatzansprüche\nangerechnet. Der Kunde kann die Minderung durch Abzug von laufenden\nZahlungen nur geltend machen, wenn der Minderungsanspruch unbestritten\noder rechtskräftig festgestellt ist; im Übrigen kann er zu viel gezahlte\nBeträge zurückfordern.</p>\n<p>(6) Eine Kündigung wegen Nichtgewährung des Gebrauchs nach § 543 Abs.\n2 Satz 1 Nr. 1 BGB ist erst zulässig, wenn der Anbieter ausreichend\nGelegenheit zur Mängelbeseitigung hatte und diese fehlgeschlagen\nist.</p>\n<p>(7) Ein Mangel liegt nicht vor bei unerheblichen Abweichungen sowie\nbei Beeinträchtigungen, die auf Endgeräte, Netze oder Software des\nKunden oder Dritter (z. B. Browser, Push-Dienste, App-Stores, Mobilfunk)\noder auf eine nicht bestimmungsgemäße Nutzung zurückgehen.</p>\n<p>(8) Für werkvertragliche Leistungen (z. B. Erstellung der\nWhite-Label-App, individuelle Anpassungen) verjähren Mängelansprüche in\nzwölf Monaten ab Abnahme. Dies gilt nicht für Schadensersatzansprüche\nnach § 20 Abs. 1 und bei Arglist.</p>\n<p>(9) Schadensersatz und Ersatz vergeblicher Aufwendungen schuldet der\nAnbieter nur nach § 20.</p>\n<blockquote>\n<p><strong>Prüfhinweis:</strong> Der BGH ordnet die Bereitstellung von\nSoftware über das Internet als Mietvertrag ein (BGH, Urt. v. 15.11.2006\n– XII ZR 120/04). Zu prüfen sind die AGB-Festigkeit von Abs. 2 und Abs.\n5 im B2B-Verkehr sowie die Anrechnung der Gutschriften.</p>\n</blockquote>\n<h2 id=\"-20-haftung\">§ 20 Haftung</h2>\n<p>(1) Der Anbieter haftet unbeschränkt</p>\n<ol type=\"1\">\n<li>bei Vorsatz und grober Fahrlässigkeit,</li>\n<li>bei Verletzung des Lebens, des Körpers oder der Gesundheit,</li>\n<li>nach dem Produkthaftungsgesetz,</li>\n<li>im Umfang einer ausdrücklich als solche bezeichneten Garantie,</li>\n<li>bei arglistig verschwiegenen Mängeln.</li>\n</ol>\n<p>(2) Bei einfacher Fahrlässigkeit haftet der Anbieter nur bei\nVerletzung einer wesentlichen Vertragspflicht. Wesentliche\nVertragspflichten sind Pflichten, deren Erfüllung die ordnungsgemäße\nDurchführung des Vertrags überhaupt erst ermöglicht und auf deren\nEinhaltung der Kunde regelmäßig vertrauen darf, insbesondere die\nBereitstellung der Plattform im Wesentlichen, die Einhaltung der\ntechnischen und organisatorischen Maßnahmen und die Datensicherung nach\nder Leistungsbeschreibung. In diesem Fall ist die Haftung auf den bei\nVertragsschluss vorhersehbaren, vertragstypischen Schaden begrenzt.</p>\n<p>(3) In den Fällen des Abs. 2 ist die Haftung je Schadensfall auf [den\nBetrag der für die vorangegangenen zwölf Monate geschuldeten Vergütung,\nmindestens jedoch 10.000 €] und für alle Schadensfälle eines\nVertragsjahres insgesamt auf [25.000 €] begrenzt.</p>\n<p>(4) Für den Verlust von Daten haftet der Anbieter im Fall des Abs. 2\nnur in Höhe des Aufwands, der für die Wiederherstellung aus der letzten\nnach der Leistungsbeschreibung geschuldeten Datensicherung erforderlich\nist, es sei denn, der Anbieter hat die Datensicherung pflichtwidrig\nunterlassen.</p>\n<p>(5) Die Haftungsbeschränkungen gelten auch zugunsten der Organe,\nMitarbeiter und Erfüllungsgehilfen des Anbieters.</p>\n<p>(6) Die Haftung gegenüber betroffenen Personen nach Art. 82 DSGVO\nbleibt unberührt. Im Verhältnis der Parteien gelten Art. 82 Abs. 4 und 5\nDSGVO und der AVV.</p>\n<p>(7) Schadensersatzansprüche nach Abs. 2 verjähren in einem Jahr ab\ndem gesetzlichen Verjährungsbeginn. Für Ansprüche nach Abs. 1 gelten die\ngesetzlichen Fristen.</p>\n<p>(8) Ein Mitverschulden des Kunden, insbesondere die Nichtbeachtung\nder Pflichten aus § 9, ist zu berücksichtigen (§ 254 BGB).</p>\n<blockquote>\n<p><strong>Prüfhinweis:</strong> Im unternehmerischen Verkehr ist die\nKlausel nur an § 307 BGB zu messen; § 309 Nr. 7 BGB wirkt über § 307\nindiziell. Die Haftungshöchstsumme muss den vertragstypischen,\nvorhersehbaren Schaden abdecken (BGH, Urt. v. 17.10.2013 – I ZR 226/12);\nder Begriff „Kardinalpflicht“ ist zu erläutern, wie in Abs. 2 geschehen.\nDie Beträge sind mit der Deckungssumme der IT-Haftpflichtversicherung\nabzustimmen. Zur neuen Produkthaftung: Die Richtlinie (EU) 2024/2853\nerfasst Software als Produkt und ist bis 09.12.2026 umzusetzen. Der\nBundestag hat das Gesetz zur Modernisierung des Produkthaftungsrechts am\n08.10.2026 beschlossen (BT-Drs. 21/4297, 21/8429), der zweite Durchgang\nim Bundesrat stand am 16.10.2026 aus (BR-Drs. 584/26). Gegenüber\nGeschädigten kann die Haftung nicht vertraglich ausgeschlossen werden.\nSachschäden an ausschließlich beruflich genutzten Sachen und der Verlust\nberuflich genutzter Daten sind nach der Richtlinie nicht ersatzfähig.\nRelevant bleiben Personenschäden, etwa bei Unfällen.</p>\n</blockquote>\n<h2 id=\"-21-schutzrechte-dritter-freistellung\">§ 21 Schutzrechte\nDritter, Freistellung</h2>\n<p>(1) Der Anbieter stellt den Kunden von Ansprüchen Dritter frei, die\ndarauf gestützt werden, dass die vertragsgemäße Nutzung der Plattform in\nDeutschland Schutzrechte Dritter verletzt. Voraussetzung ist, dass der\nKunde den Anbieter unverzüglich informiert, keine Ansprüche anerkennt\nund dem Anbieter die Verteidigung überlässt. Der Anbieter kann nach\nseiner Wahl die Plattform so ändern, dass sie die Schutzrechte nicht\nmehr verletzt, oder ein Nutzungsrecht beschaffen. § 20 gilt für\nweitergehende Ansprüche.</p>\n<p>(2) Der Kunde stellt den Anbieter von Ansprüchen Dritter frei, die\naus einer vom Kunden zu vertretenden rechtswidrigen Nutzung der\nPlattform durch ihn oder seine Nutzer entstehen; § 8 Abs. 4 Satz 2 und 3\ngilt entsprechend.</p>\n<h2 id=\"-22-datenschutz\">§ 22 Datenschutz</h2>\n<p>(1) Soweit der Anbieter im Auftrag des Kunden personenbezogene Daten\nverarbeitet, handelt er als Auftragsverarbeiter nach Art. 28 DSGVO auf\nGrundlage des AVV. Der AVV wird mit diesen AGB in elektronischer Form\ngeschlossen (Art. 28 Abs. 9 DSGVO).</p>\n<p>(2) Der Anbieter hat keine Einsicht in Auftragsdaten. Ein\nSupport-Zugriff auf den Mandanten erfolgt nur, wenn der Admin ihn\nfreigibt; die Freigabe gilt 24 Stunden, ist jederzeit widerruflich und\nwird im für den Kunden einsehbaren Protokoll dokumentiert. Die Plattform\nbietet derzeit keinen Support-Modus; auch mit Freigabe zeigt die\nLizenzgeber-Konsole keine Auftragsdaten. Ein Einmalpasswort für einen\nausgesperrten Admin erzeugt der Anbieter nur auf Anforderung des Kunden;\ndie Plattform schaltet dabei die Zwei-Faktor-Anmeldung des Admins aus,\nund der Vorgang steht im Protokoll des Kunden (Einzelheiten: AVV Anlage\n4).</p>\n<p>(3) Für Daten zur Vertragsanbahnung, zum Kundenkonto und zur\nAbrechnung ist der Anbieter Verantwortlicher. Einzelheiten enthält die\nDatenschutzerklärung unter [Website-URL/datenschutz].</p>\n<h2 id=\"-23-vertraulichkeit\">§ 23 Vertraulichkeit</h2>\n<p>(1) Die Parteien behandeln alle ihnen im Rahmen des Vertrags bekannt\nwerdenden vertraulichen Informationen der anderen Partei, insbesondere\nGeschäftsgeheimnisse im Sinne des Geschäftsgeheimnisgesetzes,\nKundendaten, Preise und Sicherheitsinformationen, vertraulich und\nverwenden sie nur zur Durchführung des Vertrags.</p>\n<p>(2) Die Pflicht gilt nicht für Informationen, die öffentlich bekannt\nsind oder ohne Verstoß gegen diese Pflicht werden, die der empfangenden\nPartei bereits bekannt waren oder die aufgrund gesetzlicher Pflicht oder\nbehördlicher oder gerichtlicher Anordnung offengelegt werden müssen; im\nletzten Fall informiert die offenlegende Partei die andere Partei,\nsoweit zulässig, vorab.</p>\n<p>(3) Die Vertraulichkeitspflicht besteht für [drei] Jahre nach\nVertragsende fort, für Geschäftsgeheimnisse so lange, wie sie\nGeschäftsgeheimnisse sind.</p>\n<h2 id=\"-24-informationssicherheit-sicherheitsvorfälle-nis2\">§ 24\nInformationssicherheit, Sicherheitsvorfälle, NIS2</h2>\n<p>(1) Der Anbieter trifft die technischen und organisatorischen\nMaßnahmen nach Anlage 2 des AVV und betreibt die Plattform in einem nach\nISO/IEC 27001 zertifizierten Rechenzentrum in Deutschland.</p>\n<p>(2) Der Anbieter informiert den Kunden unverzüglich, spätestens\ninnerhalb von [24] Stunden nach Kenntnis, über Sicherheitsvorfälle, die\ndie Daten oder die Verfügbarkeit des Mandanten erheblich\nbeeinträchtigen. Meldungen von Verletzungen des Schutzes\npersonenbezogener Daten richten sich nach dem AVV.</p>\n<p>(3) Ist der Kunde eine wichtige oder besonders wichtige Einrichtung\nim Sinne des BSI-Gesetzes, unterstützt der Anbieter ihn in angemessenem\nUmfang bei der Erfüllung seiner Pflichten zur Sicherheit in der\nLieferkette, insbesondere durch Auskünfte zu Sicherheitsmaßnahmen,\nNachweise (z. B. Zertifikate des Rechenzentrums) und die Beantwortung\neines Sicherheitsfragebogens einmal je Vertragsjahr ohne zusätzliche\nVergütung. Darüber hinausgehenden Aufwand vergütet der Kunde nach\nAufwand.</p>\n<p>(4) Hinweise auf Sicherheitslücken nimmt der Anbieter unter\n[Sicherheits-E-Mail] entgegen (security.txt unter\n[Website-URL]/.well-known/security.txt).</p>\n<p>(5) Sicherheitstests des Kunden (z. B. Penetrationstests) sind nur\nnach vorheriger Abstimmung in Textform zulässig.</p>\n<blockquote>\n<p><strong>Prüfhinweis:</strong> Das NIS2UmsuCG gilt seit 06.12.2025\nohne Übergangsfristen. Erfasst sind Einrichtungen der Anlagen 1 und 2\ndes BSIG ab 50 Beschäftigten oder mehr als 10 Mio. € Jahresumsatz und\nJahresbilanzsumme. Anbieter von Cloud-Computing-Diensten unterliegen\nnach der Systematik der NIS2-Richtlinie den Größenschwellen; ein kleiner\nAnbieter ist danach nicht erfasst (Einordnung als\n„Cloud-Computing-Dienst“ prüfen, BSI-Betroffenheitsprüfung durchführen).\nSpeditionen und Frachtführer sind in den Anlagen nicht genannt;\nKurierdienste als Anbieter von Postdienstleistungen (Anlage 2) können\nerfasst sein und verlangen Lieferkettenklauseln (§ 30 BSIG).</p>\n</blockquote>\n<h2 id=\"-25-referenznennung\">§ 25 Referenznennung</h2>\n<p>(1) Der Anbieter darf den Kunden mit Firma und Logo als\nReferenzkunden auf seiner Website, in Präsentationen und\nVertriebsunterlagen nennen. Inhalte der Kundendaten und\nVertragskonditionen werden dabei nicht offengelegt.</p>\n<p>(2) Der Kunde kann der Referenznennung jederzeit ohne Angabe von\nGründen in Textform [oder über die Einstellungen der Plattform – derzeit\nnicht vorhanden] widersprechen. Der Anbieter entfernt die Nennung dann\ninnerhalb von [30] Tagen aus Online-Medien und verwendet sie in neuen\nUnterlagen nicht mehr.</p>\n<p>(3) Fallstudien, Zitate und Abbildungen von Mitarbeitern des Kunden\nverwendet der Anbieter nur mit gesonderter Zustimmung.</p>\n<h2 id=\"-26-höhere-gewalt\">§ 26 Höhere Gewalt</h2>\n<p>Keine Partei haftet für die Nichterfüllung von Pflichten, soweit\ndiese auf Umständen beruht, die außerhalb ihres zumutbaren\nEinflussbereichs liegen, insbesondere Naturkatastrophen, Pandemien,\nKrieg, Terror, behördliche Anordnungen, flächendeckende Ausfälle von\nStrom- oder Telekommunikationsnetzen oder Arbeitskampfmaßnahmen in\nDrittbetrieben. Die betroffene Partei informiert die andere\nunverzüglich. Dauert die Behinderung länger als [30] Tage, kann jede\nPartei den Vertrag außerordentlich kündigen.</p>\n<h2 id=\"-27-änderungen-dieser-agb\">§ 27 Änderungen dieser AGB</h2>\n<p>(1) Der Anbieter kann diese AGB mit Wirkung für die Zukunft ändern,\nwenn hierfür ein triftiger Grund besteht, insbesondere eine Änderung der\nRechtslage oder Rechtsprechung, neue Funktionen oder\nSicherheitsanforderungen, und der Kunde dadurch nicht unangemessen\nbenachteiligt wird. Leistungsumfang und Preise werden nicht nach dieser\nBestimmung geändert; für Preise gilt § 15.</p>\n<p>(2) Der Anbieter teilt dem Kunden Änderungen mindestens [6] Wochen\nvor ihrem Wirksamwerden in Textform mit und hebt die Änderungen hervor.\nWiderspricht der Kunde nicht innerhalb dieser Frist in Textform, gelten\ndie Änderungen als angenommen. Der Anbieter weist in der Mitteilung auf\ndie Frist und die Folgen eines unterlassenen Widerspruchs hin.\nWiderspricht der Kunde, gilt der Vertrag zu den bisherigen Bedingungen\nfort; jede Partei kann ihn dann außerordentlich zum Zeitpunkt des\ngeplanten Wirksamwerdens kündigen.</p>\n<blockquote>\n<p><strong>Prüfhinweis:</strong> Der BGH hat Zustimmungsfiktionsklauseln\ngegenüber Verbrauchern für unwirksam erklärt, soweit sie ohne\nBeschränkung auf bestimmte Inhalte gelten (BGH, Urt. v. 27.04.2021 – XI\nZR 26/20). Die Übertragbarkeit auf B2B ist offen; die Klausel ist daher\nauf Änderungen außerhalb der Hauptleistungspflichten beschränkt.</p>\n</blockquote>\n<h2 id=\"-28-schlussbestimmungen\">§ 28 Schlussbestimmungen</h2>\n<p>(1) Es gilt das Recht der Bundesrepublik Deutschland unter Ausschluss\ndes UN-Kaufrechts (CISG).</p>\n<p>(2) Ist der Kunde Kaufmann, juristische Person des öffentlichen\nRechts oder öffentlich-rechtliches Sondervermögen, ist ausschließlicher\nGerichtsstand für alle Streitigkeiten aus diesem Vertrag [Sitz des\nAnbieters/Ort des Gerichtsstands]. Der Anbieter ist berechtigt, den\nKunden auch an dessen allgemeinem Gerichtsstand zu verklagen.</p>\n<p>(3) Erklärungen nach diesem Vertrag bedürfen der Textform, soweit\nnicht ausdrücklich etwas anderes bestimmt ist.</p>\n<p>(4) Der Kunde kann Rechte aus diesem Vertrag nur mit Zustimmung des\nAnbieters abtreten. § 354a HGB bleibt unberührt.</p>\n<p>(5) Sollte eine Bestimmung dieses Vertrags unwirksam sein oder\nwerden, bleibt die Wirksamkeit der übrigen Bestimmungen unberührt.\nAnstelle der unwirksamen Bestimmung gelten die gesetzlichen\nVorschriften.</p>\n<p>(6) Maßgeblich ist die deutsche Fassung dieser AGB. Übersetzungen\ndienen nur der Information.</p>\n<p>(7) Der Anbieter ist nicht bereit und nicht verpflichtet, an\nStreitbeilegungsverfahren vor einer Verbraucherschlichtungsstelle\nteilzunehmen; der Vertrag richtet sich ausschließlich an\nUnternehmer.</p>\n<hr />\n<h2 id=\"anlage-a--exportierbare-und-nicht-exportierbare-daten\">Anlage A\n– Exportierbare und nicht exportierbare Daten</h2>\n<p>Abschließende Aufzählung nach Art. 25 Abs. 2 lit. e und f Data\nAct.</p>\n<h3 id=\"a1-exportierbare-daten-und-digitale-vermögenswerte\">A.1\nExportierbare Daten und digitale Vermögenswerte</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Kategorie</th>\n<th>Inhalt</th>\n<th>Format</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mandant</td>\n<td>Firmenname, rechtlicher Name, Anschrift, Kontakt, Firmencode, Tarif-\nund Lizenzangaben, belegter Speicher, gesendete Kündigungs- und\nTarifwünsche, Buchungsnummern-Präfix, Einstellungen (z. B. Fotopflicht,\nUnterschrift, Ankunftserfassung, Palettentausch, Fahrsperre, Standort\nbeim Statuswechsel, Auswertungen je Fahrer, Aufbewahrung in Jahren),\nEnde einer Support-Freigabe, ob ein API-Schlüssel besteht (mit den\nletzten 4 Zeichen)</td>\n<td>JSON</td>\n</tr>\n<tr class=\"even\">\n<td>Branding</td>\n<td>Logo, App-Symbol, Markenfarbe, App-Name, eigene Domains</td>\n<td>JSON, gespeicherte Datei (PNG)</td>\n</tr>\n<tr class=\"odd\">\n<td>Nutzer</td>\n<td>Name, Rolle, E-Mail bzw. Handynummer, Personalnummer, Sprache,\nStatus, Führerscheinklasse, Notiz, zugeordnetes Fahrzeug, letzte\nAnmeldung, Zustimmung zum Standort, ob die Zwei-Faktor-Anmeldung\neingeschaltet ist; gelöschte Personen als „Gelöschter Nutzer“</td>\n<td>JSON</td>\n</tr>\n<tr class=\"even\">\n<td>Fahrzeuge</td>\n<td>Kennzeichen, Art, Nutzlast, Stellplätze, Ausstattung,\nHU-/SP-Termine, Status, Notizen</td>\n<td>JSON</td>\n</tr>\n<tr class=\"odd\">\n<td>Lieferungen</td>\n<td>Buchungsnummer, Auftraggeber, Referenz, Lade- und Entladestellen mit\nAdressen, Zeitfenstern und Ansprechpartnern, Ware, Paletten, Gewicht,\nGefahrgut, Temperatur, Hinweise, interne Notiz, Zuweisung, Status,\nZustell- bzw. Stornozeitpunkt</td>\n<td>JSON; Lieferliste als CSV (alle Lieferungen, neueste zuerst)</td>\n</tr>\n<tr class=\"even\">\n<td>Verlauf</td>\n<td>Ereignisse mit Zeitpunkt des Tippens, – falls abweichend –\nEingangszeit beim Server, handelnder Person und – falls erfasst und\njünger als 90 Tage – Standort; Notizen; Problemmeldungen;\nPalettentausch; Empfängerangaben</td>\n<td>JSON</td>\n</tr>\n<tr class=\"odd\">\n<td>Dokumente</td>\n<td>Lieferschein-Fotos, PDF-Dokumente, Unterschriften, Fotos zu\nProblemmeldungen, jeweils als gespeicherte Datei (Fotos als JPEG,\nUnterschriften als PNG, PDF unverändert) mit Dateiliste</td>\n<td>Dateien im ZIP-Archiv, Liste in JSON</td>\n</tr>\n<tr class=\"even\">\n<td>Berichte</td>\n<td>Auswertungen je Monat: Zugestellt, Pünktlichkeit, Standzeiten,\nPalettensaldo, je Auftraggeber, je Lade- und Entladestelle und – falls\neingeschaltet – je Fahrer</td>\n<td>CSV (Download auf der Berichtsseite, wählbar sind die letzten 24\nMonate)</td>\n</tr>\n<tr class=\"odd\">\n<td>Protokoll</td>\n<td>den Mandanten betreffende Einträge des Audit-Logs (3 Jahre),\neinschließlich Anmeldungen, Fehlversuchen, Exporten und Freigaben des\nSupport-Zugriffs, mit IP-Adressen der letzten 90 Tage</td>\n<td>JSON</td>\n</tr>\n<tr class=\"even\">\n<td>Metadaten</td>\n<td>Erstellungs- und Änderungszeitpunkte, Bezüge zwischen Datensätzen\n(IDs), Zeitpunkt des Exports</td>\n<td>JSON</td>\n</tr>\n</tbody>\n</table>\n<p>Der Abliefernachweis ist keine gespeicherte Datei; die Plattform\nerzeugt ihn bei Bedarf als Druckansicht aus den exportierten\nLieferdaten.</p>\n<h3 id=\"a2-vom-export-ausgenommene-daten\">A.2 Vom Export ausgenommene\nDaten</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Kategorie</th>\n<th>Grund</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Passwort- und PIN-Hashes, Zähler für Fehlversuche, Sitzungs-Tokens,\nAPI-Schlüssel und ihr Hash, Schlüssel der Zwei-Faktor-Anmeldung,\nEinladungs-Token, Schlüssel der Push-Abonnements</td>\n<td>Sicherheit; für einen Wechsel nicht erforderlich, Zugänge werden\nbeim Zielanbieter neu vergeben</td>\n</tr>\n<tr class=\"even\">\n<td>Kennungen gegen doppeltes Senden (mit dem Ergebnis der Aktion, 7\nTage)</td>\n<td>technische Hilfsdaten; die Ergebnisse stehen in den exportierten\nDaten</td>\n</tr>\n<tr class=\"odd\">\n<td>Lizenz-Historie, interne Notiz des Anbieters zur Lizenz, Merker für\nSpeicherwarnungen</td>\n<td>Vertrags- und Abrechnungsdaten des Anbieters (§ 18 Abs. 3)</td>\n</tr>\n<tr class=\"even\">\n<td>In-App-Mitteilungen</td>\n<td>Kopien von Status- und Hinweistexten, die nach 90 Tagen ohnehin\ngelöscht werden; die Inhalte stehen im Verlauf der Lieferungen</td>\n</tr>\n<tr class=\"odd\">\n<td>interne Sicherheits- und Betriebsprotokolle des Anbieters, die nicht\nden Mandanten betreffen</td>\n<td>Sicherheit und Schutz anderer Kunden</td>\n</tr>\n<tr class=\"even\">\n<td>Quellcode, Vorlagen, Übersetzungen und Gestaltungselemente der\nPlattform</td>\n<td>Geschäftsgeheimnisse und Rechte des Anbieters</td>\n</tr>\n</tbody>\n</table>\n<p>Die Ausnahmen beeinträchtigen den Wechsel nicht.</p>\n"};</script>

zebna jest pomoc, można tu udzielić czasowego dostępu – jest on rejestrowany.","Der Auftrag wartet, bis Sie ihn einem Fahrer zuteilen.":"Zlecenie czeka, aż przydzielą je Państwo kierowcy.","Der Code stimmt nicht. Bitte den aktuellen Code aus der App eingeben.":"Kod jest nieprawidłowy. Proszę wpisać aktualny kod z aplikacji.","Der Empfänger unterschreibt auf dem Display.":"Odbiorca podpisuje się na ekranie.","Der Fahrer hat eine beladene Tour. Bitte die Tour erst abschließen oder stornieren.":"Kierowca ma załadowaną trasę. Proszę najpierw ją zakończyć lub anulować.","Der Fahrer meldet sich mit Handynummer und PIN an.":"Kierowca loguje się numerem telefonu i PIN-em.","Der Firmencode braucht mindestens 3 Buchstaben/Ziffern.":"Kod firmy musi mieć co najmniej 3 litery/cyfry.","Der Kunde bekommt sofort einen Admin-Zugang und kann sein Logo hochladen.":"Klient od razu otrzymuje konto administratora i może przesłać swoje logo.","Der Link gilt für eine Anmeldung. Abgelaufen oder benutzt? „Neue Einladung“ erzeugt Link und PIN neu.":"Link działa przy jednym logowaniu. Wygasł lub został użyty? „Nowe zaproszenie” tworzy nowy link i PIN.","Der neue Tarif ist zu klein":"Nowy pakiet jest za mały","Der Pool, aus dem Ihre Fahrer LKW und Auflieger wählen.":"Pula, z której kierowcy wybierają ciężarówki i naczepy.","Der Schlüssel wird nur jetzt angezeigt.":"Klucz jest wyświetlany tylko teraz.","Der Speicher Ihres Tarifs ist voll. Bitte alte Lieferscheine exportieren und löschen oder den Tarif wechseln.":"Miejsce na dane w pakiecie jest pełne. Proszę wyeksportować i usunąć stare dokumenty WZ albo zmienić pakiet.","Der Speicher ist fast voll. Bitte alte Lieferscheine exportieren und löschen oder den Tarif wechseln.":"Miejsce na dane jest prawie pełne. Proszę wyeksportować i usunąć stare dokumenty WZ albo zmienić pakiet.","Der Vertrag ist gekündigt. Daten können bis zur Löschung angesehen und exportiert, aber nicht geändert werden.":"Umowa została wypowiedziana. Do czasu usunięcia dane można przeglądać i eksportować, ale nie można ich zmieniać.","Der Vertrag ist schon gekündigt.":"Umowa jest już wypowiedziana.","Der Zugang dieses Unternehmens ist beendet. Nur der Admin kann die Daten noch exportieren.":"Dostęp tej firmy został zakończony. Dane może jeszcze wyeksportować tylko administrator.","Der Zugang ist zurzeit gesperrt. Bitte die Disposition anrufen.":"Twój dostęp jest teraz zablokowany. Zadzwoń do dyspozytora.",Details:"Szczegóły","Die API ist im Tarif Premium enthalten.":"API jest zawarte w pakiecie Premium.","Die automatische Rechnungsstellung (SEPA, DATEV-Export) folgt in Version 1.2.":"Automatyczne fakturowanie (SEPA, eksport DATEV) pojawi się w wersji 1.2.","Die beiden neuen Passwörter sind nicht gleich.":"Oba nowe hasła nie są takie same.","Die Beispieldaten sind wieder auf dem Stand von heute.":"Dane przykładowe są znów aktualne na dziś.","Die Beispielfirma Kaya Logistik wurde gelöscht. Mit „Demo zurücksetzen“ ist sie wieder da.":"Przykładowa firma Kaya Logistik została usunięta. „Zresetuj demo” przywraca ją.","Die Buchung ist schon bestätigt.":"Zlecenie jest już potwierdzone.","Die Datei ist zu groß.":"Plik jest za duży.","Die Disposition bekommt sofort eine dringende Mitteilung.":"Dyspozytor od razu dostanie pilne powiadomienie.","Die Disposition hat das nicht bekommen. Bitte prüfen und bei Bedarf anrufen.":"Dyspozytor tego nie dostał. Sprawdź i w razie potrzeby zadzwoń.","Die Disposition teilt die Fahrzeuge zu.":"Pojazdy przydziela dyspozytor.","Die Disposition wird sofort informiert und vergibt die Tour neu.":"Dyspozytor zostanie od razu poinformowany i przydzieli trasę na nowo.","Die Entladezeit liegt vor der Ladezeit.":"Godzina rozładunku jest wcześniejsza niż godzina załadunku.","Die Fahrsperre ist aus, weil der Standort im Browser blockiert ist. Bitte in den Browser-Einstellungen erlauben.":"Blokada podczas jazdy jest wyłączona, bo lokalizacja jest zablokowana w przeglądarce. Zezwól na nią w ustawieniach przeglądarki.","Die Lades
