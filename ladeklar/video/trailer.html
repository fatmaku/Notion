<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Ladeklar – Trailer</title>
<!-- Motion-design trailer. Deterministic: window.render(t) draws the frame for second t.
     ?ratio=16x9 (1920×1080, 72 s) or ?ratio=9x16 (1080×1920, 30 s). ?url= sets the web address on the end card.
     Rendered to MP4 by capture.js; open in a browser with ?play to watch it live. -->
<link rel="stylesheet" href="../web/css/fonts.css">
<style>
  :root { --ink: #0b1622; --ink2: #13233a; --brass: #c8a45c; --brass2: #e6cd92; --paper: #f3f5f7; --chaos: #1a2029; --teal: #0e7c7b; --ok: #12804c; --bad: #d64545; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--ink); font-family: Manrope, system-ui, sans-serif; color: #fff; }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .full { position: absolute; inset: 0; }
  #bg { background: radial-gradient(120% 90% at 70% 10%, #1d2836, #0d1219 70%); }
  #bgBrand { background: radial-gradient(90% 80% at 78% 18%, rgba(200,164,92,.20), transparent 60%), radial-gradient(70% 70% at 10% 100%, rgba(14,124,123,.22), transparent 60%), var(--ink); }
  #bgEve { background: linear-gradient(180deg, #0b1622 0%, #1e1c22 55%, #4a2d18 100%); }
  canvas#net { position: absolute; }
  .ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .disp { font-family: Archivo, Manrope, sans-serif; font-stretch: 112%; font-weight: 850; letter-spacing: -.02em; }
  /* captions */
  #cap { position: absolute; z-index: 30; }
  .cl { display: block; line-height: 1.02; white-space: nowrap; }
  .cw { display: inline-block; margin-right: .26em; will-change: transform, opacity, filter; }
  .cw.acc { color: var(--brass2); }
  .capShade { position: absolute; z-index: 29; background: linear-gradient(90deg, rgba(8,14,22,.85), rgba(8,14,22,0)); }
  /* chaos */
  .clock { font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 100%; color: #cfd8e3; font-variant-numeric: tabular-nums; letter-spacing: -.02em; text-shadow: 0 0 60px rgba(160,190,220,.25); }
  .badge { width: 150px; height: 150px; border-radius: 44px; display: grid; place-items: center; background: #27313d; color: #e9eef4; font-size: 70px; box-shadow: 0 30px 60px rgba(0,0,0,.4); }
  .badge.red { background: #6b2a2a; }
  .wave { width: 150px; height: 150px; border-radius: 50%; border: 3px solid rgba(233,238,244,.6); }
  .bubble { padding: 24px 34px; border-radius: 32px 32px 32px 8px; background: #2c3643; color: #e9eef4; font-size: 46px; font-weight: 700; box-shadow: 0 20px 40px rgba(0,0,0,.35); white-space: nowrap; }
  .bubble.me { border-radius: 30px 30px 8px 30px; background: #3b4a5c; }
  .bubble.hot { background: #5e2b2b; }
  .note { width: 320px; padding: 26px 26px 30px; background: #d9cf9f; color: #2a2a22; font: 600 34px/1.25 'Comic Sans MS', 'Segoe Print', Manrope, cursive; box-shadow: 0 24px 50px rgba(0,0,0,.45); }
  .sheet { width: 640px; padding: 26px; background: #e8ecef; color: #222; border-radius: 10px; box-shadow: 0 30px 60px rgba(0,0,0,.45); font-weight: 700; }
  .sheet .r { display: grid; grid-template-columns: 1.3fr 1fr 1fr .8fr; gap: 6px; margin-top: 8px; font-size: 22px; }
  .sheet .r span { background: #fff; padding: 8px 10px; border-radius: 4px; }
  .sheet .r span.x { background: #f2b9b9; color: #7a1d1d; }
  .paper { background: #fbfaf6; color: #1d232b; border-radius: 6px; box-shadow: 0 40px 80px rgba(0,0,0,.5); overflow: hidden; }
  .paper img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cal { width: 300px; height: 330px; border-radius: 26px; background: #f1f3f6; color: #1d232b; box-shadow: 0 30px 60px rgba(0,0,0,.45); overflow: hidden; text-align: center; }
  .cal .top { height: 82px; background: #b23b3b; color: #fff; font: 800 34px/82px Manrope, sans-serif; letter-spacing: .08em; }
  .cal .day { font: 850 120px/1.4 Archivo, sans-serif; }
  .invoice { width: 560px; height: 720px; padding: 46px; }
  .invoice h3 { font: 850 54px Archivo, sans-serif; font-stretch: 110%; }
  .invoice .ln { height: 18px; background: #e3e1da; border-radius: 9px; margin-top: 22px; }
  .invoice .sum { margin-top: 60px; font: 800 44px Manrope, sans-serif; display: flex; justify-content: space-between; }
  .stamp { padding: 14px 34px; border: 9px solid #c0392b; color: #c0392b; border-radius: 16px; font: 900 96px Archivo, sans-serif; letter-spacing: .06em; opacity: .9; mix-blend-mode: multiply; }
  .stamp.ok { border-color: #12804c; color: #12804c; }
  /* brand */
  .check path { fill: none; stroke: var(--brass); stroke-width: 26; stroke-linecap: round; stroke-linejoin: round; }
  .wm { font-family: Archivo, sans-serif; font-weight: 850; font-stretch: 125%; color: #fff; white-space: nowrap; }
  /* devices */
  .phone { width: 430px; height: 900px; border-radius: 62px; padding: 14px; background: linear-gradient(145deg, #2c3644, #0b1016); box-shadow: 0 60px 120px rgba(0,0,0,.6), inset 0 0 0 2px #3c4859, 0 0 0 1px rgba(255,255,255,.04); }
  .phone .scr { position: relative; width: 100%; height: 100%; border-radius: 49px; overflow: hidden; background: #eef1f4; }
  .phone .scr img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .phone .isl { position: absolute; top: 28px; left: 50%; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #000; z-index: 3; }
  .tap { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; background: rgba(255,255,255,.55); border: 3px solid #fff; z-index: 4; }
  .flash { position: absolute; inset: 0; background: #fff; z-index: 5; }
  .laptop { width: 1180px; }
  .laptop .lid { position: relative; padding: 22px 22px 26px; border-radius: 28px 28px 0 0; background: linear-gradient(#232c38, #11171f); box-shadow: 0 50px 100px rgba(0,0,0,.55), inset 0 0 0 2px #333f4f; }
  .laptop .lid .scr { position: relative; width: 100%; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 8px; background: #eef1f4; }
  .laptop .lid img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top left; }
  .laptop .base { height: 34px; margin: 0 -70px; border-radius: 0 0 30px 30px; background: linear-gradient(#cdd5de, #8d99a7); box-shadow: 0 30px 60px rgba(0,0,0,.4); }
  .toast { position: absolute; width: 470px; display: grid; grid-template-columns: 54px 1fr; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 22px; background: rgba(255,255,255,.92); color: #0b1622; box-shadow: 0 24px 60px rgba(0,0,0,.35); font-family: Manrope, sans-serif; z-index: 6; }
  .toast .ti { width: 54px; height: 54px; border-radius: 15px; background: #fff; display: grid; place-items: center; overflow: hidden; box-shadow: inset 0 0 0 1px #e3e8ed; }
  .toast b { display: block; font-size: 21px; font-weight: 800; }
  .toast p { font-size: 18px; color: #34465a; font-weight: 600; }
  .bigbtn { width: 760px; height: 190px; border-radius: 48px; background: var(--teal); display: flex; align-items: center; gap: 36px; padding: 0 46px; box-shadow: 0 30px 70px rgba(14,124,123,.45), inset 0 2px 0 rgba(255,255,255,.25); overflow: hidden; }
  .bigbtn .si { width: 116px; height: 116px; border-radius: 34px; background: rgba(255,255,255,.18); display: grid; place-items: center; font-size: 66px; flex: none; }
  .bigbtn .lbl { position: relative; height: 100px; flex: 1; overflow: hidden; }
  .bigbtn .lbl span { position: absolute; left: 0; top: 0; font: 850 80px/100px Archivo, Manrope, sans-serif; font-stretch: 104%; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 14px; width: 760px; }
  .chips span { padding: 12px 22px; border-radius: 16px; border: 2px solid rgba(255,255,255,.18); font-weight: 750; font-size: 28px; color: #9fb0c3; }
  .chips span.on { background: #fff; color: var(--ink); border-color: #fff; }
  .stat { width: 470px; text-align: left; }
  .stat .si { width: 96px; height: 96px; border-radius: 28px; display: grid; place-items: center; background: rgba(200,164,92,.16); color: var(--brass2); font-size: 52px; margin-bottom: 26px; }
  .stat .v { font: 850 132px/1 Archivo, sans-serif; font-stretch: 105%; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 34px; font-weight: 700; color: #b8c5d3; margin-top: 14px; line-height: 1.2; }
  .foot { font-size: 21px; color: #8394a7; font-weight: 600; }
  .home { width: 430px; height: 900px; border-radius: 62px; padding: 14px; background: linear-gradient(145deg, #2c3644, #0b1016); box-shadow: 0 60px 120px rgba(0,0,0,.6), inset 0 0 0 2px #3c4859; }
  .home .scr { position: relative; width: 100%; height: 100%; border-radius: 49px; overflow: hidden; background: linear-gradient(160deg, #31455f, #10202f 60%, #0b1622); }
  .apps { position: absolute; left: 34px; right: 34px; top: 120px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 34px 20px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: #dfe7f0; }
  .app i { width: 74px; height: 74px; border-radius: 20px; display: grid; place-items: center; font-size: 34px; color: #fff; background: rgba(255,255,255,.12); font-style: normal; }
  .hero-ic { position: absolute; left: 50%; top: 520px; width: 150px; margin-left: -75px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .hero-ic .icn { position: relative; width: 150px; height: 150px; border-radius: 38px; overflow: hidden; box-shadow: 0 24px 50px rgba(0,0,0,.45); }
  .hero-ic .icn > * { position: absolute; inset: 0; }
  .hero-ic .nm { position: relative; height: 34px; width: 260px; text-align: center; }
  .hero-ic .nm span { position: absolute; left: 0; right: 0; font-size: 26px; font-weight: 800; color: #fff; }
  .cta { display: inline-flex; align-items: center; gap: 18px; padding: 26px 46px; border-radius: 26px; background: var(--brass); color: #1b1508; font: 850 46px Manrope, sans-serif; box-shadow: 0 24px 60px rgba(200,164,92,.35); }
  #grain { z-index: 40; pointer-events: none; opacity: .07; mix-blend-mode: overlay; }
  #vig { z-index: 39; pointer-events: none; background: radial-gradient(120% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.55)); }
  #black { z-index: 50; background: #000; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { icon } from '../web/js/icons.js';
import { routeNet } from '../web/js/routenet.js';
import { LOGOS } from '../core/seed.js';

const Q = new URLSearchParams(location.search);
const V = Q.get('ratio') === '9x16';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const URL_TEXT = Q.get('url') || 'ladeklar.de';
const DUR = V ? 30 : 72;
window.DUR = DUR;
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const E = {
  out: (x) => 1 - Math.pow(1 - x, 3), in: (x) => x * x * x, io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  back: (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  expo: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
};
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const el = (html, parent = stage) => { const d = document.createElement('div'); d.innerHTML = html.trim(); const n = d.firstElementChild; parent.appendChild(n); return n; };
const put = (n, { x = 0, y = 0, s = 1, r = 0, o = 1, blur = 0, ox, oy }) => {
  n.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg) scale(${s})`;
  n.style.opacity = o <= 0.001 ? 0 : o;
  n.style.filter = blur > 0.05 ? `blur(${blur}px)` : '';
  if (ox != null) n.style.transformOrigin = `${ox} ${oy}`;
  n.style.visibility = o <= 0.001 ? 'hidden' : 'visible';
};
const hide = (n) => { n.style.opacity = 0; n.style.visibility = 'hidden'; };
const vis = (t, a, b, fi = 0.4, fo = 0.4) => Math.min(P(t, a, a + fi), 1 - P(t, b - fo, b)); // fade window
const shake = (t, amp, f = 38) => amp * Math.sin(t * f) * Math.sin(t * f * 0.71 + 1.3);
const img = (src, cls = '') => `<img src="${src}" class="${cls}" alt="">`;

// ---------- timeline (scene windows) ----------
const T = V ? {
  clock: [0, 3.2], phones: [0, 3.2], chat: [3.0, 7.0], paper: [-1, -1], away: [6.8, 9.0], invoice: [-1, -1], logo: [9.0, 11.2],
  drive: [11.0, 17.2], office: [17.0, 21.2], lang: [21.0, 24.2], logos: [-1, -1], eve: [24.0, 27.2], stats: [-1, -1], end: [27.0, 30],
} : {
  clock: [0, 4.2], phones: [3.9, 9.2], chat: [8.9, 14.2], paper: [13.9, 19.2], away: [18.9, 24.2], invoice: [23.9, 27.15], logo: [27.15, 30.3],
  drive: [30.0, 43.2], office: [43.0, 48.2], lang: [48.0, 52.2], eve: [52.0, 57.2], stats: [57.0, 63.2], logos: [63.0, 67.2], end: [67.0, 72],
};
// moments inside the drive scene (driver taps)
const D = V
  ? { in: 11.0, tap1: 12.0, ok1: 12.15, s2: 12.9, tap2: 13.6, ok2: 13.75, s3: 14.4, tap3: 15.0, ok3: 15.15, s4: 15.6, tap4: 15.9, s5: 16.1, flash: 16.4, tap5: 16.8, ok5: 16.95, out: 17.2 }
  : { in: 30.0, tap1: 31.6, ok1: 31.75, s2: 32.9, tap2: 34.6, ok2: 34.75, s3: 35.9, tap3: 38.5, ok3: 38.65, s4: 39.6, tap4: 40.0, s5: 40.25, flash: 41.0, tap5: 42.2, ok5: 42.35, out: 43.2 };
window.TIMELINE = { T, D };

// ---------- captions ----------
const CAPS = V ? [
  [0.3, 3.0, ['6:12 Uhr.', 'Telefon *klingelt.*']],
  [3.3, 6.9, ['„Wo bist du?“']],
  [7.0, 8.9, ['Lieferschein?', '*Kommt Freitag.*']],
  [11.4, 17.0, ['Ein Tipp.', '*Alles klar.*']],
  [17.4, 21.0, ['Das Büro sieht’s', '*live.*']],
  [21.3, 24.0, ['8 Sprachen.', '*Ihr Logo.*']],
  [24.4, 27.0, ['Rechnung am', '*selben Tag.*']],
] : [
  [0.5, 4.0, ['6:12 Uhr.']],
  [4.4, 9.0, ['Das Telefon klingelt.', '*Schon wieder.*']],
  [9.4, 14.0, ['„Wo bist du?“']],
  [14.4, 19.0, ['Zettel. Listen.', '*Rückrufe.*']],
  [19.4, 24.0, ['Lieferschein?', 'Kommt Freitag.', '*Vielleicht.*']],
  [24.3, 27.05, ['Rechnung wartet.', '*Standzeit unbezahlt.*']],
  [30.6, 34.3, ['Ein Tipp:', '*Bestätigt.*']],
  [34.8, 38.3, ['*Aufgeladen.*']],
  [38.8, 43.0, ['Abgeladen.', '*Lieferschein*', '*fotografiert.*']],
  [43.4, 48.0, ['Das Büro sieht es.', '*Sofort.*']],
  [48.4, 52.0, ['8 Sprachen.', '*Keine Dauerortung.*']],
  [52.4, 57.0, ['17:00 Uhr.', 'Alles erledigt.', '*Rechnung raus.*']],
  [63.4, 67.0, ['Ihr Logo.', '*Ihre App.*']],
];
const capBox = el(`<div id="cap"></div>`);
const capShade = el(`<div class="capShade"></div>`);
const capNodes = CAPS.map(([a, b, lines], i) => {
  const box = el(`<div class="abs" data-cap="${i}">${lines.map((l) => `<span class="cl">${l.split(' ').map((w) => { const acc = /^\*.*\*$/.test(w) || /^\*/.test(w) || /\*$/.test(w); return `<span class="cw ${l.startsWith('*') ? 'acc' : ''}">${w.replace(/\*/g, '')}</span>`; }).join('')}</span>`).join('')}</div>`, capBox);
  box.querySelectorAll('.cl').forEach((n, k) => { if (lines[k].startsWith('*')) n.querySelectorAll('.cw').forEach((w) => w.classList.add('acc')); });
  return { a, b, box, words: [...box.querySelectorAll('.cw')] };
});
function layoutCaps() {
  const fs = V ? 104 : 104;
  capBox.style.cssText = V ? `left:${80}px;top:${H * 0.12}px;font-size:${fs}px` : `left:120px;bottom:120px;font-size:${fs}px`;
  capBox.className = 'disp';
  capNodes.forEach((c) => { c.box.style.position = 'absolute'; c.box.style.left = '0px'; if (V) { c.box.style.top = '0px'; c.box.style.bottom = 'auto'; } else { c.box.style.top = 'auto'; c.box.style.bottom = '0px'; } });
  capShade.style.cssText = V ? `left:0;top:0;width:${W}px;height:${H * 0.42}px;background:linear-gradient(180deg, rgba(8,14,22,.8), rgba(8,14,22,0))` : `left:0;top:0;width:${W * 0.62}px;height:${H}px`;
}
layoutCaps();
function drawCaps(t) {
  let shade = 0;
  for (const c of capNodes) {
    if (t < c.a - 0.05 || t > c.b + 0.05) { hide(c.box); continue; }
    c.box.style.visibility = 'visible'; c.box.style.opacity = 1;
    const out = P(t, c.b - 0.35, c.b);
    shade = Math.max(shade, Math.min(P(t, c.a, c.a + 0.4), 1 - out));
    c.words.forEach((w, i) => {
      const k = E.out(P(t, c.a + i * 0.085, c.a + i * 0.085 + 0.55));
      put(w, { y: (1 - k) * 46 - out * 30, o: k * (1 - out), blur: (1 - k) * 12 + out * 8 });
    });
  }
  capShade.style.opacity = shade * (V ? 1 : 0.9);
}

// ---------- backgrounds ----------
const bg = el(`<div class="full" id="bg"></div>`);
const bgBrand = el(`<div class="full" id="bgBrand"></div>`);
const bgEve = el(`<div class="full" id="bgEve"></div>`);
const netCv = el(`<canvas id="net"></canvas>`);
// map placement: left part behind the caption (16:9), lower middle (9:16)
const NET = V ? { x: 60, y: 760, w: 960, h: 980 } : { x: 80, y: 30, w: 1100, h: 1020 };
Object.assign(netCv.style, { left: NET.x + 'px', top: NET.y + 'px', width: NET.w + 'px', height: NET.h + 'px' });
const net = routeNet(netCv, { accent: '#e6cd92', trucks: 22, alpha: 0.9, labels: true, labelSize: 30, focus: ['S', 'HH'], pad: 30 });
const netFull = el(`<canvas id="net2" style="position:absolute;left:0;top:0;width:${W}px;height:${H}px"></canvas>`);
const net2 = routeNet(netFull, { accent: '#e6cd92', trucks: 26, alpha: 0.7, pad: V ? 120 : 60 });

// ---------- scene: clock (6:12) ----------
const clock = el(`<div class="abs clock" style="font-size:${V ? 300 : 340}px">06<span id="colon">:</span>12</div>`);
const vib = el(`<div class="abs badge" style="width:190px;height:190px;font-size:90px;border-radius:56px">${icon('smartphone')}</div>`);
// ---------- scene: phones ----------
const PH = (V ? [[120, 980], [620, 900], [380, 1240], [800, 1320], [140, 1540], [560, 1640]] : [[1000, 160], [1400, 120], [1240, 420], [1640, 380], [1060, 700], [1480, 690], [1720, 640], [820, 440]]);
const phones = PH.map(([x, y], i) => ({ x, y, n: el(`<div class="abs badge ${i % 3 === 1 ? 'red' : ''}">${icon(['phone', 'bell-ring', 'phone', 'message-square-text', 'phone', 'bell-ring', 'phone', 'message-square-text'][i])}</div>`), w: el(`<div class="abs wave"></div>`) }));
const cup = el(`<div class="abs" style="font-size:150px;color:#7f8b98">${icon('circle-pause')}</div>`);
// ---------- scene: chat ----------
const MSG = ['Bin da.', 'Rampe 4 ist zu.', 'Wo bist du?', 'Stau auf der A8', 'Wann kommst du?', 'Lieferschein??', 'Welcher LKW?', 'Kunde ruft an!', 'Warte seit 2 Std.', 'Wo bist du??', 'PIN vergessen', 'Bin gleich da'];
const bubbles = MSG.map((m, i) => ({ n: el(`<div class="abs bubble ${i % 3 === 2 ? 'me' : ''} ${/Wo bist|!|\?\?/.test(m) ? 'hot' : ''}">${m}</div>`), i }));
// ---------- scene: paper ----------
const notes = ['S-KL 2041<br>→ HH?', 'Mehmet<br>zurückrufen!!', 'Rampe 12<br>14 Uhr?', 'Paletten??'].map((t) => el(`<div class="abs note">${t}</div>`));
const sheet = el(`<div class="abs sheet"><div style="font-size:26px;margin-bottom:10px">Touren Freitag.xlsx</div>${Array.from({ length: 8 }, (_, i) => `<div class="r"><span>${['Bosch', 'Lidl', 'Porsche', 'REWE', 'Festo', 'IBM', 'Liebherr', 'MB'][i]}</span><span class="${[1, 4, 6].includes(i) ? 'x' : ''}">${['HH', 'K', 'M', 'HN', 'F', 'N', 'DO', 'L'][i]}</span><span class="${[2, 4].includes(i) ? 'x' : ''}">${['ok', '??', 'fehlt', 'ok', '??', 'ok', 'Stau', 'ok'][i]}</span><span>${i + 6}:00</span></div>`).join('')}</div>`);

    const z = E.io(P(lt, V ? 2.4 : 2.8, V ? 2.9 : 3.4));
    put(lapImg.live, { o: 1 - z }); put(lapImg.del, { o: z });
    const t1 = E.back(P(lt, 0.5, 1.0)), t2 = E.back(P(lt, 1.4, 1.9));
    const tx = V ? 270 : 1260, ty = V ? 560 : 120;
    put(toast2, { x: tx + (1 - t1) * 60, y: ty, o: P(lt, 0.5, 0.7) * fade * (1 - P(lt, 1.4, 1.7)), s: 1 });
    put(toast1, { x: tx + (1 - t2) * 60, y: ty + (V ? 0 : 0), o: P(lt, 1.4, 1.6) * fade, s: 1 + 0.03 * Math.sin(P(lt, 1.4, 2.2) * Math.PI) });
  } else { hide(laptop); hide(toast1); hide(toast2); }

  // ----- languages -----
  if (inWin(t, T.lang)) {
    const lt = t - T.lang[0], end = T.lang[1] - T.lang[0];
    const fade = vis(t, T.lang[0], T.lang[1], 0.4, 0.35);
    put(bigbtn, V ? { x: (W - 760) / 2, y: 900, o: fade, s: E.out(P(lt, 0, 0.5)) * 0.1 + 0.9 } : { x: 1000, y: 330, o: fade, s: E.out(P(lt, 0, 0.5)) * 0.1 + 0.9 });
    const per = (end - 0.5) / LANGS.length;
    const idx = Math.min(LANGS.length - 1, Math.floor(Math.max(0, lt - 0.2) / per));
    const into = P(lt - 0.2 - idx * per, 0, 0.22);
    lblSpans.forEach((s, i) => { if (i === idx) put(s, { y: (1 - E.out(into)) * 100, o: 1 }); else if (i === idx - 1) put(s, { y: -E.out(into) * 100, o: 1 - into }); else hide(s); });
    chipN.forEach((c, i) => c.classList.toggle('on', i === idx));
    put(chips, V ? { x: 160, y: 1160, o: fade } : { x: 1000, y: 580, o: fade });
    if (!V) put(shield, { x: 1000, y: 800, o: fade * P(lt, 0.8, 1.2) }); else put(shield, { x: 120, y: 1520, o: fade * P(lt, 0.8, 1.2), s: 0.9 });
  } else { hide(bigbtn); hide(chips); hide(shield); }

  // ----- evening -----
  if (inWin(t, T.eve)) {
    const lt = t - T.eve[0], end = T.eve[1] - T.eve[0];
    const fade = vis(t, T.eve[0], T.eve[1], 0.5, 0.4);
    put(clock17, V ? { x: 290, y: 600, o: fade * P(lt, 0, 0.6) } : { x: 1180, y: 60, o: fade * P(lt, 0, 0.6) });
    const pk = E.out(P(lt, 0.3, 1.1));
    put(proof, V ? { x: 120, y: 900 + (1 - pk) * 200, r: -4, o: fade * pk } : { x: 840, y: 300 + (1 - pk) * 200, r: -5, o: fade * pk, s: 0.95 });
    const ik = E.out(P(lt, 1.0, 1.7));
    put(invoice2, V ? { x: 560, y: 1150 + (1 - ik) * 200, r: 5, o: fade * ik } : { x: 1380, y: 380 + (1 - ik) * 200, r: 5, o: fade * ik });
    const sk = P(lt, 2.2, 2.45);
    put(stampOk, V ? { x: 600, y: 1420, s: lerp(2.4, 1, E.in(sk)), r: -12, o: sk * fade } : { x: 1420, y: 640, s: lerp(2.4, 1, E.in(sk)), r: -12, o: sk * fade });
  } else { hide(clock17); hide(proof); hide(invoice2); hide(stampOk); }

  // ----- stats -----
  if (inWin(t, T.stats)) {
    const lt = t - T.stats[0];
    const fade = vis(t, T.stats[0], T.stats[1], 0.5, 0.4);
    stats.forEach((s, i) => {
      const k = E.out(P(lt, 0.3 + i * 0.9, 1.0 + i * 0.9));
      const val = Math.round(s.v * E.out(P(lt, 0.4 + i * 0.9, 1.8 + i * 0.9)));
      s.n.querySelector('.v').textContent = (s.v < 0 ? '−' + Math.abs(val) : val) + s.u;
      put(s.n, { x: 150 + i * 560, y: 280 + (1 - k) * 60, o: k * fade });
    });
    put(foot, { x: 150, y: 920, o: fade * P(lt, 3.0, 3.6) });
  } else { stats.forEach((s) => hide(s.n)); hide(foot); }

  // ----- own logo -----
  if (inWin(t, T.logos)) {
    const lt = t - T.logos[0], end = T.logos[1] - T.logos[0];
    const fade = vis(t, T.logos[0], T.logos[1], 0.5, 0.4);
    put(home, { x: 1020, y: 90, o: fade * E.out(P(lt, 0, 0.5)), s: 1 });
    const step = Math.min(2, Math.floor(P(lt, 0.6, 3.0) * 3));
    icons3.forEach((n, i) => put(n, { o: i === step ? 1 : i === step - 1 ? 1 - P(lt, 0.6 + step * 0.8, 0.85 + step * 0.8) : 0, s: i === step ? lerp(0.8, 1, E.back(P(lt, 0.6 + step * 0.8, 0.95 + step * 0.8))) : 1 }));
    names3.forEach((n, i) => put(n, { o: i === step ? 1 : 0 }));
    const kk = E.out(P(lt, 0.9, 1.6)), nk = E.out(P(lt, 1.8, 2.5));
    put(logK, { x: 1500, y: 180, s: 0.62, o: fade * kk, r: 4 });
    put(logN, { x: 1560, y: 260, s: 0.62, o: fade * nk, r: 8 });
  } else { hide(home); hide(logK); hide(logN); }
  // vertical: own-logo icon swap inside the language scene
  if (V && inWin(t, T.lang)) {
    const lt = t - T.lang[0];
    put(home, { x: (W - 430) / 2, y: -40, s: 0.52, o: 0 });
  }

  // ----- end card -----
  if (inWin(t, T.end)) {
    const lt = (t - T.end[0]) * (V ? 1.7 : 1);
    const a = E.out(P(lt, 0.2, 1.0)), b = E.out(P(lt, 0.7, 1.5)), c = E.out(P(lt, 1.2, 2.0)), d = E.out(P(lt, 1.6, 2.4));
    const cx = (w) => (W - w) / 2;
    put(endWm, { x: cx(endWm.offsetWidth), y: (V ? 640 : 230) + (1 - a) * 40, o: a });
    put(endClaim, { x: cx(endClaim.offsetWidth), y: (V ? 860 : 430) + (1 - b) * 40, o: b, blur: (1 - b) * 8 });
    put(endSub, { x: cx(endSub.offsetWidth), y: (V ? 1000 : 560) + (1 - b) * 30, o: b });
    put(endCta, { x: cx(endCta.offsetWidth), y: (V ? 1180 : 680) + (1 - c) * 30, o: c, s: 1 + 0.02 * Math.sin(lt * 3) * c });
    put(endUrl, { x: cx(endUrl.offsetWidth), y: (V ? 1350 : 840), o: d });
  } else { [endWm, endClaim, endSub, endCta, endUrl].forEach(hide); }

  drawCaps(t);
  drawGrain(t);
}
window.render = render;


window.READY = (async () => {
  window.ASSETS = await fetch('assets/assets.json').then((r) => r.json()).catch(() => ({}));
  await document.fonts.ready;
  await Promise.all([...document.images].map((i) => (i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; }))));
  render(0);
})();

if (Q.has('play')) {
  const t0 = performance.now();
  const loop = () => { const t = ((performance.now() - t0) / 1000) % DUR; render(t); requestAnimationFrame(loop); };
  window.READY.then(loop);
}
if (Q.has('t')) window.READY.then(() => render(Number(Q.get('t'))));
</script>
</body>
</html>
